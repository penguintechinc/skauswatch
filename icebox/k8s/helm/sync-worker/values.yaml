replicaCount: 1

image:
  repository: registry-dal2.penguintech.cloud/skauswatch/icebox-sync-worker
  tag: "latest"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  DB_TYPE: "postgresql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "icebox"
  DB_POOL_SIZE: "5"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  SYNC_POLL_INTERVAL: "300"
  MAX_CONCURRENT_SYNCS: "5"

secrets:
  DB_USER: "icebox-sync"
  DB_PASS: "changeme"
  REDIS_PASS: ""
  ICEBOX_MEK: "changeme-32-chars-minimum-length!"
  # Cloud provider credentials — set per-environment
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  AZURE_TENANT_ID: ""
  AZURE_CLIENT_ID: ""
  AZURE_CLIENT_SECRET: ""
  GCP_SERVICE_ACCOUNT_JSON: ""
  OCI_CONFIG: ""
  K8S_KUBECONFIG: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
