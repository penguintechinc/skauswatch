replicaCount: 1

image:
  repository: icebox-flask-backend
  tag: "latest"
  pullPolicy: Never

ingress:
  enabled: true
  host: icebox.skauswatch.localhost.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  DB_HOST: "postgres"
  REDIS_HOST: "redis"
  LOG_LEVEL: "debug"
  RELEASE_MODE: "false"

secrets:
  DB_PASS: "icebox-alpha-pass"
  ICEBOX_MEK: "alpha-dev-mek-32-chars-min-length"
  JWT_SECRET: "alpha-jwt-secret-key"
