replicaCount: 1

image:
  repository: registry-dal2.penguintech.cloud/skauswatch/icebox-flask-backend
  pullPolicy: Always

ingress:
  enabled: true
  host: icebox.skauswatch.penguintech.cloud
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: icebox-flask-tls-beta
      hosts:
        - icebox.skauswatch.penguintech.cloud

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  LOG_LEVEL: "info"
  RELEASE_MODE: "false"
