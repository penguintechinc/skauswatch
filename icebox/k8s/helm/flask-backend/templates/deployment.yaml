apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "icebox-flask-backend.fullname" . }}
  labels:
    {{- include "icebox-flask-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "icebox-flask-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "icebox-flask-backend.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      {{- if .Values.migration.enabled }}
      initContainers:
        - name: migrate
          image: {{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}
          command: ["alembic", "upgrade", "head"]
          workingDir: /app
          env:
            - name: DB_TYPE
              value: {{ .Values.env.DB_TYPE | quote }}
            - name: DB_HOST
              value: {{ .Values.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.env.DB_PORT | quote }}
            - name: DB_NAME
              value: {{ .Values.env.DB_NAME | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "icebox-flask-backend.fullname" . }}-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "icebox-flask-backend.fullname" . }}-secrets
                  key: DB_PASS
          securityContext:
            allowPrivilegeEscalation: false
      {{- end }}
      containers:
        - name: flask-backend
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_TYPE
              value: {{ .Values.env.DB_TYPE | quote }}
            - name: DB_HOST
              value: {{ .Values.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.env.DB_PORT | quote }}
            - name: DB_NAME
              value: {{ .Values.env.DB_NAME | quote }}
            - name: DB_POOL_SIZE
              value: {{ .Values.env.DB_POOL_SIZE | quote }}
            - name: REDIS_HOST
              value: {{ .Values.env.REDIS_HOST | quote }}
            - name: REDIS_PORT
              value: {{ .Values.env.REDIS_PORT | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: LICENSE_SERVER_URL
              value: {{ .Values.env.LICENSE_SERVER_URL | quote }}
            - name: PRODUCT_NAME
              value: {{ .Values.env.PRODUCT_NAME | quote }}
            - name: RELEASE_MODE
              value: {{ .Values.env.RELEASE_MODE | quote }}
            - name: JIT_REVOCATION_INTERVAL
              value: {{ .Values.env.JIT_REVOCATION_INTERVAL | quote }}
            - name: LICENSE_CHECK_INTERVAL
              value: {{ .Values.env.LICENSE_CHECK_INTERVAL | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "icebox-flask-backend.fullname" . }}-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "icebox-flask-backend.fullname" . }}-secrets
                  key: DB_PASS
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "icebox-flask-backend.fullname" . }}-secrets
                  key: REDIS_PASS
            - name: ICEBOX_MEK
              valueFrom:
                secretKeyRef:
                  name: {{ include "icebox-flask-backend.fullname" . }}-secrets
                  key: ICEBOX_MEK
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "icebox-flask-backend.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "icebox-flask-backend.fullname" . }}-secrets
                  key: LICENSE_KEY
                  optional: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
