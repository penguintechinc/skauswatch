apiVersion: v1
kind: Secret
metadata:
  name: {{ include "icebox-flask-backend.fullname" . }}-secrets
  labels:
    {{- include "icebox-flask-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.DB_USER | quote }}
  DB_PASS: {{ .Values.secrets.DB_PASS | quote }}
  REDIS_PASS: {{ .Values.secrets.REDIS_PASS | quote }}
  ICEBOX_MEK: {{ .Values.secrets.ICEBOX_MEK | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  LICENSE_KEY: {{ .Values.secrets.LICENSE_KEY | quote }}
