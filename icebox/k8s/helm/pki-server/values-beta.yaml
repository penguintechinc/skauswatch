image:
  repository: registry-dal2.penguintech.cloud/skauswatch/icebox-pki-server
  pullPolicy: Always

ingress:
  host: icebox.skauswatch.penguintech.cloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: icebox-pki-tls
      hosts:
        - icebox.skauswatch.penguintech.cloud

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  LOG_LEVEL: "info"
