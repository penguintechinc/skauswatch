apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: icebox

resources:
  - namespace.yaml
  - networkpolicy.yaml
  # flask-backend — REST API: secrets, JIT, one-time, sync, admin, audit
  - flask-backend/deployment.yaml
  - flask-backend/service.yaml
  - flask-backend/configmap.yaml
  - flask-backend/secret.yaml
  # sync-worker — Redis Streams consumer: AWS/Azure/GCP/Oracle/K8s
  - sync-worker/deployment.yaml
  - sync-worker/configmap.yaml
  - sync-worker/secret.yaml
  # pki-server — X.509 certificate lifecycle (absorbed from SkausWatch core)
  - pki-server/deployment.yaml
  - pki-server/service.yaml
  - pki-server/configmap.yaml
  - pki-server/secret.yaml
  # ssh-ca — SSH certificate authority (absorbed from SkausWatch core)
  - ssh-ca/deployment.yaml
  - ssh-ca/service.yaml
  - ssh-ca/configmap.yaml
  - ssh-ca/secret.yaml
  # webui — React+nginx frontend (nginx proxies /api/ to flask-backend)
  - webui/deployment.yaml
  - webui/service.yaml
  - webui/configmap.yaml
