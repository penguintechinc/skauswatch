apiVersion: apps/v1
kind: Deployment
metadata:
  name: icebox-flask-backend
  namespace: icebox
  labels:
    app.kubernetes.io/name: icebox-flask-backend
    app.kubernetes.io/component: flask-backend
    app.kubernetes.io/part-of: icebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: icebox-flask-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: icebox-flask-backend
        app.kubernetes.io/component: flask-backend
        app.kubernetes.io/part-of: icebox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
      initContainers:
        - name: migrate
          image: icebox-flask-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: icebox-flask-backend-secrets
          env:
            - name: DB_TYPE
              valueFrom:
                configMapKeyRef:
                  name: icebox-flask-backend-config
                  key: DB_TYPE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: icebox-flask-backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: icebox-flask-backend-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: icebox-flask-backend-config
                  key: DB_NAME
      containers:
        - name: flask-backend
          image: icebox-flask-backend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: icebox-flask-backend-config
            - secretRef:
                name: icebox-flask-backend-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
