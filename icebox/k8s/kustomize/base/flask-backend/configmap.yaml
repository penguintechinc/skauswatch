apiVersion: v1
kind: ConfigMap
metadata:
  name: icebox-flask-backend-config
  namespace: icebox
data:
  DB_TYPE: "postgresql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "icebox"
  DB_POOL_SIZE: "5"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  LICENSE_SERVER_URL: "https://license.penguintech.io"
  PRODUCT_NAME: "icebox"
  RELEASE_MODE: "false"
  JIT_REVOCATION_INTERVAL: "60"
  LICENSE_CHECK_INTERVAL: "21600"
