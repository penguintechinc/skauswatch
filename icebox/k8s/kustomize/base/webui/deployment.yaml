apiVersion: apps/v1
kind: Deployment
metadata:
  name: icebox-webui
  namespace: icebox
  labels:
    app.kubernetes.io/name: icebox-webui
    app.kubernetes.io/component: webui
    app.kubernetes.io/part-of: icebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: icebox-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: icebox-webui
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 101
      containers:
        - name: webui
          image: icebox-webui:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: icebox-webui-nginx
