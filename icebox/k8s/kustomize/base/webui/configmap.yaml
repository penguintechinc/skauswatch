apiVersion: v1
kind: ConfigMap
metadata:
  name: icebox-webui-nginx
  namespace: icebox
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Health check — used by liveness/readiness probes
        location /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # Proxy all /api/ requests to the flask-backend service
        location /api/ {
            proxy_pass http://icebox-flask-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # SPA routing — all /vault/* paths serve the React app
        location /vault {
            try_files $uri $uri/ /index.html;
        }

        # Root redirect to vault dashboard
        location = / {
            return 301 /vault;
        }

        # Static assets with cache headers
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
