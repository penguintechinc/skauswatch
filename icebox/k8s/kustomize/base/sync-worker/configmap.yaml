apiVersion: v1
kind: ConfigMap
metadata:
  name: icebox-sync-worker-config
  namespace: icebox
data:
  DB_TYPE: "postgresql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "icebox"
  DB_POOL_SIZE: "5"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  SYNC_POLL_INTERVAL: "300"
  MAX_CONCURRENT_SYNCS: "5"
