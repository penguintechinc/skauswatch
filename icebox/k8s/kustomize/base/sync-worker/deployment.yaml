apiVersion: apps/v1
kind: Deployment
metadata:
  name: icebox-sync-worker
  namespace: icebox
  labels:
    app.kubernetes.io/name: icebox-sync-worker
    app.kubernetes.io/component: sync-worker
    app.kubernetes.io/part-of: icebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: icebox-sync-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: icebox-sync-worker
        app.kubernetes.io/component: sync-worker
        app.kubernetes.io/part-of: icebox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
      containers:
        - name: sync-worker
          image: icebox-sync-worker:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: icebox-sync-worker-config
            - secretRef:
                name: icebox-sync-worker-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
