apiVersion: apps/v1
kind: Deployment
metadata:
  name: icebox-ssh-ca
  namespace: icebox
  labels:
    app.kubernetes.io/name: icebox-ssh-ca
    app.kubernetes.io/component: ssh-ca
    app.kubernetes.io/part-of: icebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: icebox-ssh-ca
  template:
    metadata:
      labels:
        app.kubernetes.io/name: icebox-ssh-ca
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
      containers:
        - name: ssh-ca
          image: icebox-ssh-ca:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: icebox-ssh-ca-config
            - secretRef:
                name: icebox-ssh-ca-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
