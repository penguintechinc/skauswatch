apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: icebox

resources:
  - ../../base

# Beta image overrides — pulled from dal2 registry
# Replace these tags with actual beta build tags before deploying
images:
  - name: icebox-flask-backend
    newName: registry-dal2.penguintech.cloud/skauswatch/icebox-flask-backend
    newTag: beta-latest
  - name: icebox-sync-worker
    newName: registry-dal2.penguintech.cloud/skauswatch/icebox-sync-worker
    newTag: beta-latest
  - name: icebox-pki-server
    newName: registry-dal2.penguintech.cloud/skauswatch/icebox-pki-server
    newTag: beta-latest
  - name: icebox-ssh-ca
    newName: registry-dal2.penguintech.cloud/skauswatch/icebox-ssh-ca
    newTag: beta-latest
  - name: icebox-webui
    newName: registry-dal2.penguintech.cloud/skauswatch/icebox-webui
    newTag: beta-latest

# Beta config patches — info logging, moderate resources
patches:
  # flask-backend: info logging + moderate pool
  - target:
      kind: ConfigMap
      name: icebox-flask-backend-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/DB_POOL_SIZE
        value: "5"
      - op: replace
        path: /data/REDIS_POOL_SIZE
        value: "5"
      - op: add
        path: /data/BASE_URL
        value: "https://icebox.skauswatch.penguintech.cloud"

  # sync-worker: info logging + moderate concurrency
  - target:
      kind: ConfigMap
      name: icebox-sync-worker-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/DB_POOL_SIZE
        value: "5"
      - op: replace
        path: /data/MAX_CONCURRENT_SYNCS
        value: "5"

  # pki-server: info logging
  - target:
      kind: ConfigMap
      name: icebox-pki-server-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/DB_POOL_SIZE
        value: "5"

  # ssh-ca: info logging
  - target:
      kind: ConfigMap
      name: icebox-ssh-ca-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/DB_POOL_SIZE
        value: "5"

  # All deployments: set imagePullPolicy to Always for beta (registry images)
  - target:
      kind: Deployment
      name: icebox-flask-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"

  - target:
      kind: Deployment
      name: icebox-sync-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"

  - target:
      kind: Deployment
      name: icebox-pki-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"

  - target:
      kind: Deployment
      name: icebox-ssh-ca
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"

  - target:
      kind: Deployment
      name: icebox-webui
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"
