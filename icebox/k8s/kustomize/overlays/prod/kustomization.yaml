apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: icebox

resources:
  - ../../base

# Production image overrides — pulled from production registry
images:
  - name: icebox-flask-backend
    newName: registry.penguincloud.io/skauswatch/icebox-flask-backend
    newTag: latest
  - name: icebox-sync-worker
    newName: registry.penguincloud.io/skauswatch/icebox-sync-worker
    newTag: latest
  - name: icebox-pki-server
    newName: registry.penguincloud.io/skauswatch/icebox-pki-server
    newTag: latest
  - name: icebox-ssh-ca
    newName: registry.penguincloud.io/skauswatch/icebox-ssh-ca
    newTag: latest
  - name: icebox-webui
    newName: registry.penguincloud.io/skauswatch/icebox-webui
    newTag: latest

# Production config patches — warn logging, full resources, autoscaling
patches:
  # flask-backend: warn logging + large pool + release mode
  - target:
      kind: ConfigMap
      name: icebox-flask-backend-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "warn"
      - op: replace
        path: /data/DB_POOL_SIZE
        value: "20"
      - op: replace
        path: /data/REDIS_POOL_SIZE
        value: "10"
      - op: add
        path: /data/BASE_URL
        value: "https://skauswatch.app"
      - op: add
        path: /data/RELEASE_MODE
        value: "true"

  # sync-worker: warn logging + high concurrency
  - target:
      kind: ConfigMap
      name: icebox-sync-worker-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "warn"
      - op: replace
        path: /data/DB_POOL_SIZE
        value: "20"
      - op: replace
        path: /data/MAX_CONCURRENT_SYNCS
        value: "10"
      - op: add
        path: /data/RELEASE_MODE
        value: "true"

  # pki-server: warn logging + production pool
  - target:
      kind: ConfigMap
      name: icebox-pki-server-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "warn"
      - op: replace
        path: /data/DB_POOL_SIZE
        value: "10"

  # ssh-ca: warn logging + production pool
  - target:
      kind: ConfigMap
      name: icebox-ssh-ca-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "warn"
      - op: replace
        path: /data/DB_POOL_SIZE
        value: "10"

  # flask-backend deployment: production resources + replicas + imagePullPolicy
  - target:
      kind: Deployment
      name: icebox-flask-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

  # sync-worker deployment: production resources + replicas
  - target:
      kind: Deployment
      name: icebox-sync-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  # pki-server + ssh-ca: production resources + imagePullPolicy
  - target:
      kind: Deployment
      name: icebox-pki-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  - target:
      kind: Deployment
      name: icebox-ssh-ca
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  # webui: production resources + replicas
  - target:
      kind: Deployment
      name: icebox-webui
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: "Always"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
