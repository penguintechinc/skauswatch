# IceBox sub-module — local development compose file.
# NOTE: docker compose is deprecated for production; use Kustomize (alpha) or Helm (beta/prod).
# This file is retained for local development reference only.
#
# Build context for sync-worker is icebox/services/ (not icebox/services/sync-worker/)
# because the Dockerfile needs access to flask-backend/crypto and flask-backend/models.
#
# Bring up:
#   docker compose -f icebox/docker-compose.yml up
#
# Run migrations first:
#   docker compose -f icebox/docker-compose.yml run --rm flask-backend \
#     sh -c "cd /app && alembic upgrade head"

services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-bookworm@sha256:7858a1a43bb2e3decc07650c8989ba526e0a8164f212c9bb88b622cdbd71c4be
    environment:
      POSTGRES_DB: icebox
      POSTGRES_USER: icebox
      POSTGRES_PASSWORD: changeme
    volumes:
      - icebox-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icebox"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icebox

  redis:
    image: redis:7-bookworm@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icebox

  # ── IceBox Services ──────────────────────────────────────────────────────────

  flask-backend:
    build:
      context: ./services/flask-backend
      dockerfile: Dockerfile
    image: icebox-flask-backend:dev
    environment:
      # Database
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: icebox
      DB_USER: icebox
      DB_PASS: changeme
      DB_POOL_SIZE: "5"
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Encryption — local dev MEK (never use in production)
      ICEBOX_MEK_V1: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
      # Auth
      JWT_SECRET: dev-jwt-secret-change-in-prod
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_SECONDS: "3600"
      # Service config
      LOG_LEVEL: debug
      FLASK_ENV: development
      # License — auto-bypass on localhost.local domains; no key needed in dev
      LICENSE_SERVER_URL: https://license.penguintech.io
      # Internal URLs for PKI / SSH CA delegation
      ICEBOX_PKI_URL: http://pki-server:8081
      ICEBOX_SSH_CA_URL: http://ssh-ca:8082
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - icebox
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  sync-worker:
    build:
      # Build context is services/ so Dockerfile can COPY flask-backend/crypto and models
      context: ./services
      dockerfile: sync-worker/Dockerfile
    image: icebox-sync-worker:dev
    environment:
      # Database
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: icebox
      DB_USER: icebox
      DB_PASS: changeme
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Encryption — must match flask-backend MEK
      ICEBOX_MEK_V1: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - icebox
    restart: unless-stopped

  pki-server:
    build:
      context: ./services/pki-server
      dockerfile: Dockerfile
    image: icebox-pki-server:dev
    environment:
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: icebox
      DB_USER: icebox
      DB_PASS: changeme
      LOG_LEVEL: debug
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icebox
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  ssh-ca:
    build:
      context: ./services/ssh-ca
      dockerfile: Dockerfile
    image: icebox-ssh-ca:dev
    environment:
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: icebox
      DB_USER: icebox
      DB_PASS: changeme
      LOG_LEVEL: debug
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icebox
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8082/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

networks:
  icebox:
    driver: bridge

volumes:
  icebox-pg-data:
