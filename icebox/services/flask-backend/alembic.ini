# Alembic configuration for IceBox flask-backend
# Run migrations manually: alembic upgrade head
# Never run alembic inside application startup code.

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Template for new migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Truncate long slug at this many chars
truncate_slug_length = 40

# Set to 'true' to enable output buffering — recommended for CI
output_encoding = utf-8

# Database URL — override via environment variable ALEMBIC_DATABASE_URL
# or set sqlalchemy.url below. The env.py reads DATABASE_URL at runtime.
sqlalchemy.url = postgresql://icebox:changeme@localhost:5432/icebox


[post_write_hooks]
# No post-write hooks configured


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
