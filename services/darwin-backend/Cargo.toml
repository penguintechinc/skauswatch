[package]
name = "skauswatch-darwin-backend"
description = "SkausWatch Darwin AI-code-review backend — REST /api/v1/darwin + credentials (Rust port of darwin/services/flask-backend)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "darwin-backend"
path = "src/main.rs"

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
jsonwebtoken = { workspace = true }
penguin-licensing = { workspace = true, features = ["axum"] }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skauswatch-db = { workspace = true }
skauswatch-streams = { workspace = true }
skauswatch-telemetry = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }

[lints]
workspace = true
