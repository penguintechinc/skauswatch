[package]
publish = false
name = "skauswatch-svc-ingest"
description = "SkausWatch svc-ingest — multi-protocol SIEM log ingest (syslog/OTLP/HTTPS) normalizing to OCSF, buffered through NATS JetStream, writing to the unified OpenSearch lake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "skauswatch-svc-ingest"
path = "src/main.rs"

# `testutil` compiles `crate::buffer::InMemoryBuffer` (normally
# test-only/`cfg(test)`-gated) outside of `cargo test` too — for local
# dev/manual runs against the in-process fallback without a live NATS
# broker. Never enabled in the shipped container image.
[features]
testutil = []

[dependencies]
anyhow = { workspace = true }
# async-trait: `EventBuffer` and the `buffer::jetstream` internal
# publish-ack seam are both `#[async_trait::async_trait]` traits — added
# by Task 0.3, not in Task 0.2's original dependency list. Already pinned
# in `[workspace.dependencies]` (`=0.1.89`).
async-trait = { workspace = true }
axum = { workspace = true }
# bytes: `async_nats::jetstream::Context::publish_with_headers` takes a
# `bytes::Bytes` payload; async-nats does not re-export `bytes` at its
# crate root, so this is a direct dependency (Task 0.3). Already pinned in
# `[workspace.dependencies]` (`=1.12.1`).
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# futures: `JetStreamBuffer::consume` iterates the `futures_util::Stream`
# JetStream's pull-consumer `fetch().messages()` returns; async-nats
# re-exports neither `futures` nor `futures_util`. Already pinned in
# `[workspace.dependencies]` (`=0.3.32`).
futures = { workspace = true }
jsonwebtoken = { workspace = true }
metrics = { workspace = true }
penguin-licensing = { workspace = true, features = ["axum"] }
prost = { workspace = true }
prost-types = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skauswatch-auth = { workspace = true }
skauswatch-db = { workspace = true }
skauswatch-identity = { workspace = true }
skauswatch-ocsf = { workspace = true }
skauswatch-proto = { workspace = true }
skauswatch-telemetry = { workspace = true }
spiffe = { workspace = true }
# sqlx: not in the Spec's explicit svc-ingest dependency list, but required
# structurally by this task's own Interfaces contract (`static MIGRATOR:
# sqlx::migrate::Migrator = sqlx::migrate!();` in main.rs) — same
# migrate-subcommand pattern already used by every other service (see
# services/pki/Cargo.toml). Justified addition, same precedent as Task
# 0.1's serde gap (see progress.md).
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
# "yaml" adds serde_yaml so `skauswatch-svc-ingest openapi` can emit true
# YAML for openapi/v1.yaml (workspace default features are json-only) — see
# docs/v2-port/openapi-pattern.md.
utoipa = { workspace = true, features = ["yaml"] }
uuid = { workspace = true }
# Pinned directly (not `{ workspace = true }`) per the Spec's exact
# requirement (§7b, §14c2): "Do NOT allow cargo to bump to a newer 0.y.z or
# 1.x without explicit review and smoke test re-run." default-features off
# — only the `jetstream` feature is needed, no core-NATS pub/sub surface.
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream"] }
# Task 1.4: SHA-256-hash ingest tokens before any DB lookup/storage (Spec
# §6b) — already workspace-pinned (`[workspace.dependencies]`, `=0.10.9`),
# used the same way by `crates/skauswatch-scan-core`. Coordinator-approved
# Cargo.toml addition (Task-0.2 gap: this dependency edge was never wired
# for svc-ingest even though the workspace pin already existed).
sha2 = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
mockall = { workspace = true }
# p256/pkcs8/rand_core: Task 3.0's `tests/common` harness mints its own
# ES256 (P-256) fixture keypair (private PEM stays in-process to sign test
# bearer tokens; public PEM is passed to the spawned receiver subprocess as
# `JWT_VERIFY_KEY`) — the same technique `skauswatch_auth::
# shared_dev_keypair`/`skauswatch_testkit::jwt` use, but generated
# independently here because the harness spawns svc-ingest as a *separate
# OS process*: that process's own `ephemeral_dev_keypair()` `OnceLock` is
# never shared with (and can't be read back from) this test binary, so the
# usual in-process fixture-keypair sharing this workspace otherwise relies
# on doesn't apply across a process boundary. Already workspace-pinned
# (`[workspace.dependencies]`), same versions `skauswatch-auth` builds
# against.
p256 = { workspace = true }
pkcs8 = { workspace = true }
rand_core = { workspace = true }
skauswatch-testkit = { workspace = true }
# testcontainers: Task 3.0's shared e2e harness (`tests/common`) — starts
# real NATS (JetStream) and OpenSearch containers so receiver/writer
# subprocesses exercise the genuine wire protocols instead of an in-process
# mock. Exact-pinned per house policy (`critical-rules.md` Dependency
# Pinning); MIT OR Apache-2.0, `testcontainers/testcontainers-rs` (Western,
# non-PRC). `testcontainers-modules`'s bundled `nats` feature was evaluated
# and rejected: it defaults to NATS 2.10.14 (below this task's NATS 2.14+
# requirement) and its `NatsServerCmd` builder has no `sync_always`/custom
# store-dir knobs, and it ships no `opensearch` module at all — so both
# containers are built directly on `testcontainers::GenericImage` instead,
# one dependency covering both rather than a partial-fit second one.
testcontainers = "=0.28.0"
wiremock = { workspace = true }

[lints]
workspace = true
