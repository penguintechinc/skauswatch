openapi: 3.0.3
info:
  title: SkausWatch Backend API
  description: REST API for SkausWatch service — authentication, user management, SPIRE integration
  version: 1.0.0
  contact:
    name: PenguinTech
    email: support@penguintech.io
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: Production API

paths:
  /auth/login:
    post:
      summary: Login user
      description: Authenticate with email and password, returns access and refresh tokens
      operationId: login
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email/password or account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh access token
      description: Exchange refresh token for new access token and refresh token
      operationId: refresh
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token expired, invalid, revoked, or user deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Logout user
      description: Revokes all refresh tokens for the current user
      operationId: logout
      tags:
        - auth
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Unauthorized — invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Get current user profile
      description: Returns authenticated user's profile information
      operationId: getCurrentUser
      tags:
        - auth
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized — invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      summary: Register new user
      description: Self-register a new user account (default role is viewer)
      operationId: register
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error (missing fields, password too short, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hello:
    get:
      summary: Hello endpoint
      description: Test authenticated endpoint — returns greeting with user info
      operationId: hello
      tags:
        - hello
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        '401':
          description: Unauthorized — invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hello/protected:
    get:
      summary: Protected hello endpoint
      description: Requires maintainer or admin role
      operationId: helloProtected
      tags:
        - hello
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloProtectedResponse'
        '401':
          description: Unauthorized — invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hello/status:
    get:
      summary: Service status
      description: Public endpoint — no authentication required
      operationId: status
      tags:
        - hello
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /users:
    get:
      summary: List users
      description: List all users with pagination (admin only)
      operationId: listUsers
      tags:
        - users
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Items per page (max 100)
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create user
      description: Create new user (admin only)
      operationId: createUser
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}:
    get:
      summary: Get user by ID
      description: Retrieve user by ID (admin only)
      operationId: getUser
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update user
      description: Update user by ID (admin only)
      operationId: updateUser
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
        '400':
          description: Validation error or no valid fields to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete user
      description: Delete user by ID (admin only, cannot delete self)
      operationId: deleteUser
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          description: Cannot delete own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error during deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/roles:
    get:
      summary: Get available roles
      description: List valid user roles and descriptions (admin only)
      operationId: getRoles
      tags:
        - users
      responses:
        '200':
          description: Roles retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spire/status:
    get:
      summary: Get SPIRE server status
      description: Retrieve SPIRE server health and stats (admin only)
      operationId: getSpireStatus
      tags:
        - spire
      responses:
        '200':
          description: SPIRE status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpireStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spire/entries:
    get:
      summary: List SPIFFE entries
      description: List all registered SPIFFE entries (admin only)
      operationId: listEntries
      tags:
        - spire
      responses:
        '200':
          description: Entries retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntriesListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create SPIFFE entry
      description: Register a new SPIFFE entry (admin only)
      operationId: createEntry
      tags:
        - spire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpireEntry'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spire/entries/{entryId}:
    delete:
      summary: Delete SPIFFE entry
      description: Delete a SPIFFE entry by ID (admin only)
      operationId: deleteEntry
      tags:
        - spire
      parameters:
        - in: path
          name: entryId
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_\-]+$'
          description: SPIFFE entry ID
      responses:
        '204':
          description: Entry deleted
        '400':
          description: Invalid entry ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spire/nodes:
    get:
      summary: List SPIRE agents
      description: List attested SPIRE agents (nodes) (admin only)
      operationId: listNodes
      tags:
        - spire
      responses:
        '200':
          description: Nodes retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodesListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spire/nodes/join-token:
    post:
      summary: Generate join token
      description: Generate a join token for enrolling new nodes (admin only)
      operationId: createJoinToken
      tags:
        - spire
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinTokenRequest'
      responses:
        '201':
          description: Join token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinTokenResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spire/federation:
    get:
      summary: List federation peers
      description: List federated trust domains (admin only)
      operationId: listFederation
      tags:
        - spire
      responses:
        '200':
          description: Federation peers retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spire/federation/peers:
    post:
      summary: Add federation peer
      description: Add a federation relationship with another trust domain (admin only)
      operationId: addFederationPeer
      tags:
        - spire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFederationPeerRequest'
      responses:
        '201':
          description: Federation peer added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationPeer'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spire/federation/peers/{trustDomain}:
    delete:
      summary: Remove federation peer
      description: Delete a federation relationship (admin only)
      operationId: deleteFederationPeer
      tags:
        - spire
      parameters:
        - in: path
          name: trustDomain
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._\-]+$'
          description: Trust domain name
      responses:
        '204':
          description: Federation peer removed
        '400':
          description: Invalid trust domain format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spire/datastore/migrate:
    post:
      summary: Migrate datastore
      description: Trigger datastore migration (e.g. SQLite → PostgreSQL) (admin only)
      operationId: migrateDatastore
      tags:
        - spire
      responses:
        '202':
          description: Migration in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SPIRE not enabled or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (Bearer <token>)

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          description: User password (plaintext)

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token TTL in seconds
        user:
          $ref: '#/components/schemas/UserInfo'

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token from previous login/refresh

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          description: New JWT access token
        refresh_token:
          type: string
          description: New JWT refresh token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token TTL in seconds

    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: Successfully logged out
        tokens_revoked:
          type: integer
          description: Number of refresh tokens revoked

    UserInfo:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [admin, maintainer, viewer]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [admin, maintainer, viewer]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Password (minimum 8 characters)
        full_name:
          type: string
          description: Optional full name

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: Registration successful
        user:
          $ref: '#/components/schemas/UserInfo'

    CreateUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
        role:
          type: string
          enum: [admin, maintainer, viewer]
          default: viewer

    CreateUserResponse:
      type: object
      properties:
        message:
          type: string
          example: User created successfully
        user:
          $ref: '#/components/schemas/User'

    UpdateUserRequest:
      type: object
      description: All fields are optional; only provided fields are updated
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [admin, maintainer, viewer]
        is_active:
          type: boolean
        password:
          type: string
          minLength: 8

    UpdateUserResponse:
      type: object
      properties:
        message:
          type: string
          example: User updated successfully
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [admin, maintainer, viewer]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          type: object
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            pages:
              type: integer

    RolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
          example: [admin, maintainer, viewer]
        descriptions:
          type: object
          properties:
            admin:
              type: string
              example: "Full access: user CRUD, settings, all features"
            maintainer:
              type: string
              example: "Read/write access to resources, no user management"
            viewer:
              type: string
              example: Read-only access to resources

    HelloResponse:
      type: object
      properties:
        message:
          type: string
          example: Hello, User Name!
        timestamp:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
              format: email
            role:
              type: string
              enum: [admin, maintainer, viewer]

    HelloProtectedResponse:
      type: object
      properties:
        message:
          type: string
          example: Hello, User Name! You have elevated access.
        timestamp:
          type: string
          format: date-time
        access_level:
          type: string
          example: maintainer_or_admin
        your_role:
          type: string
          enum: [admin, maintainer]

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: running
        service:
          type: string
          example: flask-backend
        version:
          type: string
          example: 1.0.0
        timestamp:
          type: string
          format: date-time

    DeleteResponse:
      type: object
      properties:
        message:
          type: string
          example: User deleted successfully

    SpireStatus:
      type: object
      properties:
        healthy:
          type: boolean
        uptime_seconds:
          type: integer
        svid_count:
          type: integer
        agent_count:
          type: integer
        trust_domain:
          type: string

    SpireEntry:
      type: object
      properties:
        id:
          type: string
        spiffe_id:
          type: string
          pattern: '^spiffe://[a-zA-Z0-9._\-/]+$'
        parent_id:
          type: string
          pattern: '^spiffe://[a-zA-Z0-9._\-/]+$'
        selectors:
          type: array
          items:
            type: string
        ttl:
          type: integer

    CreateEntryRequest:
      type: object
      required:
        - spiffe_id
        - parent_id
      properties:
        spiffe_id:
          type: string
          pattern: '^spiffe://[a-zA-Z0-9._\-/]+$'
          description: SPIFFE ID of the entry
        parent_id:
          type: string
          pattern: '^spiffe://[a-zA-Z0-9._\-/]+$'
          description: SPIFFE ID of the parent node
        selectors:
          type: array
          items:
            type: string
            pattern: '^[a-zA-Z0-9._\-/:]+$'
          description: Selection criteria
        ttl:
          type: integer
          default: 3600
          description: Time-to-live in seconds

    EntriesListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SpireEntry'

    SpireNode:
      type: object
      properties:
        id:
          type: string
        spiffe_id:
          type: string
          pattern: '^spiffe://[a-zA-Z0-9._\-/]+$'
        attestation_type:
          type: string
        banned:
          type: boolean

    NodesListResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SpireNode'

    CreateJoinTokenRequest:
      type: object
      properties:
        ttl:
          type: integer
          default: 3600
          description: Token TTL in seconds

    JoinTokenResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        ttl:
          type: integer

    FederationPeer:
      type: object
      properties:
        trust_domain:
          type: string
          pattern: '^[a-zA-Z0-9._\-]+$'
        bundle_endpoint_url:
          type: string
          format: uri
        status:
          type: string
          example: created

    FederationListResponse:
      type: object
      properties:
        peers:
          type: array
          items:
            $ref: '#/components/schemas/FederationPeer'

    AddFederationPeerRequest:
      type: object
      required:
        - trust_domain
        - bundle_endpoint_url
      properties:
        trust_domain:
          type: string
          pattern: '^[a-zA-Z0-9._\-]+$'
        bundle_endpoint_url:
          type: string
          format: uri
          description: HTTPS URL required

    MigrationResponse:
      type: object
      properties:
        message:
          type: string
          example: Datastore migration complete

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message

security:
  - bearerAuth: []
