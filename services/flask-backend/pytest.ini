[pytest]
# Pytest configuration for Flask Backend

# Asyncio mode: auto
asyncio_mode = auto

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts = --cov=app --cov-fail-under=90 --cov-report=term-missing --cov-report=html --cov-config=.coveragerc

# Markers
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')

# Minimal output for cleaner test runs
console_output_style = progress
