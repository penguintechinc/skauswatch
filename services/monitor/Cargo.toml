[package]
publish = false
name = "skauswatch-monitor"
description = "SkausWatch monitor service — REST event/alert API over Elasticsearch/OpenSearch + MongoDB (Rust port)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "skauswatch-monitor"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
jsonwebtoken = { workspace = true }
penguin-licensing = { workspace = true, features = ["axum"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skauswatch-auth = { workspace = true }
skauswatch-common = { workspace = true }
skauswatch-telemetry = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
