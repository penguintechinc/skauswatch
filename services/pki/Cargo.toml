[package]
publish = false
name = "skauswatch-pki"
description = "SkausWatch PKI service — X.509 + SSH certificate authority (REST /api/v1 + gRPC PKIService, Rust port)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "skauswatch-pki"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
penguin-licensing = { workspace = true, features = ["axum"] }
prost-types = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
skauswatch-auth = { workspace = true }
skauswatch-common = { workspace = true }
skauswatch-db = { workspace = true }
skauswatch-identity = { workspace = true }
skauswatch-proto = { workspace = true }
skauswatch-streams = { workspace = true }
skauswatch-telemetry = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# "tls-connect-info" gives `tokio_rustls::server::TlsStream<T>` a `Connected`
# impl (tonic::transport::server::Connected) without pulling in tonic's own
# rustls crypto-provider features (tls-ring/tls-aws-lc) — the mTLS
# ServerConfig itself is built by skauswatch-identity, not tonic; see
# grpc/mod.rs and docs/v2-port/service-auth-model.md §2.
tonic = { workspace = true, features = ["tls-connect-info"] }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tower_governor = { workspace = true }
tracing = { workspace = true }
# "yaml" adds serde_yaml so `skauswatch-pki openapi` can emit true YAML for
# openapi/v1.yaml (workspace default features are json-only) — see
# docs/v2-port/openapi-pattern.md.
utoipa = { workspace = true, features = ["yaml"] }
uuid = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
# testutil: fake SPIFFE SVID/bundle fixtures for real mTLS handshake
# integration tests (grpc::serve/maintenance::serve) without a live SPIRE
# agent — see crates/skauswatch-identity's testutil module.
skauswatch-identity = { workspace = true, features = ["testutil"] }
skauswatch-testkit = { workspace = true }

[lints]
workspace = true
