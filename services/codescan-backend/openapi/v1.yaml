openapi: 3.1.0
info:
  title: SkausWatch CodeScan Backend API
  description: AI code review (repos/reviews/issue-plans) and git credential management for the CodeScan worker pipeline.
  contact:
    name: Penguin Tech Inc
    email: support@penguintech.io
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  version: '1'
paths:
  /api/v1/codescan/findings:
    get:
      tags:
      - codescan-sentinel
      summary: GET /codescan/findings — paginated, filterable list of SCA/CVE findings.
      operationId: list_findings
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: repo_config_id
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: branch
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: kind
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: tool
        in: query
        description: |-
          Filters to one scanner tool (P2: `semgrep`/`gitleaks`/`trivy`/
          `syft`) — `""` for every P1 sca/cve row, so this only ever matches
          tool-registry findings.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: severity
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: action
        in: query
        description: |-
          Filters to the policy engine's resolved action (P3) —
          `ignore`/`document`/`alert`/`fix`.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan Sentinel not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/findings/sbom/{scan_run_id}:
    get:
      tags:
      - codescan-sentinel
      summary: |-
        GET /codescan/findings/sbom/{scan_run_id} — the CycloneDX SBOM document
        produced by the P2 `syft` tool for that scan run (spec §3/§8: "SBOM
        output included for compliance"). Tenant-scoped by `scan_run_id`; a
        scan run belonging to another tenant (or with no SBOM recorded, e.g. it
        predates P2 or syft was unavailable that run) answers 404, never a
        cross-tenant existence signal.
      operationId: get_sbom
      parameters:
      - name: scan_run_id
        in: path
        description: codescan_scan_runs.id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: CycloneDX SBOM document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SbomResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan Sentinel not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No SBOM recorded for this scan run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/findings/summary:
    get:
      tags:
      - codescan-sentinel
      summary: |-
        GET /codescan/findings/summary — exec-view counts by severity/kind/
        ecosystem, open findings only (spec §8).
      operationId: findings_summary
      responses:
        '200':
          description: Findings summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsSummaryResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan Sentinel not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/fix-batches:
    get:
      tags:
      - codescan-sentinel-policy
      summary: |-
        GET /codescan/fix-batches — paginated, filterable list of grouped
        auto-fix batches, most-recently-updated first.
      operationId: list_batches
      parameters:
      - name: repo_config_id
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Fix batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixBatchListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sentinel not licensed, or below Enterprise tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/fix-batches/{batch_id}:
    get:
      tags:
      - codescan-sentinel-policy
      summary: |-
        GET /codescan/fix-batches/{batch_id} — one batch plus every finding it
        itemizes.
      operationId: get_batch
      parameters:
      - name: batch_id
        in: path
        description: Fix batch id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Fix batch detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixBatchDetailResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sentinel not licensed, or below Enterprise tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fix batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/plans:
    get:
      tags:
      - codescan
      summary: GET /codescan/plans — paginated, optionally filtered.
      operationId: list_plans
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: repository
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Paginated issue-plan list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - codescan
      summary: POST /codescan/plans — any authenticated role (see module docs).
      operationId: create_plan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
        required: true
      responses:
        '201':
          description: Issue plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRow'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Issue plan with this external_id already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/plans/{plan_id}:
    get:
      tags:
      - codescan
      summary: GET /codescan/plans/{plan_id}.
      operationId: get_plan
      parameters:
      - name: plan_id
        in: path
        description: Issue plan id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Issue plan detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRow'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issue plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/policy-rules:
    get:
      tags:
      - codescan-sentinel-policy
      summary: |-
        GET /codescan/policy-rules — paginated list, optionally filtered by
        `action`, ordered by priority ascending (evaluation order).
      operationId: list_rules
      parameters:
      - name: action
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Policy rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sentinel not licensed, or below Enterprise tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - codescan-sentinel-policy
      summary: |-
        POST /codescan/policy-rules — admin only. `created_by`/`updated_by`
        are stamped from the caller's JWT `sub`, never client-supplied (spec
        §6: "audit fields").
      operationId: create_rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRuleRequest'
        required: true
      responses:
        '201':
          description: Policy rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sentinel not licensed, below Enterprise tier, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/policy-rules/{rule_id}:
    get:
      tags:
      - codescan-sentinel-policy
      summary: GET /codescan/policy-rules/{id}.
      operationId: get_rule
      parameters:
      - name: rule_id
        in: path
        description: codescan_policy_rules.id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Policy rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sentinel not licensed, or below Enterprise tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Policy rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    delete:
      tags:
      - codescan-sentinel-policy
      summary: DELETE /codescan/policy-rules/{id} — admin only.
      operationId: delete_rule
      parameters:
      - name: rule_id
        in: path
        description: codescan_policy_rules.id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Policy rule deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleDeleteResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sentinel not licensed, below Enterprise tier, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Policy rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    patch:
      tags:
      - codescan-sentinel-policy
      summary: PATCH /codescan/policy-rules/{id} — admin only.
      operationId: update_rule
      parameters:
      - name: rule_id
        in: path
        description: codescan_policy_rules.id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRuleRequest'
        required: true
      responses:
        '200':
          description: Policy rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleUpdateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sentinel not licensed, below Enterprise tier, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Policy rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/repos:
    get:
      tags:
      - codescan
      summary: GET /codescan/repos — paginated list of repository configurations.
      operationId: list_repos
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Repository configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - codescan
      summary: POST /codescan/repos — admin only.
      operationId: create_repo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepoRequest'
        required: true
      responses:
        '201':
          description: Repository configuration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Repository already configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/repos/{repo_id}:
    get:
      tags:
      - codescan
      summary: GET /codescan/repos/{repo_id}.
      operationId: get_repo
      parameters:
      - name: repo_id
        in: path
        description: Repository configuration id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Repository configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoConfig'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    put:
      tags:
      - codescan
      summary: PUT /codescan/repos/{repo_id} — admin only.
      operationId: update_repo
      parameters:
      - name: repo_id
        in: path
        description: Repository configuration id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRepoRequest'
        required: true
      responses:
        '200':
          description: Repository configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoUpdateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    delete:
      tags:
      - codescan
      summary: DELETE /codescan/repos/{repo_id} — admin only.
      operationId: delete_repo
      parameters:
      - name: repo_id
        in: path
        description: Repository configuration id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Repository configuration deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDeleteResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/reviews:
    get:
      tags:
      - codescan
      summary: |-
        GET /codescan/reviews — paginated, optionally filtered by `repo_config_id`
        and `status`.
      operationId: list_reviews
      parameters:
      - name: repo_config_id
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Paginated review list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - codescan
      summary: |-
        POST /codescan/reviews — requires `codescan:write` scope (admin or
        maintainer; see `crate::auth` module docs); enqueues onto
        `codescan:tasks` after the row is committed.
      operationId: create_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
        required: true
      responses:
        '201':
          description: Review created and enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRow'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Review with this external_id already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/reviews/{review_id}:
    get:
      tags:
      - codescan
      summary: GET /codescan/reviews/{review_id} — review detail enriched with comments.
      operationId: get_review
      parameters:
      - name: review_id
        in: path
        description: Review id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Review detail with comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '401':
