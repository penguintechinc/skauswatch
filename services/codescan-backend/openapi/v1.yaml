components:
  schemas:
    CreateCredentialRequest:
      type: object
      required:
      - platform
      - token
      properties:
        credential_type:
          type: string
        name:
          type:
          - string
          - 'null'
        platform:
          type: string
        token:
          type: string
        token_expires_at:
          type:
          - string
          - 'null'
          format: date-time
    CreatePlanRequest:
      type: object
      required:
      - platform
      - repository
      - issue_number
      properties:
        ai_model:
          type:
          - string
          - 'null'
        ai_provider:
          type:
          - string
          - 'null'
        external_id:
          type:
          - string
          - 'null'
        issue_body:
          type:
          - string
          - 'null'
        issue_number:
          type: integer
          format: int32
        issue_title:
          type:
          - string
          - 'null'
        issue_url:
          type:
          - string
          - 'null'
        platform:
          type: string
        repository:
          type: string
    CreatePolicyRequest:
      type: object
      required:
      - license_name
      - policy
      properties:
        actions: {}
        description:
          type:
          - string
          - 'null'
        license_name:
          type: string
        policy:
          type: string
    CreatePolicyRuleRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
        cve:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        ecosystem:
          type:
          - string
          - 'null'
        exposure:
          type:
          - string
          - 'null'
        kind:
          type:
          - string
          - 'null'
        package:
          type:
          - string
          - 'null'
        priority:
          type:
          - integer
          - 'null'
          format: int32
        reachability:
          type:
          - string
          - 'null'
        repo:
          type:
          - string
          - 'null'
        severity:
          type:
          - string
          - 'null'
        tool:
          type:
          - string
          - 'null'
    CreateRepoRequest:
      type: object
      description: |-
        POST /codescan/repos body. Deliberately has NO `tenant_id` field — the
        pre-tenancy-retrofit version of this struct accepted one directly from
        the client and stamped it verbatim onto the created row (a live IDOR: any
        caller could assign an arbitrary tenant to a repo config, or collide with
        another tenant's data). `tenant_id` is now sourced exclusively from the
        validated JWT (`CurrentUser::tenant_id`, see `create_repo`) — even if a
        caller includes a `tenant_id` key in the request JSON, serde silently
        ignores it (no field to deserialize into), which is exactly the intended
        behavior per docs/v2-port/tenancy-model.md.
      required:
      - provider
      - repo_url
      - repo_name
      properties:
        auto_review:
          type:
          - boolean
          - 'null'
        credential_id:
          type:
          - integer
          - 'null'
          format: int64
        custom_rules: {}
        default_ai_provider:
          type:
          - string
          - 'null'
        default_categories: {}
        description:
          type:
          - string
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        enabled:
          type:
          - boolean
          - 'null'
        ignored_paths: {}
        provider:
          type: string
        repo_name:
          type: string
        repo_url:
          type: string
        review_on_open:
          type:
          - boolean
          - 'null'
        review_on_sync:
          type:
          - boolean
          - 'null'
        team_id:
          type:
          - integer
          - 'null'
          format: int64
    CreateReviewRequest:
      type: object
      required:
      - repo_config_id
      - pr_url
      properties:
        ai_model:
          type:
          - string
          - 'null'
        ai_provider:
          type:
          - string
          - 'null'
        base_sha:
          type:
          - string
          - 'null'
        categories:
          type: array
          items:
            type: string
        external_id:
          type:
          - string
          - 'null'
        head_sha:
          type:
          - string
          - 'null'
        pr_number:
          type:
          - integer
          - 'null'
          format: int32
        pr_title:
          type:
          - string
          - 'null'
        pr_url:
          type: string
        repo_config_id:
          type: integer
          format: int64
        review_type:
          type: string
    CredentialCreateResponse:
      type: object
      description: |-
        Documentation-only mirror of `create_credential`'s `serde_json::json!`
        body — never includes token material.
      required:
      - message
      - credential
      properties:
        credential:
          $ref: '#/components/schemas/CredentialSummary'
        message:
          type: string
    CredentialDeleteResponse:
      type: object
      description: Documentation-only mirror of `delete_credential`'s `serde_json::json!` body.
      required:
      - message
      - deleted
      properties:
        deleted:
          type: boolean
        message:
          type: string
    CredentialListResponse:
      type: object
      description: Documentation-only mirror of `list_credentials`'s `serde_json::json!` body.
      required:
      - data
      - total
      - page
      - per_page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CredentialSummary'
        page:
          type: integer
          format: int64
        per_page:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    CredentialSummary:
      type: object
      description: Response shape — deliberately excludes `encrypted_token`.
      required:
      - id
      - user_id
      - platform
      - credential_type
      - is_active
      properties:
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        credential_type:
          type: string
        id:
          type: integer
          format: int64
        is_active:
          type: boolean
        name:
          type:
          - string
          - 'null'
        platform:
          type: string
        token_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        user_id:
          type: integer
          format: int64
    CredentialUpdateResponse:
      type: object
      description: |-
        Documentation-only mirror of `update_credential`'s `serde_json::json!`
        body — never includes token material.
      required:
      - message
      - credential
      properties:
        credential:
          $ref: '#/components/schemas/CredentialSummary'
        message:
          type: string
    ErrorResponse:
      type: object
      description: |-
        Documentation-only mirror of `ApiError`'s bare `{"error": msg}` wire shape
        (`BadRequest`/`Unauthorized`/`Forbidden`/`NotFound`/`Conflict` in this
        service all use it) — `ApiError` itself builds its body with
        `serde_json::json!` rather than a typed struct, so this type exists
        solely to give `utoipa` something to reference in `#[utoipa::path]`
        `responses(...)` clauses.
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable error message.
    Finding:
      type: object
      description: |-
        One `codescan_findings` row, as returned by `list_findings` — an
        explicit DTO (not a raw table passthrough), matching every other
        response shape in this service (`security.md` Output Validation).

        `tool`/`rule_id`/`file_path`/`line`/`title` are P2 additions
        (migrations/0005_codescan_sentinel_tool_findings.sql) — empty string /
        `None` for every P1 sca/cve row, populated for sast/secret/iac rows from
        the scanner-tool registry (`worker-codescan::scanner_tool::ToolFinding`).
      required:
      - id
      - repo_config_id
      - branch
      - kind
      - ecosystem
      - package_name
      - current_version
      - advisory_id
      - severity
      - source
      - status
      - tool
      - rule_id
      - title
      - triage_source
      - action
      properties:
        action:
          type: string
          description: |-
            The policy engine's resolved action (`ignore`/`document`/`alert`/
            `fix`), `""` when never evaluated (spec §6). The alert bridge
            (`worker-codescan::handler`) only ever alerts on `"alert"`.
        advisory_id:
          type: string
        ai_rationale:
          type:
          - string
          - 'null'
        ai_severity:
          type:
          - string
          - 'null'
        branch:
          type: string
        current_version:
          type: string
        ecosystem:
          type: string
        exposure:
          type:
          - string
          - 'null'
        file_path:
          type:
          - string
          - 'null'
        first_seen:
          type:
          - string
          - 'null'
          format: date-time
        fixed_version:
          type:
          - string
          - 'null'
        id:
          type: integer
          format: int64
        kind:
          type: string
        last_seen:
          type:
          - string
          - 'null'
          format: date-time
        latest_version:
          type:
          - string
          - 'null'
        line:
          type:
          - integer
          - 'null'
          format: int32
        package_name:
          type: string
        reachable:
          type:
          - boolean
          - 'null'
        repo_config_id:
          type: integer
          format: int64
        rule_id:
          type: string
        severity:
          type: string
        source:
          type: string
        status:
          type: string
        title:
          type: string
        tool:
          type: string
        triage_source:
          type: string
        triaged_at:
          type:
          - string
          - 'null'
          format: date-time
        used:
          type:
          - boolean
          - 'null'
    FindingListResponse:
      type: object
      description: Documentation-only mirror of `list_findings`'s `serde_json::json!` body.
      required:
      - data
      - total
      - page
      - per_page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        page:
          type: integer
          format: int64
        per_page:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FindingsSummaryResponse:
      type: object
      description: Documentation-only mirror of `findings_summary`'s `serde_json::json!` body.
      required:
      - total_open
      - by_bucket
      properties:
        by_bucket:
          type: array
          items:
            $ref: '#/components/schemas/SeverityCount'
        total_open:
          type: integer
          format: int64
    FixBatch:
      type: object
      description: One `codescan_fix_batches` row.
      required:
      - id
      - repo_config_id
      - target_branch
      - branch_name
      - status
      properties:
        branch_name:
          type: string
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: integer
          format: int64
        pr_number:
          type:
          - integer
          - 'null'
          format: int64
        pr_url:
          type:
