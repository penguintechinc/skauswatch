openapi: 3.1.0
info:
  title: SkausWatch CodeScan Backend API
  description: AI code review (repos/reviews/issue-plans) and git credential management for the CodeScan worker pipeline.
  contact:
    name: Penguin Tech Inc
    email: support@penguintech.io
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  version: '1'
paths:
  /api/v1/codescan/plans:
    get:
      tags:
      - codescan
      summary: GET /codescan/plans — paginated, optionally filtered.
      operationId: list_plans
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: repository
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Paginated issue-plan list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - codescan
      summary: POST /codescan/plans — any authenticated role (see module docs).
      operationId: create_plan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
        required: true
      responses:
        '201':
          description: Issue plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRow'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Issue plan with this external_id already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/plans/{plan_id}:
    get:
      tags:
      - codescan
      summary: GET /codescan/plans/{plan_id}.
      operationId: get_plan
      parameters:
      - name: plan_id
        in: path
        description: Issue plan id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Issue plan detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRow'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issue plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/repos:
    get:
      tags:
      - codescan
      summary: GET /codescan/repos — paginated list of repository configurations.
      operationId: list_repos
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Repository configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - codescan
      summary: POST /codescan/repos — admin only.
      operationId: create_repo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepoRequest'
        required: true
      responses:
        '201':
          description: Repository configuration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Repository already configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/repos/{repo_id}:
    get:
      tags:
      - codescan
      summary: GET /codescan/repos/{repo_id}.
      operationId: get_repo
      parameters:
      - name: repo_id
        in: path
        description: Repository configuration id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Repository configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoConfig'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    put:
      tags:
      - codescan
      summary: PUT /codescan/repos/{repo_id} — admin only.
      operationId: update_repo
      parameters:
      - name: repo_id
        in: path
        description: Repository configuration id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRepoRequest'
        required: true
      responses:
        '200':
          description: Repository configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoUpdateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    delete:
      tags:
      - codescan
      summary: DELETE /codescan/repos/{repo_id} — admin only.
      operationId: delete_repo
      parameters:
      - name: repo_id
        in: path
        description: Repository configuration id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Repository configuration deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDeleteResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/reviews:
    get:
      tags:
      - codescan
      summary: |-
        GET /codescan/reviews — paginated, optionally filtered by `repo_config_id`
        and `status`.
      operationId: list_reviews
      parameters:
      - name: repo_config_id
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Paginated review list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - codescan
      summary: |-
        POST /codescan/reviews — maintainer only (see module docs); enqueues onto
        `codescan:tasks` after the row is committed.
      operationId: create_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
        required: true
      responses:
        '201':
          description: Review created and enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRow'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Review with this external_id already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/reviews/{review_id}:
    get:
      tags:
      - codescan
      summary: GET /codescan/reviews/{review_id} — review detail enriched with comments.
      operationId: get_review
      parameters:
      - name: review_id
        in: path
        description: Review id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Review detail with comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/codescan/status:
    get:
      tags:
      - codescan
      summary: |-
        GET /codescan/status — `{status, queue_depth}`, where `queue_depth` is the
        count of reviews not yet completed/failed/cancelled.
      operationId: codescan_status
      responses:
        '200':
          description: Service status and review queue depth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/credentials:
    get:
      tags:
      - credentials
      summary: GET /credentials — admin only, paginated; never includes token material.
      operationId: list_credentials
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Git credential summaries (no token material)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - credentials
      summary: |-
        POST /credentials — admin only. `token` is encrypted before storage and
        never echoed back.
      operationId: create_credential
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
        required: true
      responses:
        '201':
          description: Credential created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/credentials/test:
    post:
      tags:
      - credentials
      summary: |-
        POST /credentials/test — admin only; validates *format* only (no
        connectivity check, no persistence), matching v1.
      operationId: test_credential
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCredentialRequest'
        required: true
      responses:
        '200':
          description: Credential format looks valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCredentialResponse'
        '400':
          description: Credential format is invalid, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCredentialResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/credentials/{credential_id}:
    get:
      tags:
      - credentials
      summary: GET /credentials/{id} — admin only.
      operationId: get_credential
      parameters:
      - name: credential_id
        in: path
        description: Credential id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Credential summary (no token material)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSummary'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    delete:
      tags:
      - credentials
      summary: DELETE /credentials/{id} — admin only.
      operationId: delete_credential
      parameters:
      - name: credential_id
        in: path
        description: Credential id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Credential deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDeleteResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    patch:
      tags:
      - credentials
      summary: |-
        PATCH /credentials/{id} — admin only. A `token` field re-encrypts and
        replaces the stored value; the plaintext is never echoed back.
      operationId: update_credential
      parameters:
      - name: credential_id
        in: path
        description: Credential id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialRequest'
        required: true
      responses:
        '200':
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialUpdateResponse'
        '400':
          description: Validation error (e.g. blank token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/license-policies:
    get:
      tags:
      - license-policies
      summary: |-
        GET /license-policies — paginated list of configured license policies,
        optionally filtered by `policy` (allowed/review_required/blocked).
      operationId: list_policies
      parameters:
      - name: policy
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: License policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - license-policies
      summary: POST /license-policies — admin only.
      operationId: create_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
        required: true
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A policy for this license_name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/license-policies/{policy_id}:
    get:
      tags:
      - license-policies
      summary: GET /license-policies/{id}.
      operationId: get_policy
      parameters:
      - name: policy_id
        in: path
        description: License policy id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: License policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensePolicy'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: License policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    delete:
      tags:
      - license-policies
      summary: DELETE /license-policies/{id} — admin only.
      operationId: delete_policy
      parameters:
      - name: policy_id
        in: path
        description: License policy id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: License policy deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDeleteResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: License policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    patch:
      tags:
      - license-policies
      summary: PATCH /license-policies/{id} — admin only.
      operationId: update_policy
      parameters:
      - name: policy_id
        in: path
        description: License policy id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest'
        required: true
      responses:
        '200':
          description: License policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyUpdateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CodeScan feature not licensed, or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: License policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
