openapi: 3.1.0
info:
  title: SkausWatch Manager API
  description: SkausWatch manager service — users, alerts, threat intelligence, approvals, ENDPOINT agent fleet, SIEM, ASM, CodeScan proxy, S3 malware scanning, and research lookups.
  contact:
    name: Penguin Tech Inc
    email: support@penguintech.io
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  version: '1'
paths:
  /api/v1/alerts:
    get:
      tags:
      - alerts
      summary: |-
        GET /alerts — paginated alert list, filterable by severity/status/source
        via repeated query params.
      operationId: list_alerts
      parameters:
      - name: page
        in: query
        description: 1-based page number (default 1)
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        description: Page size, capped at 100 (default 20)
        required: false
        schema:
          type: integer
          format: int64
      - name: severity
        in: query
        description: Repeatable severity filter
        required: false
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        description: Repeatable status filter
        required: false
        schema:
          type: array
          items:
            type: string
      - name: source
        in: query
        description: Exact source filter
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Paginated alert list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - alerts
      summary: POST /alerts — admin/maintainer only.
      operationId: create_alert
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBody'
        required: true
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/alerts/search:
    post:
      tags:
      - alerts
      summary: |-
        POST /alerts/search — richer filtering than GET /alerts (free-text query,
        date range, `assigned_to`).
      operationId: search_alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchBody'
        required: true
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSearchResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/alerts/statistics:
    get:
      tags:
      - alerts
      summary: |-
        GET /alerts/statistics — total, severity/status breakdowns, and a 24h
        rolling count.
      operationId: alert_statistics
      responses:
        '200':
          description: Alert statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStatisticsResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/alerts/{alert_id}:
    get:
      tags:
      - alerts
      summary: GET /alerts/{alert_id} — single alert detail.
      operationId: get_alert
      parameters:
      - name: alert_id
        in: path
        description: Alert id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Alert detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertItem'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    put:
      tags:
      - alerts
      summary: PUT /alerts/{alert_id} — admin/maintainer only; partial update.
      operationId: update_alert
      parameters:
      - name: alert_id
        in: path
        description: Alert id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBody'
        required: true
      responses:
        '200':
          description: Alert updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertUpdateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/alerts/{alert_id}/ai-review:
    post:
      tags:
      - alerts
      summary: |-
        POST /alerts/{alert_id}/ai-review — admin/maintainer only; enqueues an
        async AI review job via the `ai:tasks` stream.
      operationId: request_ai_review
      parameters:
      - name: alert_id
        in: path
        description: Alert id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Optional — a missing/empty body is accepted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiReviewBody'
        required: true
      responses:
        '202':
          description: AI review job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewResponse'
        '400':
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AI integration is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/alerts/{alert_id}/status:
    put:
      tags:
      - alerts
      summary: |-
        PUT /alerts/{alert_id}/status — admin/maintainer only (contract defect
        #7: v1 let any authenticated role mutate status; this port tightens the
        gate to match the role model).
      operationId: update_alert_status
      parameters:
      - name: alert_id
        in: path
        description: Alert id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusBody'
        required: true
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStatusResponse'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/approvals:
    get:
      tags:
      - approvals
      summary: |-
        GET /approvals — any authenticated user; paginated with status[]/type[]
        (repeated) and requester_id filters, newest first.
      operationId: list_approvals
      parameters:
      - name: page
        in: query
        description: 1-based page number (default 1)
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        description: Page size, capped at 100 (default 20)
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        description: Repeatable status filter
        required: false
        schema:
          type: array
          items:
            type: string
      - name: type
        in: query
        description: Repeatable request_type filter
        required: false
        schema:
          type: array
          items:
            type: string
      - name: requester_id
        in: query
        description: Exact requester filter (0 = no filter)
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Paginated approval list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - approvals
      summary: |-
        POST /approvals — any authenticated user; requester_id = current user,
        expires_at = now + expires_hours; 201 `{message, approval}`.
      operationId: create_approval
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBody'
        required: true
      responses:
        '201':
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/approvals/pending:
    get:
      tags:
      - approvals
      summary: |-
        GET /approvals/pending — admin/maintainer; non-expired pending requests
        excluding those the current user has already decided (derived from
        `approval_history` user_id entries). Returns `{items, count}`.
      operationId: list_pending_approvals
      responses:
        '200':
          description: Non-expired pending approvals awaiting the caller's decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPendingResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/approvals/statistics:
    get:
      tags:
      - approvals
      summary: |-
        GET /approvals/statistics — admin/maintainer;
        `{total, by_status, by_type, expired_pending, last_7_days}`.
      operationId: approvals_get_statistics
      responses:
        '200':
          description: Approval statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalStatisticsResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/approvals/{approval_id}:
    get:
      tags:
      - approvals
      summary: GET /approvals/{approval_id} — any authenticated user; full object.
      operationId: get_approval
      parameters:
      - name: approval_id
        in: path
        description: Approval request id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Approval request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDetail'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/approvals/{approval_id}/cancel:
    post:
      tags:
      - approvals
      summary: |-
        POST /approvals/{approval_id}/cancel — requester or admin; only pending
        requests can be cancelled. v1 semantics: cancellation sets
        status=rejected (there is no "cancelled" status) + completed_at.
      operationId: cancel_approval
      parameters:
      - name: approval_id
        in: path
        description: Approval request id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Approval request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCancelResponse'
        '400':
          description: Request is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is neither the requester nor an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/approvals/{approval_id}/decide:
    post:
      tags:
      - approvals
      summary: |-
        POST /approvals/{approval_id}/decide — admin/maintainer; records an
        approve/reject, enforcing the v1 guard order, and returns the updated
        counters. Read-modify-write runs in one transaction (v1 race semantics).
      operationId: decide_approval
      parameters:
      - name: approval_id
        in: path
        description: Approval request id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideBody'
        required: true
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResponse'
        '400':
          description: Validation error, already completed/decided, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions, or caller is the requester
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/asm/scans:
    get:
      tags:
      - asm
      summary: GET /asm/scans — list ASM scans; query params forward first-value-wins.
      operationId: list_asm_scans
      responses:
        '200':
          description: Proxied scanner response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cannot connect to scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Scanner request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - asm
      summary: POST /asm/scans — trigger a new ASM scan (proxied; body forwarded).
      description: |-
        This whole router is a thin authenticated proxy to the scanner service —
        every response body below is documented as a generic JSON object
        (`serde_json::Value`) rather than a fixed schema, since the wire shape is
        whatever the upstream scanner returns, not something this service
        defines. See `docs/v2-port/openapi-pattern.md`.
      operationId: create_asm_scan
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Proxied scanner response
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cannot connect to scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Scanner request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/asm/scans/{scan_id}:
    get:
      tags:
      - asm
      summary: GET /asm/scans/{scan_id} — ASM scan detail (proxied).
      operationId: get_asm_scan
      parameters:
      - name: scan_id
        in: path
        description: ASM scan id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Proxied scanner response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cannot connect to scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Scanner request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/asm/scans/{scan_id}/certs:
    get:
      tags:
      - asm
      summary: GET /asm/scans/{scan_id}/certs — TLS certificate findings (proxied).
      operationId: get_asm_scan_certs
      parameters:
      - name: scan_id
        in: path
        description: ASM scan id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Proxied scanner response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cannot connect to scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Scanner request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/asm/scans/{scan_id}/diff:
    get:
      tags:
      - asm
      summary: GET /asm/scans/{scan_id}/diff — diff vs the previous scan (proxied).
      operationId: get_asm_scan_diff
      parameters:
      - name: scan_id
        in: path
        description: ASM scan id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Proxied scanner response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cannot connect to scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Scanner request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/asm/scans/{scan_id}/hosts:
    get:
      tags:
      - asm
      summary: GET /asm/scans/{scan_id}/hosts — discovered hosts and services (proxied).
      operationId: get_asm_scan_hosts
      parameters:
      - name: scan_id
        in: path
        description: ASM scan id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Proxied scanner response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cannot connect to scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Scanner request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/asm/scans/{scan_id}/report:
    get:
      tags:
      - asm
      summary: |-
        GET /asm/scans/{scan_id}/report — presigned URL for the full scan report
        (proxied).
      operationId: get_asm_scan_report
      parameters:
      - name: scan_id
        in: path
        description: ASM scan id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Proxied scanner response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cannot connect to scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Scanner request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/asm/scans/{scan_id}/screenshots:
    get:
      tags:
      - asm
      summary: |-
        GET /asm/scans/{scan_id}/screenshots — screenshots with presigned URLs
        (proxied).
      operationId: get_asm_scan_screenshots
      parameters:
      - name: scan_id
        in: path
        description: ASM scan id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Proxied scanner response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cannot connect to scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Scanner request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/asm/settings/ports:
    get:
