  /api/v1/research/dns:
    post:
      tags:
      - research
      summary: |-
        DNS-only lookup. Returns v1's `DnsResult.to_dict()` shape with empty records
        since no resolver is queried in this port.
      operationId: dns_lookup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DnsBody'
        required: true
      responses:
        '200':
          description: DNS record envelope (A/AAAA/MX/NS/TXT/CNAME/SOA)
          content:
            application/json:
              schema: {}
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/research/lookup:
    post:
      tags:
      - research
      summary: |-
        Composite research lookup. Validates the request, classifies the indicator
        when omitted, then walks v1's control flow — including the shodan/maltego
        "not enabled" 503 short-circuits — emitting empty per-source envelopes since
        no external source is queried in this port. The response shape varies with
        which `include_*` sources were requested, so it is documented generically
        (`serde_json::Value`) rather than a fixed schema.
      operationId: lookup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupBody'
        required: true
      responses:
        '200':
          description: Composite lookup result (shape varies by requested sources)
          content:
            application/json:
              schema: {}
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Shodan or Maltego requested but not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/research/maltego:
    post:
      tags:
      - research
      summary: |-
        Maltego transforms. The "not enabled" 503 gate precedes the body, matching
        v1; when enabled it returns v1's no-data body (no live transform in this
        port). `indicator_type` defaults to "domain" like v1 but does not change the
        empty response.
      operationId: maltego_lookup
      requestBody:
        description: '`{query: string, indicator_type?: string}`'
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Maltego transform result (no live call performed in this port)
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid request format, or missing query field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Maltego integration not enabled
          content:
            application/json:
              schema: {}
      security:
      - bearer_jwt: []
  /api/v1/research/shodan:
    post:
      tags:
      - research
      summary: |-
        Shodan-only lookup. The "not enabled" 503 gate is checked before the body,
        exactly as v1 does; when enabled it returns v1's no-data body (no live
        Shodan call in this port).
      operationId: shodan_lookup
      requestBody:
        description: '`{query: string}`'
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Shodan lookup result (no live call performed in this port)
