          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    put:
      tags:
      - siem
      summary: |-
        PUT /siem/config — admin-only retention update. Contract defect #5:
        v1 validates but never persists — replicated as a validate-only no-op.
        Invalid values return the bare v1 400 body, not the shared envelope.
      operationId: update_siem_config
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: 'Validated (not persisted — see contract defect #5)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiemConfigUpdateResponse'
        '400':
          description: retention_days must be an integer 1-400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Non-object JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
