    UserItem:
      type: object
      description: |-
        List-item shape: `{id,email,full_name,role,is_active,mfa_enabled,created_at}`.
        Timestamps render as Python `datetime.isoformat()` (v1 wire parity).
      required:
      - id
      - email
      - full_name
      - role
      - is_active
      - mfa_enabled
      properties:
        created_at:
          type:
          - string
          - 'null'
        email:
          type: string
        full_name:
          type: string
        id:
          type: integer
          format: int32
        is_active:
          type: boolean
        mfa_enabled:
          type: boolean
        role:
          type: string
    UserListResponse:
      type: object
      description: Documentation-only mirror of `list_users`'s `serde_json::json!` body.
      required:
      - items
      - total
      - page
      - per_page
      - pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserItem'
        page:
          type: integer
          format: int64
        pages:
          type: integer
          format: int64
        per_page:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    UserSummary:
      type: object
      description: |-
        Summary shape used inside create/update responses:
        `{id,email,full_name,role,is_active}`.
      required:
      - id
      - email
      - full_name
      - role
      - is_active
      properties:
        email:
