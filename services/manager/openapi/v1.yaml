            application/json:
              schema:
                $ref: '#/components/schemas/SiemSearchResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: OpenSearch unreachable, errored, or bad query params
