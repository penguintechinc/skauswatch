            schema: {}
        required: true
      responses:
        '202':
          description: Batch accepted (per-item failures reported in `errors`, never fail the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEventsResponse'
        '400':
          description: Invalid JSON body, or batch exceeds 100 events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/invalid X-API-Key or X-Agent-ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - endpoint_hmac: []
  /api/v1/endpoint/heartbeat:
    post:
      tags:
      - endpoint
      summary: |-
        POST /endpoint/heartbeat — HMAC agent auth. Updates status + last_heartbeat and
        merges the payload metadata over the stored metadata (new keys win),
        exactly like v1's `{**old, **new}`.
      operationId: heartbeat
      parameters:
      - name: X-Agent-ID
        in: header
        description: Agent identity — must match the HMAC key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatBody'
        required: true
      responses:
        '200':
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing/invalid X-API-Key or X-Agent-ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - endpoint_hmac: []
  /api/v1/endpoint/register:
    post:
      tags:
      - endpoint
      summary: |-
        POST /endpoint/register — HMAC agent auth. Re-registers (200) when the body's
        agent_id already exists (full field overwrite, metadata replaced), else
        inserts a new active agent (201). v1 keys off the BODY agent_id, which
        need not match the authenticated X-Agent-ID — preserved as-is.
      operationId: register_agent
      parameters:
      - name: X-Agent-ID
        in: header
        description: Agent identity — must match the HMAC key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
        required: true
      responses:
        '200':
          description: Agent re-registered (agent_id already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '201':
          description: Agent registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing/invalid X-API-Key or X-Agent-ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - endpoint_hmac: []
  /api/v1/endpoint/statistics:
    get:
      tags:
      - endpoint
      summary: |-
        GET /endpoint/statistics — JWT (any role). Agent counts by status/OS, stale
        agents (active with no heartbeat for 5 min), and event totals. v1 skips
        falsy os_type values (NULL and "") in agents_by_os.
      operationId: endpoint_get_statistics
      responses:
        '200':
          description: Endpoint fleet statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointStatisticsResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/license/features:
