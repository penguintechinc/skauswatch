        (free-text query, confidence floor). Note: `tags` is accepted in the body
        for schema parity with v1 but never applied as a filter.
      operationId: search_iocs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchBody'
        required: true
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IocSearchResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/threat-intel/iocs/{ioc_id}:
    get:
      tags:
      - threat-intel
      summary: GET /threat-intel/iocs/{ioc_id} — single IOC detail.
      operationId: get_ioc
      parameters:
      - name: ioc_id
        in: path
        description: IOC id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: IOC detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IocDetail'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: IOC not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    delete:
      tags:
      - threat-intel
      summary: DELETE /threat-intel/iocs/{ioc_id} — admin only.
      operationId: delete_ioc
      parameters:
      - name: ioc_id
        in: path
        description: IOC id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: IOC deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IocDeleteResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: IOC not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/threat-intel/statistics:
    get:
      tags:
      - threat-intel
      summary: |-
        GET /threat-intel/statistics — totals, zero-filled per-type/per-level
        buckets, top 10 sources, and expired count.
      operationId: threat_intel_get_statistics
      responses:
        '200':
          description: IOC statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatIntelStatisticsResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/users:
    get:
      tags:
      - users
      summary: GET /users — admin/maintainer only; paginated `{items,total,page,per_page,pages}`.
      operationId: list_users
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - users
      summary: |-
        POST /users — admin only; 403 free-tier cap, 409 duplicate email,
        201 `{message,user}` on success.
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions, or free-tier user cap reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/users/{user_id}:
    get:
      tags:
      - users
      summary: GET /users/{user_id} — self or admin/maintainer; 404 if missing.
      operationId: get_user
      parameters:
      - name: user_id
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — not self and not admin/maintainer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    put:
      tags:
      - users
      summary: |-
        PUT /users/{user_id} — self (full_name/password only) or admin (all
        fields); 409 email in use, 404 missing, 200 `{message,user}`.
      operationId: update_user
      parameters:
      - name: user_id
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
        required: true
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — not self and not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    delete:
      tags:
      - users
      summary: |-
        DELETE /users/{user_id} — admin only; 400 self-delete, 404 missing; also
        removes the user's refresh tokens (transactionally, unlike v1).
      operationId: delete_user
      parameters:
      - name: user_id
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeleteResponse'
        '400':
          description: Cannot delete your own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
components:
  schemas:
    AgentConfigInner:
      type: object
      description: |-
        Per-agent config payload embedded in [`AgentConfigResponse`]. Each field
        is metadata-overridable, so it is documented generically
        (`serde_json::Value`) rather than a fixed primitive type.
      required:
      - reporting_interval
      - heartbeat_interval
      - event_batch_size
      - enabled_collectors
      - severity_threshold
      properties:
        enabled_collectors: {}
        event_batch_size: {}
        heartbeat_interval: {}
        reporting_interval: {}
        severity_threshold: {}
    AgentConfigResponse:
      type: object
      description: Documentation-only mirror of `agent_config`'s `serde_json::json!` body.
      required:
      - agent_id
      - config
      properties:
        agent_id:
          type: string
        config:
          $ref: '#/components/schemas/AgentConfigInner'
    AgentDetail:
      type: object
      description: Documentation-only mirror of `get_agent`'s wire shape.
      required:
      - id
