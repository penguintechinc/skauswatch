    get:
      tags:
      - siem
      summary: |-
        GET /siem/health — unauthenticated logs liveness probe. Always
        200; the body carries ok/degraded, matching the v1 route.
      operationId: siem_health
      responses:
        '200':
          description: Log-pipeline liveness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiemHealthResponse'
  /api/v1/siem/ingest:
    post:
      tags:
      - siem
      summary: |-
        POST /siem/ingest — authenticated proxy to `{LOGS_URL}/ingest`
