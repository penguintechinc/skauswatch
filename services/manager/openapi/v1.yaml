        schema:
          type: string
      - name: class_name
        in: query
        description: Exact class_name filter
        required: false
        schema:
          type: string
      - name: severity
        in: query
        description: Exact severity_id filter
        required: false
        schema:
          type: string
      - name: from_date
        in: query
        description: Inclusive lower bound on time
        required: false
        schema:
          type: string
      - name: to_date
        in: query
        description: Inclusive upper bound on time
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: 1-based page number (default 1)
