        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Shodan integration not enabled
          content:
            application/json:
              schema: {}
      security:
      - bearer_jwt: []
