      - user
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
    ValidationErrorResponse:
      type: object
      description: |-
        Documentation-only mirror of `ApiError::Validation`'s wire shape — a
        bare error message plus a list of per-field validation failure objects
        (`{loc, msg, type}`, matching the `ApiJson` rejection shape below).
      required:
      - error
      - details
      properties:
        details:
          type: array
          items: {}
          description: 'Per-field failure details, each `{loc: [...], msg: ..., type: ...}`.'
        error:
          type: string
          description: Always `"Validation error"`.
