[package]
publish = false
name = "skauswatch-sshca"
description = "SkausWatch SSH certificate authority — OpenSSH user/host cert signing (Rust port of the v1 sshca)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "skauswatch-sshca"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
jsonwebtoken = { workspace = true }
penguin-licensing = { workspace = true, features = ["axum"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
ssh-key = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower_governor = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["yaml"] }
uuid = { workspace = true }
skauswatch-auth = { workspace = true }
skauswatch-common = { workspace = true }
skauswatch-db = { workspace = true }
skauswatch-streams = { workspace = true }
skauswatch-telemetry = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
# Real Postgres schema for DB-backed store tests — applies pki's
# `ssh_certificates`/`crl_entries` migrations into an isolated schema (see
# src/store.rs's consolidation decision doc comment). sshca ships no
# migrations of its own; schema authority stays with services/pki.
skauswatch-testkit = { workspace = true }

[lints]
workspace = true
