openapi: 3.1.0
info:
  title: SkausWatch DepGate Admin API
  description: Tenant-scoped report/audit surface over DepGate's OCI pull-through cache (docs/v2-port/v2.1-depgate.md). Does not cover the /v2/* OCI Distribution proxy surface itself, which is a fixed external protocol rather than a service-defined REST API.
  contact:
    name: Penguin Tech Inc
    email: support@penguintech.io
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  version: '1'
paths:
  /api/v1/depgate/artifacts:
    get:
      tags:
      - depgate
      operationId: list_artifacts
      parameters:
      - name: verdict
        in: query
        description: Exact-match verdict filter (`clean`/`infected`/`pup`/`error`/`skipped`/`quarantined`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: ecosystem
        in: query
        description: Exact-match ecosystem filter (`oci`, `npm`, `pypi`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: name
        in: query
        description: Substring match against `name`.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: limit
        in: query
        description: Page size (default 50, max 200).
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset (default 0).
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Tenant-scoped artifact index, newest-resolved first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/depgate/artifacts/{sha256}/risk-findings:
    get:
      tags:
      - depgate
      operationId: list_risk_findings
      parameters:
      - name: sha256
        in: path
        description: Content digest hex
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Package-risk heuristic findings recorded for this artifact (§5)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskFindingItem'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/depgate/policy-rules:
    get:
      tags:
      - depgate
      operationId: list_policy_rules
      responses:
        '200':
          description: Tenant's policy rules, highest priority first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRuleItem'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    post:
      tags:
      - depgate
      operationId: create_policy_rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRuleRequest'
        required: true
      responses:
        '200':
          description: Created policy rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleItem'
        '400':
          description: Invalid action/min_severity value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:admin scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/depgate/policy-rules/{id}:
    get:
      tags:
      - depgate
      operationId: get_policy_rule
      parameters:
      - name: id
        in: path
        description: Policy rule id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The policy rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleItem'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such policy rule for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    put:
      tags:
      - depgate
      operationId: update_policy_rule
      parameters:
      - name: id
        in: path
        description: Policy rule id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRuleRequest'
        required: true
      responses:
        '200':
          description: Updated policy rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleItem'
        '400':
          description: Invalid action/min_severity value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:admin scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such policy rule for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
    delete:
      tags:
      - depgate
      operationId: delete_policy_rule
      parameters:
      - name: id
        in: path
        description: Policy rule id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Policy rule deleted
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:admin scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such policy rule for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/depgate/quarantine:
    get:
      tags:
      - depgate
      operationId: list_quarantine
      parameters:
      - name: limit
        in: query
        description: Page size (default 50, max 200).
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset (default 0).
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Tenant-scoped quarantine log, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineListResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/depgate/quarantine/{id}:
    patch:
      tags:
      - depgate
      operationId: update_quarantine
      parameters:
      - name: id
        in: path
        description: Quarantine event id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuarantineRequest'
        required: true
      responses:
        '200':
          description: Updated quarantine event; `released` re-admits the artifact to the vetted cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineItem'
        '400':
          description: Invalid disposition value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:admin scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such quarantine event for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
  /api/v1/depgate/stats:
    get:
      tags:
      - depgate
      operationId: stats
      responses:
        '200':
          description: Verdict counts and cache hit-rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid tenant claim, or missing depgate:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_jwt: []
components:
  schemas:
    ArtifactItem:
      type: object
      description: One artifact row, wire shape for the artifacts list.
      required:
      - id
      - ecosystem
      - name
      - reference
      - sha256
      - upstream
      - size_bytes
      - verdict
      - verdict_at
      - scanner_version
      - pinned
      - first_seen
      - last_seen
      properties:
        content_type:
          type:
          - string
          - 'null'
        ecosystem:
          type: string
        first_seen:
          type: string
        id:
          type: string
          format: uuid
        last_seen:
          type: string
        name:
          type: string
        pinned:
          type: boolean
        reference:
          type: string
        scanner_version:
          type: string
        sha256:
          type: string
        size_bytes:
          type: integer
          format: int64
        upstream:
          type: string
        verdict:
          type: string
        verdict_at:
          type: string
    ArtifactListResponse:
      type: object
      description: Response envelope for `GET /api/v1/depgate/artifacts`.
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactItem'
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      description: |-
        Documentation-only mirror of [`ApiError`]'s bare `{"error": msg}` wire
        shape, referenced from `#[utoipa::path]` `responses(...)` clauses.
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable error message.
    PolicyRuleItem:
      type: object
      description: One policy-rule row, wire shape.
      required:
      - id
      - priority
      - action
      - enabled
      - created_at
      - updated_at
      properties:
        action:
          type: string
        created_at:
          type: string
        description:
          type:
          - string
          - 'null'
        ecosystem:
          type:
          - string
          - 'null'
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        min_severity:
          type:
          - string
          - 'null'
        name_glob:
          type:
          - string
          - 'null'
        priority:
          type: integer
          format: int32
        provenance:
          type:
          - string
          - 'null'
          description: Provenance filter (`unsigned`/`verified`/`invalid`, P4 §5/§9/§10).
        risk_check:
          type:
          - string
          - 'null'
        updated_at:
          type: string
        verdict:
          type:
          - string
          - 'null'
        version_glob:
          type:
          - string
          - 'null'
    PolicyRuleRequest:
      type: object
      description: Create/replace request body for a policy rule.
      required:
      - action
      properties:
        action:
          type: string
        description:
          type:
          - string
          - 'null'
        ecosystem:
          type:
          - string
          - 'null'
        enabled:
          type: boolean
        min_severity:
          type:
          - string
          - 'null'
        name_glob:
          type:
          - string
          - 'null'
        priority:
          type: integer
          format: int32
        provenance:
          type:
          - string
          - 'null'
          description: Provenance filter (`unsigned`/`verified`/`invalid`, P4 §5/§9/§10).
        risk_check:
          type:
          - string
          - 'null'
        verdict:
          type:
          - string
          - 'null'
        version_glob:
          type:
          - string
          - 'null'
    QuarantineItem:
      type: object
      description: One quarantine row, wire shape.
      required:
      - id
      - sha256
      - ecosystem
      - name
      - reference
      - reason
      - threat
      - disposition
      - created_at
      properties:
        created_at:
          type: string
        disposition:
          type: string
        ecosystem:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        policy_rule_id:
          type:
          - string
          - 'null'
          format: uuid
        reason:
          type: string
        reference:
          type: string
        resolution_note:
          type:
          - string
          - 'null'
        resolved_at:
          type:
          - string
          - 'null'
        resolved_by:
          type:
          - string
          - 'null'
        sha256:
          type: string
        threat:
          type: string
    QuarantineListResponse:
      type: object
      description: Response envelope for `GET /api/v1/depgate/quarantine`.
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuarantineItem'
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    RiskFindingItem:
      type: object
      description: One risk-finding row, wire shape.
      required:
      - id
      - sha256
      - ecosystem
      - name
      - reference
      - check_name
      - severity
      - detail
      - created_at
      properties:
        check_name:
          type: string
        created_at:
          type: string
        detail:
          type: string
        ecosystem:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        reference:
          type: string
        severity:
          type: string
        sha256:
          type: string
    StatsResponse:
      type: object
      description: Response for `GET /api/v1/depgate/stats`.
      required:
      - by_verdict
      - quarantine_count
      - cache_hits
      - cache_misses
      - cache_hit_rate
      properties:
        by_verdict:
          type: object
          additionalProperties:
            type: integer
            format: int64
          propertyNames:
            type: string
        cache_hit_rate:
          type: number
          format: double
          description: |-
            `cache_hits / (cache_hits + cache_misses)`, `0.0` when there have
            been no lookups yet.
        cache_hits:
          type: integer
          format: int64
          description: In-process (this replica, since last restart) cache lookups.
          minimum: 0
        cache_misses:
          type: integer
          format: int64
          description: In-process (this replica, since last restart) cache misses.
          minimum: 0
        quarantine_count:
          type: integer
          format: int64
    UpdateQuarantineRequest:
      type: object
      description: Request body for `PATCH /api/v1/depgate/quarantine/{id}`.
      required:
      - disposition
      properties:
        disposition:
          type: string
          description: |-
            New disposition (`confirmed`/`false_positive`/`released`) — `pending`
            is the initial state only, never a valid transition target.
        resolution_note:
          type:
          - string
          - 'null'
          description: Free-text resolution note.
  securitySchemes:
    bearer_jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: depgate
  description: DepGate cache/scan index and audit reporting
