[package]
publish = false
name = "skauswatch-logs"
description = "SkausWatch SIEM logs service — HTTP ingest + OCSF normalization + OpenSearch bulk writer (Rust port of the v1 logs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "skauswatch-logs"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
penguin-licensing = { workspace = true, features = ["axum"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skauswatch-auth = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
skauswatch-streams = { workspace = true }
skauswatch-telemetry = { workspace = true }
# Per-IP rate limiting on the production router (`src/rate_limit.rs`).
tower_governor = { workspace = true }
utoipa = { workspace = true, features = ["yaml"] }

[dev-dependencies]
axum-test = { workspace = true }
skauswatch-testkit = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
