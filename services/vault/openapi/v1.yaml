          type: string
        created_by:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        expires_at:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        secret_type:
          type: string
        tags: {}
        updated_at:
          type: string
    SecretValueResponse:
      type: object
