          type: integer
          format: int32
          minimum: 0
        rotated_at:
          type: string
        rows_updated:
          type: integer
          minimum: 0
    RotateSecretResponse:
      type: object
      description: Documentation-only mirror of `rotate_secret`'s response envelope.
      required:
      - id
      - version
      - rotated_at
      properties:
        id:
          type: string
        rotated_at:
          type: string
        version:
          type: integer
          format: int32
    SecretListResponse:
      type: object
