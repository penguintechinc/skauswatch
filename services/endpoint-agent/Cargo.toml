[package]
name = "skauswatch-endpoint-agent"
description = "SkausWatch endpoint agent — process/file/network collectors reporting to the manager (Rust port)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "skauswatch_endpoint_agent"
path = "src/lib.rs"

[[bin]]
name = "endpoint-agent"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
figment = { workspace = true, features = ["yaml"] }
hmac = { workspace = true }
netstat2 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
skauswatch-common = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
wiremock = { workspace = true }

[lints]
workspace = true
