# YAML linting configuration for SkausWatch
# See https://yamllint.readthedocs.io/en/stable/configuration.html

extends: default

rules:
  line-length:
    max: 100
    level: warning
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no']
    check-keys: false
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  float-values:
    require-numeral-before-decimal: true
    require-numeral-after-decimal: true
  key-duplicates: enable
  new-line-at-end-of-file: enable
  trailing-spaces: enable
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

ignore: |
  .github/
  node_modules/
  .next/
  out/
  venv/
  .venv/
  __pycache__/
  *.log