# Ruff configuration file for SkausWatch
# https://docs.astral.sh/ruff/configuration/

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
    ".next",
    "out",
]

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.8+.
target-version = "py38"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pydocstyle
    "D",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-comprehensions
    "C4",
    # flake8-bandit (security)
    "S",
    # flake8-pie
    "PIE",
    # flake8-unused-arguments
    "ARG",
    # flake8-use-pathlib
    "PTH",
    # eradicate (commented-out code)
    "ERA",
    # flake8-pytest-style
    "PT",
    # flake8-return
    "RET",
    # flake8-simplify
    "SIM",
    # tryceratops
    "TRY",
    # Ruff-specific rules
    "RUF",
    # Pylint
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    # flake8-annotations
    "ANN",
    # flake8-async
    "ASYNC",
    # flake8-blind-except
    "BLE",
    # flake8-boolean-trap
    "FBT",
    # flake8-commas
    "COM",
    # flake8-datetimez
    "DTZ",
    # flake8-errmsg
    "EM",
    # flake8-executable
    "EXE",
    # flake8-future-annotations
    "FA",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-import-conventions
    "ICN",
    # flake8-logging-format
    "G",
    # flake8-no-pep420
    "INP",
    # flake8-print
    "T20",
    # flake8-pyi
    "PYI",
    # flake8-quotes
    "Q",
    # flake8-raise
    "RSE",
    # flake8-self
    "SLF",
    # flake8-slots
    "SLOT",
    # flake8-tidy-imports
    "TID",
    # flake8-type-checking
    "TCH",
    # flake8-gettext
    "INT",
    # pandas-vet
    "PD",
    # pygrep-hooks
    "PGH",
    # flynt
    "FLY",
    # NumPy-specific rules
    "NPY",
    # Perflint
    "PERF",
    # refurb
    "FURB",
    # flake8-logging
    "LOG",
    # pep8-naming
    "N",
    # McCabe complexity
    "C90",
    # flake8-2020
    "YTT",
]

ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow boolean positional values in function calls, like `dict.get(... True)`
    "FBT003",
    # Ignore checks for possible passwords
    "S105", "S106", "S107",
    # Ignore complexity
    "C901",
    # Allow assert statements
    "S101",
    # Ignore magic value comparisons
    "PLR2004",
    # Missing type annotation for `self` in method
    "ANN101",
    # Missing type annotation for `cls` in classmethod
    "ANN102",
    # Dynamically typed expressions (typing.Any) are disallowed
    "ANN401",
    # Too many arguments to function call
    "PLR0913",
    # Too many return statements
    "PLR0911",
    # Too many branches
    "PLR0912",
    # Too many statements
    "PLR0915",
    # Trailing comma missing (conflicts with formatter)
    "COM812",
    # Implicitly concatenated string literals on one line
    "ISC001",
    # Exception must not use a string literal, assign to variable first
    "TRY003",
    # Missing docstring in public module
    "D100",
    # Missing docstring in public class
    "D101",
    # Missing docstring in public method
    "D102",
    # Missing docstring in public function
    "D103",
    # Missing docstring in public package
    "D104",
    # Missing docstring in magic method
    "D105",
    # Missing docstring in public nested class
    "D106",
    # Missing docstring in __init__
    "D107",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = [
    # Don't touch unused imports
    "F401",
    # Don't remove commented-out code
    "ERA001",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Tests can use magic values, assertions, and imports
"tests/**/*" = [
    "PLR2004",
    "S101",
    "TID252",
    "ANN001",
    "ANN201",
    "D100",
    "D101",
    "D102",
    "D103",
]

# Scripts can use print statements and subprocess calls
"scripts/**/*" = [
    "T201",
    "S602",
    "S603",
    "D100",
    "D103",
]

# Django migrations have their own style
"**/migrations/**" = [
    "INP001",
    "D100",
    "D101",
    "D102",
    "D103",
]

# Configuration files
"**/settings/**" = [
    "F403",
    "F405",
]

# Jupyter notebooks
"*.ipynb" = [
    "T201",
    "D100",
    "D103",
]

[lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["skauswatch"]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = false

# Set the line length limit used by the formatter and linter.
docstring-code-line-length = "dynamic"