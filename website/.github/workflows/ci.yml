name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION_DEFAULT: "3.13"
  NODE_VERSION: "20.x"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.changes.outputs.python }}
      frontend: ${{ steps.changes.outputs.frontend }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'services/**'
              - 'shared/**'
              - 'tests/**'
            frontend:
              - 'website/**'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - 'package*.json'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'

  python-quality:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        service: ["manager", "aaa-monitor", "pki-server", "ssh-ca"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
          pip install bandit safety
      
      - name: Cache pre-commit
        uses: actions/cache@v3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      
      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure
      
      - name: Lint with ruff
        run: |
          ruff check --output-format=github .
          ruff format --check --diff .
      
      - name: Type check with mypy
        run: |
          mypy services/${{ matrix.service }}/ shared/ --config-file pyproject.toml
      
      - name: Security scan with bandit
        run: |
          bandit -r services/${{ matrix.service }}/ shared/ -f json -o bandit-report-${{ matrix.service }}-${{ matrix.python-version }}.json
        continue-on-error: true
      
      - name: Check dependencies with safety
        run: |
          safety check --json --output safety-report-${{ matrix.service }}-${{ matrix.python-version }}.json
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports-${{ matrix.service }}-${{ matrix.python-version }}
          path: |
            bandit-report-*.json
            safety-report-*.json
          retention-days: 30

  python-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        service: ["manager", "aaa-monitor", "pki-server", "ssh-ca"]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: skauswatch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      
      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432; do sleep 1; done
          until redis-cli -h localhost -p 6379 ping; do sleep 1; done
      
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skauswatch_test
          REDIS_URL: redis://localhost:6379/0
          SKAUSWATCH_ENV: testing
        run: |
          pytest tests/unit/test_${{ matrix.service }}/ \
            -v \
            --cov=services/${{ matrix.service }} \
            --cov-report=xml \
            --cov-report=html \
            --junit-xml=junit-${{ matrix.service }}-${{ matrix.python-version }}.xml \
            --tb=short
      
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skauswatch_test
          REDIS_URL: redis://localhost:6379/0
          SKAUSWATCH_ENV: testing
        run: |
          pytest tests/integration/test_${{ matrix.service }}/ \
            -v \
            --cov=services/${{ matrix.service }} \
            --cov-append \
            --cov-report=xml \
            --cov-report=html \
            --junit-xml=junit-integration-${{ matrix.service }}-${{ matrix.python-version }}.xml \
            --tb=short
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.service }}-${{ matrix.python-version }}
          path: |
            junit-*.xml
            htmlcov/
            coverage.xml
          retention-days: 30
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: ${{ matrix.service }},${{ matrix.python-version }}
          name: codecov-${{ matrix.service }}-${{ matrix.python-version }}
          fail_ci_if_error: false

  frontend-quality:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./website
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint code
        run: npm run lint
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: website-build
          path: website/.next/
          retention-days: 30

  performance-tests:
    runs-on: ubuntu-latest
    needs: [python-tests]
    if: needs.changes.outputs.python == 'true' && github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION_DEFAULT }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
          pip install locust
      
      - name: Run performance tests
        run: |
          pytest tests/performance/ -v --tb=short
        continue-on-error: true
      
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-results
          path: tests/performance/results/
          retention-days: 30

  all-checks:
    runs-on: ubuntu-latest
    needs: [python-quality, python-tests, frontend-quality]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Python quality: ${{ needs.python-quality.result }}"
          echo "Python tests: ${{ needs.python-tests.result }}"
          echo "Frontend quality: ${{ needs.frontend-quality.result }}"
          
          if [[ "${{ needs.python-quality.result }}" == "failure" ]] || 
             [[ "${{ needs.python-tests.result }}" == "failure" ]] || 
             [[ "${{ needs.frontend-quality.result }}" == "failure" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          
          echo "All checks passed!"