name: Website Deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

env:
  NODE_VERSION: "20.x"
  WEBSITE_DIR: "./website"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.changes.outputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            website:
              - 'website/**'
              - '.github/workflows/website-deploy.yml'

  build-and-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.website == 'true'
    defaults:
      run:
        working-directory: ${{ env.WEBSITE_DIR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WEBSITE_DIR }}/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint
      
      - name: Run type checking
        run: npx tsc --noEmit
      
      - name: Run tests
        run: npm test --if-present
        continue-on-error: true
      
      - name: Build website
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
      
      - name: Check bundle size
        run: |
          if [ -d ".next" ]; then
            echo "## Bundle Analysis" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            du -sh .next/* >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: website-build
          path: |
            ${{ env.WEBSITE_DIR }}/.next/
            ${{ env.WEBSITE_DIR }}/public/
          retention-days: 30

  lighthouse-ci:
    runs-on: ubuntu-latest
    needs: [changes, build-and-test]
    if: needs.changes.outputs.website == 'true' && github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.WEBSITE_DIR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WEBSITE_DIR }}/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: website-build
          path: ${{ env.WEBSITE_DIR }}
      
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x
      
      - name: Run Lighthouse CI
        run: |
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__GITHUB_REPO_SLUG: ${{ github.repository }}
        continue-on-error: true
      
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: lighthouse-results
          path: ${{ env.WEBSITE_DIR }}/.lighthouseci/
          retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    needs: [changes, build-and-test]
    if: needs.changes.outputs.website == 'true'
    defaults:
      run:
        working-directory: ${{ env.WEBSITE_DIR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WEBSITE_DIR }}/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate --json > npm-audit-report.json
        continue-on-error: true
      
      - name: Check for known vulnerabilities
        run: |
          # Check for high/critical vulnerabilities
          if npm audit --audit-level=high; then
            echo "✅ No high or critical vulnerabilities found"
          else
            echo "❌ High or critical vulnerabilities detected"
            npm audit --audit-level=high
          fi
        continue-on-error: true
      
      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: website-security-scan
          path: ${{ env.WEBSITE_DIR }}/npm-audit-report.json
          retention-days: 30

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: ${{ env.WEBSITE_DIR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: website-build
          path: ${{ env.WEBSITE_DIR }}
      
      - name: Deploy to Cloudflare Pages (Preview)
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: skauswatch-website
          directory: ${{ env.WEBSITE_DIR }}/out
          wranglerVersion: '3'
      
      - name: Comment PR with preview URL
        uses: actions/github-script@v6
        with:
          script: |
            const comment = `## 🚀 Preview Deployment
            
            Your changes have been deployed to a preview environment:
            
            🔗 **Preview URL:** ${{ steps.deploy.outputs.url }}
            
            The preview will be available for 30 days or until the PR is merged/closed.
            
            ### Deployment Details
            - **Commit:** ${{ github.sha }}
            - **Environment:** Preview
            - **Build Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://skauswatch.io
    defaults:
      run:
        working-directory: ${{ env.WEBSITE_DIR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: website-build
          path: ${{ env.WEBSITE_DIR }}
      
      - name: Deploy to Cloudflare Pages (Production)
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: skauswatch-website
          directory: ${{ env.WEBSITE_DIR }}/out
          wranglerVersion: '3'
          branch: main
      
      - name: Purge Cloudflare cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
      
      - name: Verify production deployment
        run: |
          # Wait a bit for deployment to propagate
          sleep 30
          
          # Check if the site is accessible
          if curl -f https://skauswatch.io; then
            echo "✅ Production deployment successful"
          else
            echo "❌ Production deployment verification failed"
            exit 1
          fi

  post-deploy-tests:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: needs.deploy-production.result == 'success'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install test dependencies
        run: |
          npm install -g playwright-chromium lighthouse
          npx playwright install chromium
      
      - name: Run production smoke tests
        run: |
          # Basic smoke tests for the production site
          node -e "
            const https = require('https');
            const testUrls = [
              'https://skauswatch.io',
              'https://skauswatch.io/about',
              'https://skauswatch.io/features',
              'https://skauswatch.io/pricing'
            ];
            
            Promise.all(testUrls.map(url => 
              new Promise((resolve, reject) => {
                https.get(url, (res) => {
                  if (res.statusCode === 200) {
                    console.log(\`✅ \${url} - OK\`);
                    resolve();
                  } else {
                    console.log(\`❌ \${url} - \${res.statusCode}\`);
                    reject();
                  }
                }).on('error', reject);
              })
            )).then(() => {
              console.log('All smoke tests passed');
            }).catch(() => {
              console.error('Some smoke tests failed');
              process.exit(1);
            });
          "
      
      - name: Run Lighthouse audit on production
        run: |
          lighthouse https://skauswatch.io \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox" \
            --output=html \
            --output-path=production-lighthouse-report.html
        continue-on-error: true
      
      - name: Upload production Lighthouse report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: production-lighthouse-report
          path: production-lighthouse-report.html
          retention-days: 30

  seo-check:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: needs.deploy-production.result == 'success'
    
    steps:
      - name: SEO and metadata check
        run: |
          echo "Checking SEO and metadata..."
          
          # Check robots.txt
          if curl -f https://skauswatch.io/robots.txt; then
            echo "✅ robots.txt is accessible"
          else
            echo "❌ robots.txt is not accessible"
          fi
          
          # Check sitemap
          if curl -f https://skauswatch.io/sitemap.xml; then
            echo "✅ sitemap.xml is accessible"
          else
            echo "⚠️ sitemap.xml is not accessible"
          fi
          
          # Basic meta tag checks
          META_CHECK=$(curl -s https://skauswatch.io | grep -i "meta.*description\|meta.*og:")
          if [ -n "$META_CHECK" ]; then
            echo "✅ Meta tags found"
            echo "$META_CHECK"
          else
            echo "⚠️ No meta description or OpenGraph tags found"
          fi

  deployment-summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-preview, deploy-production, post-deploy-tests, lighthouse-ci]
    if: always()
    
    steps:
      - name: Generate deployment summary
        run: |
          echo "## Website Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse CI | ${{ needs.lighthouse-ci.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Preview Deploy | ${{ needs.deploy-preview.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Deploy | ${{ needs.deploy-production.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Post-Deploy Tests | ${{ needs.post-deploy-tests.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "🎉 **Production deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **Live Site:** https://skauswatch.io" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.deploy-preview.result }}" == "success" ]]; then
            echo "🚀 **Preview deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "👀 **Preview available in PR comments**" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.build-and-test.result }}" == "success" ]]; then
            echo "✅ **Build completed successfully**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment had issues - please check the logs**" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#website-deployments'
          text: |
            ❌ Website deployment failed!
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Please check the GitHub Actions logs.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}