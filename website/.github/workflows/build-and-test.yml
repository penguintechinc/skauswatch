name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.changes }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            manager:
              - 'services/manager/**'
              - 'shared/**'
              - 'docker-compose*.yml'
            aaa-monitor:
              - 'services/aaa-monitor/**'
              - 'shared/**'
              - 'docker-compose*.yml'
            pki-server:
              - 'services/pki-server/**'
              - 'shared/**'
              - 'docker-compose*.yml'
            ssh-ca:
              - 'services/ssh-ca/**'
              - 'shared/**'
              - 'docker-compose*.yml'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'

  build-images:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.services != '[]'
    strategy:
      matrix:
        service: [manager, aaa-monitor, pki-server, ssh-ca]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Check if service has changes
        id: service-changed
        run: |
          if [[ "${{ needs.changes.outputs.services }}" == *"${{ matrix.service }}"* ]] || [[ "${{ needs.changes.outputs.docker }}" == "true" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build Docker image
        if: steps.service-changed.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}

  security-scan:
    runs-on: ubuntu-latest
    needs: [changes, build-images]
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.services != '[]'
    strategy:
      matrix:
        service: [manager, aaa-monitor, pki-server, ssh-ca]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check if service has changes
        id: service-changed
        run: |
          if [[ "${{ needs.changes.outputs.services }}" == *"${{ matrix.service }}"* ]] || [[ "${{ needs.changes.outputs.docker }}" == "true" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Log in to Container Registry
        if: steps.service-changed.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run Trivy vulnerability scanner
        if: steps.service-changed.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
        continue-on-error: true
      
      - name: Upload Trivy scan results
        if: steps.service-changed.outputs.changed == 'true'
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'
        continue-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    needs: [changes, build-images]
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.services != '[]'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
          pip install docker-compose
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create test environment file
        run: |
          cp .env.example .env.test
          echo "SKAUSWATCH_ENV=testing" >> .env.test
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/skauswatch_test" >> .env.test
          echo "REDIS_URL=redis://localhost:6379/0" >> .env.test
      
      - name: Start services with docker-compose
        run: |
          # Update docker-compose to use built images
          sed -i 's|build: .|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-manager:${{ github.sha }}|' docker-compose.yml
          docker-compose --env-file .env.test up -d
        env:
          COMPOSE_PROJECT_NAME: skauswatch-test
      
      - name: Wait for services to be healthy
        run: |
          timeout 300 bash -c 'until docker-compose --env-file .env.test ps | grep "healthy"; do sleep 5; done'
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short --maxfail=5
        env:
          SKAUSWATCH_ENV: testing
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skauswatch_test
          REDIS_URL: redis://localhost:6379/0
      
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p logs
          docker-compose --env-file .env.test logs --no-color > logs/docker-compose.log
          for service in manager aaa-monitor pki-server ssh-ca; do
            docker-compose --env-file .env.test logs --no-color $service > logs/$service.log 2>&1 || true
          done
      
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: service-logs
          path: logs/
          retention-days: 30
      
      - name: Cleanup
        if: always()
        run: |
          docker-compose --env-file .env.test down -v

  performance-tests:
    runs-on: ubuntu-latest
    needs: [changes, build-images]
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.services != '[]'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
          pip install locust
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create test environment file
        run: |
          cp .env.example .env.test
          echo "SKAUSWATCH_ENV=testing" >> .env.test
      
      - name: Start services
        run: |
          docker-compose --env-file .env.test up -d
        env:
          COMPOSE_PROJECT_NAME: skauswatch-perf
      
      - name: Wait for services
        run: |
          timeout 300 bash -c 'until curl -f http://localhost:8000/health; do sleep 5; done'
      
      - name: Run performance tests
        run: |
          mkdir -p performance-results
          
          # Run Locust performance tests
          locust -f tests/performance/locustfile.py --headless \
            --users 10 --spawn-rate 2 --run-time 60s \
            --host http://localhost:8000 \
            --html performance-results/performance-report.html \
            --csv performance-results/performance
        continue-on-error: true
      
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-results
          path: performance-results/
          retention-days: 30
      
      - name: Cleanup
        if: always()
        run: |
          docker-compose --env-file .env.test down -v

  multi-arch-test:
    runs-on: ubuntu-latest
    needs: [changes, build-images]
    if: needs.changes.outputs.docker == 'true' && github.event_name == 'push'
    strategy:
      matrix:
        service: [manager, aaa-monitor, pki-server, ssh-ca]
        arch: [linux/amd64, linux/arm64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Test image on architecture
        run: |
          docker run --rm --platform ${{ matrix.arch }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }} \
            python -c "import sys; print(f'Python {sys.version} on {sys.platform}')"

  build-summary:
    runs-on: ubuntu-latest
    needs: [build-images, security-scan, integration-tests, performance-tests]
    if: always()
    
    steps:
      - name: Generate build summary
        run: |
          echo "## Build and Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Images | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build-images.result }}" != "success" ]]; then
            echo "❌ **Build failed** - Please check the build logs" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "⚠️ **Integration tests failed** - Please review test results" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All builds and tests passed**" >> $GITHUB_STEP_SUMMARY
          fi