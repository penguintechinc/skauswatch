# Grafana Datasource Configuration
# This file configures Prometheus as a datasource for Grafana

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # Prometheus datasource for metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      keepCookies: []
      timeInterval: "30s"
      queryTimeout: "60s"
      defaultRegion: "us-east-1"
      customQueryParameters: ""
      manageAlerts: true
      alertmanagerUid: ""
      prometheusType: Prometheus
      prometheusVersion: "2.40.0"
      cacheLevel: "High"
      disableMetricsLookup: false
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: "jaeger-uid"
          urlDisplayLabel: "View in Jaeger"

  # Elasticsearch datasource for logs
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    orgId: 1
    url: http://elasticsearch:9200
    database: "logstash-*"
    version: 1
    editable: true
    jsonData:
      interval: Daily
      timeField: "@timestamp"
      esVersion: "8.0.0"
      maxConcurrentShardRequests: 5
      logMessageField: "message"
      logLevelField: "level"
      includeFrozen: false

  # Example: Loki for logs (if you want to add it later)
