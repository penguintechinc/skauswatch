# Grafana Dashboard Provisioning Configuration
# This file configures automatic loading of dashboards

apiVersion: 1

providers:
  # SkausWatch Application Dashboards
  - name: 'skauswatch'
    orgId: 1
    folder: 'SkausWatch'
    folderUid: 'skauswatch'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/skauswatch

  # Infrastructure Dashboards
  - name: 'infrastructure'
    orgId: 1
    folder: 'Infrastructure'
    folderUid: 'infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/infrastructure

  # Security Dashboards
  - name: 'security'
    orgId: 1
    folder: 'Security'
    folderUid: 'security'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/security

  # Business Dashboards
  - name: 'business'
    orgId: 1
    folder: 'Business'
    folderUid: 'business'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/business