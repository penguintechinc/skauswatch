# Prometheus Configuration for SkausWatch
# Main configuration file for metrics collection

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
  external_labels:
    cluster: 'skauswatch'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Rule files
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: /metrics

  # SkausWatch Application Services
  - job_name: 'skauswatch-manager'
    static_configs:
      - targets: ['manager:8080']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: manager:8080

  - job_name: 'skauswatch-pki-server'
    static_configs:
      - targets: ['pki-server:8081']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: 'skauswatch-ssh-ca'
    static_configs:
      - targets: ['ssh-ca:8082']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: 'skauswatch-aaa-monitor'
    static_configs:
      - targets: ['aaa-monitor:8083']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s

  # Infrastructure Services
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s
    metrics_path: /metrics
    # Note: Requires postgres_exporter sidecar

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    metrics_path: /metrics
    # Note: Requires redis_exporter sidecar

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    scrape_interval: 30s
    metrics_path: /metrics

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    scrape_interval: 30s
    metrics_path: /_prometheus/metrics

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    scrape_interval: 30s
    metrics_path: /minio/v2/metrics/cluster

  # System and Container Metrics (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: []
        # - host.docker.internal:9100  # Uncomment if node_exporter is running

  - job_name: 'cadvisor'
    static_configs:
      - targets: []
        # - cadvisor:8080  # Uncomment if cadvisor is running

  # Web Services
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 30s
    metrics_path: /nginx_status
    # Note: Requires nginx_exporter or stub_status module

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: /metrics

  # Health Check Endpoints
  - job_name: 'health-checks'
    static_configs:
      - targets: 
        - 'manager:8080'
        - 'pki-server:8081'
        - 'ssh-ca:8082'
        - 'aaa-monitor:8083'
        - 'web-portal:3000'
    metrics_path: /health
    scrape_interval: 15s
    scrape_timeout: 5s
    params:
      format: ['prometheus']

  # Blackbox Exporter for endpoint monitoring
  - job_name: 'blackbox'
    static_configs:
      - targets: []
        # Configure blackbox_exporter targets here
    # metrics_path: /probe
    # params:
    #   module: [http_2xx]
    # relabel_configs:
    #   - source_labels: [__address__]
    #     target_label: __param_target
    #   - source_labels: [__param_target]
    #     target_label: instance
    #   - target_label: __address__
    #     replacement: blackbox-exporter:9115