# SkausWatch Prometheus Alerting Rules
# This file contains alerting rules for the SkausWatch application

groups:
  - name: skauswatch.application
    interval: 30s
    rules:
      # Service Health Alerts
      - alert: SkausWatchServiceDown
        expr: up{job=~"skauswatch-.*"} == 0
        for: 1m
        labels:
          severity: critical
          component: "{{ $labels.job }}"
        annotations:
          summary: "SkausWatch service is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute"

      - alert: SkausWatchServiceHighLatency
        expr: http_request_duration_seconds{job=~"skauswatch-.*"} > 5
        for: 5m
        labels:
          severity: warning
          component: "{{ $labels.job }}"
        annotations:
          summary: "High latency detected"
          description: "Service {{ $labels.job }} has high response latency (>5s) for 5 minutes"

      # Certificate Management Alerts
      - alert: CertificateExpiringWarning
        expr: certificate_expiry_days < 30
        for: 0s
        labels:
          severity: warning
          component: "pki"
        annotations:
          summary: "Certificate expiring in less than 30 days"
          description: "Certificate {{ $labels.certificate }} expires in {{ $value }} days"

      - alert: CertificateExpiringCritical
        expr: certificate_expiry_days < 7
        for: 0s
        labels:
          severity: critical
          component: "pki"
        annotations:
          summary: "Certificate expiring in less than 7 days"
          description: "Certificate {{ $labels.certificate }} expires in {{ $value }} days"

      - alert: CertificateCreationFailed
        expr: increase(certificate_creation_failures_total[5m]) > 0
        for: 0s
        labels:
          severity: warning
          component: "pki"
        annotations:
          summary: "Certificate creation failures detected"
          description: "{{ $value }} certificate creation failures in the last 5 minutes"

      # Authentication Alerts
      - alert: AuthenticationFailures
        expr: rate(authentication_failures_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          component: "auth"
        annotations:
          summary: "High authentication failure rate"
          description: "Authentication failure rate is {{ $value }} failures/sec"

      - alert: SuspiciousLoginActivity
        expr: increase(failed_login_attempts_total[10m]) > 10
        for: 0s
        labels:
          severity: critical
          component: "security"
        annotations:
          summary: "Suspicious login activity detected"
          description: "{{ $value }} failed login attempts in the last 10 minutes"

      # Performance Alerts
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 512
        for: 5m
        labels:
          severity: warning
          component: "performance"
        annotations:
          summary: "High memory usage"
          description: "Service {{ $labels.job }} is using {{ $value }}MB of memory"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: "performance"
        annotations:
          summary: "High CPU usage"
          description: "Service {{ $labels.job }} CPU usage is {{ $value }}%"

  - name: skauswatch.infrastructure
    interval: 30s
    rules:
      # Database Alerts
      - alert: DatabaseConnectionsHigh
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          component: "database"
        annotations:
          summary: "Database connection pool near capacity"
          description: "PostgreSQL connection usage is at {{ $value }}%"

      - alert: DatabaseSlowQueries
        expr: pg_stat_statements_mean_time_ms > 1000
        for: 5m
        labels:
          severity: warning
          component: "database"
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time is {{ $value }}ms"

      # Redis Alerts
      - alert: RedisConnectionsHigh
        expr: redis_connected_clients / redis_config_maxclients > 0.8
        for: 5m
        labels:
          severity: warning
          component: "cache"
        annotations:
          summary: "Redis connection pool near capacity"
          description: "Redis connection usage is at {{ $value }}%"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: "cache"
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is at {{ $value }}%"

      # RabbitMQ Alerts
      - alert: RabbitMQQueueGrowth
        expr: rabbitmq_queue_messages > 1000
        for: 5m
        labels:
          severity: warning
          component: "queue"
        annotations:
          summary: "RabbitMQ queue growing"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages"

      - alert: RabbitMQConsumerDown
        expr: rabbitmq_queue_consumers == 0
        for: 2m
        labels:
          severity: critical
          component: "queue"
        annotations:
          summary: "No consumers for RabbitMQ queue"
          description: "Queue {{ $labels.queue }} has no consumers"

      # Elasticsearch Alerts
      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 1m
        labels:
          severity: critical
          component: "search"
        annotations:
          summary: "Elasticsearch cluster health is red"
          description: "Elasticsearch cluster {{ $labels.cluster }} is in red state"

      - alert: ElasticsearchDiskSpaceLow
        expr: elasticsearch_filesystem_data_available_bytes / elasticsearch_filesystem_data_size_bytes < 0.1
        for: 5m
        labels:
          severity: warning
          component: "search"
        annotations:
          summary: "Elasticsearch disk space low"
          description: "Elasticsearch node {{ $labels.node }} has less than 10% disk space available"

  - name: skauswatch.security
    interval: 30s
    rules:
      # Security Monitoring
      - alert: UnauthorizedAccess
        expr: increase(http_requests_total{status=~"401|403"}[5m]) > 20
        for: 0s
        labels:
          severity: warning
          component: "security"
        annotations:
          summary: "High number of unauthorized access attempts"
          description: "{{ $value }} unauthorized access attempts in the last 5 minutes"

      - alert: AbnormalTrafficPattern
        expr: rate(http_requests_total[5m]) > rate(http_requests_total[1h]) * 5
        for: 2m
        labels:
          severity: warning
          component: "security"
        annotations:
          summary: "Abnormal traffic pattern detected"
          description: "Request rate is 5x higher than normal for service {{ $labels.job }}"

      # SSL Certificate Monitoring
      - alert: SSLCertificateExpiring
        expr: ssl_certificate_expiry_days < 30
        for: 0s
        labels:
          severity: warning
          component: "ssl"
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value }} days"

      - alert: SSLCertificateExpiringSoon
        expr: ssl_certificate_expiry_days < 7
        for: 0s
        labels:
          severity: critical
          component: "ssl"
        annotations:
          summary: "SSL certificate expiring very soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value }} days"

      # CA Operations Monitoring
      - alert: CAOperationsBlocked
        expr: ca_operations_blocked_total > 0
        for: 0s
        labels:
          severity: critical
          component: "ca"
        annotations:
          summary: "CA operations are blocked"
          description: "{{ $value }} CA operations have been blocked due to security concerns"

      - alert: HighVolumeCARequests
        expr: rate(ca_certificate_requests_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: "ca"
        annotations:
          summary: "High volume of CA certificate requests"
          description: "Certificate request rate is {{ $value }} requests/sec"

  - name: skauswatch.business
    interval: 60s
    rules:
      # Business Logic Monitoring
      - alert: CertificateRenewalFailures
        expr: increase(certificate_renewal_failures_total[1h]) > 5
        for: 0s
        labels:
          severity: warning
          component: "renewal"
        annotations:
          summary: "Multiple certificate renewal failures"
          description: "{{ $value }} certificate renewal failures in the last hour"

      - alert: BackupFailure
        expr: backup_last_success_timestamp < time() - 86400
        for: 0s
        labels:
          severity: critical
          component: "backup"
        annotations:
          summary: "Backup hasn't succeeded in 24 hours"
          description: "Last successful backup was {{ $value }} seconds ago"

      - alert: AuditLogIngestionFailed
        expr: increase(audit_log_ingestion_failures_total[10m]) > 0
        for: 0s
        labels:
          severity: warning
          component: "audit"
        annotations:
          summary: "Audit log ingestion failures"
          description: "{{ $value }} audit log ingestion failures in the last 10 minutes"

      # Compliance Monitoring
      - alert: ComplianceViolation
        expr: compliance_violations_total > 0
        for: 0s
        labels:
          severity: critical
          component: "compliance"
        annotations:
          summary: "Compliance violation detected"
          description: "{{ $value }} compliance violations detected"

      - alert: PolicyViolation
        expr: increase(policy_violations_total[5m]) > 0
        for: 0s
        labels:
          severity: warning
          component: "policy"
        annotations:
          summary: "Policy violation detected"
          description: "{{ $value }} policy violations in the last 5 minutes"