# HAProxy Configuration for SkausWatch Production
# This configuration provides load balancing and SSL termination

global
    log stdout local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # SSL Configuration
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 2s
    timeout check 10s
    retries 3

    # Security Headers
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Content-Security-Policy "default-src 'self'"

# Frontend for HTTPS traffic
frontend https_frontend
    bind *:443 ssl crt /etc/ssl/certs/skauswatch/cert.pem
    mode http
    
    # Redirect to HTTPS if necessary
    redirect scheme https if !{ ssl_fc }
    
    # HSTS Header
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    
    # ACLs for routing
    acl is_api path_beg /api/
    acl is_pki path_beg /pki/
    acl is_ssh path_beg /ssh-ca/
    acl is_aaa path_beg /aaa/
    acl is_grafana hdr(host) -i grafana.skauswatch.local
    acl is_prometheus hdr(host) -i prometheus.skauswatch.local
    
    # Routing rules
    use_backend api_backend if is_api
    use_backend pki_backend if is_pki
    use_backend ssh_ca_backend if is_ssh
    use_backend aaa_backend if is_aaa
    use_backend grafana_backend if is_grafana
    use_backend prometheus_backend if is_prometheus
    default_backend web_backend

# Frontend for HTTP traffic (redirect to HTTPS)
frontend http_frontend
    bind *:80
    mode http
    redirect scheme https

# Stats frontend
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats realm HAProxy\ Statistics
    stats admin if TRUE

# Backend definitions
backend web_backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server web1 web-portal:3000 check

backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server api1 manager:8080 check

backend pki_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server pki1 pki-server:8081 check

backend ssh_ca_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server ssh1 ssh-ca:8082 check

backend aaa_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server aaa1 aaa-monitor:8083 check

backend grafana_backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server grafana1 grafana:3000 check

backend prometheus_backend
    mode http
    balance roundrobin
    option httpchk GET /-/healthy
    http-check expect status 200
    server prometheus1 prometheus:9090 check