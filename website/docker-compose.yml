version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: skauswatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skauswatch}
      POSTGRES_USER: ${POSTGRES_USER:-skauswatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - skauswatch-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skauswatch} -d ${POSTGRES_DB:-skauswatch}"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: skauswatch-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - skauswatch-net
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: skauswatch-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-skauswatch}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devpassword}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - skauswatch-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: skauswatch-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-skauswatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devpassword123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - skauswatch-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Elasticsearch for Log Storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: skauswatch-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "${ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - skauswatch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)'"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: skauswatch-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/rules:/etc/prometheus/rules
    networks:
      - skauswatch-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: skauswatch-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - skauswatch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f localhost:3000/api/health && echo 'ready'"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Manager Service (Main API Gateway)
  manager:
    image: skauswatch/manager:${SKAUSWATCH_VERSION:-latest}
    container_name: skauswatch-manager
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-skauswatch}:${RABBITMQ_PASSWORD:-devpassword}@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-skauswatch}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-devpassword123}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PKI_SERVER_URL=http://pki-server:8081
      - SSH_CA_URL=http://ssh-ca:8082
      - AAA_MONITOR_URL=http://aaa-monitor:8083
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-32-characters}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEBUG=${DEBUG:-false}
    ports:
      - "${MANAGER_PORT:-8080}:8080"
    volumes:
      - ./config/manager:/app/config
      - ./data/manager:/app/data
      - ./logs/manager:/app/logs
    networks:
      - skauswatch-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PKI Server
  pki-server:
    image: skauswatch/pki-server:${SKAUSWATCH_VERSION:-latest}
    container_name: skauswatch-pki-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-skauswatch}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-devpassword123}
      - HSM_ENABLED=${HSM_ENABLED:-false}
      - CA_ROOT_PATH=/app/ca/root
      - CA_INTERMEDIATE_PATH=/app/ca/intermediate
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${PKI_SERVER_PORT:-8081}:8081"
    volumes:
      - ./config/pki-server:/app/config
      - ./data/pki/ca:/app/ca
      - ./data/pki/certs:/app/certs
      - ./logs/pki-server:/app/logs
    networks:
      - skauswatch-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # SSH CA Server
  ssh-ca:
    image: skauswatch/ssh-ca:${SKAUSWATCH_VERSION:-latest}
    container_name: skauswatch-ssh-ca
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-skauswatch}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-devpassword123}
      - SSH_CA_KEY_PATH=/app/ssh-ca/ca_key
      - SSH_CA_CERT_PATH=/app/ssh-ca/ca_cert.pub
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${SSH_CA_PORT:-8082}:8082"
    volumes:
      - ./config/ssh-ca:/app/config
      - ./data/ssh-ca:/app/ssh-ca
      - ./logs/ssh-ca:/app/logs
    networks:
      - skauswatch-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AAA Monitor Service
  aaa-monitor:
    image: skauswatch/aaa-monitor:${SKAUSWATCH_VERSION:-latest}
    container_name: skauswatch-aaa-monitor
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-skauswatch}:${RABBITMQ_PASSWORD:-devpassword}@rabbitmq:5672/
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${AAA_MONITOR_PORT:-8083}:8083"
    volumes:
      - ./config/aaa-monitor:/app/config
      - ./data/aaa-monitor:/app/data
      - ./logs/aaa-monitor:/app/logs
    networks:
      - skauswatch-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Web Portal (Frontend)
  web-portal:
    image: skauswatch/web-portal:${SKAUSWATCH_VERSION:-latest}
    container_name: skauswatch-web-portal
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_PKI_URL=http://localhost:8081
      - NEXT_PUBLIC_SSH_CA_URL=http://localhost:8082
      - NEXT_PUBLIC_AAA_URL=http://localhost:8083
      - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "${WEB_PORTAL_PORT:-3000}:3000"
    networks:
      - skauswatch-net
    depends_on:
      - manager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: skauswatch-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./config/ssl:/etc/ssl/certs/skauswatch
      - ./logs/nginx:/var/log/nginx
    networks:
      - skauswatch-net
    depends_on:
      - web-portal
      - manager
      - pki-server
      - ssh-ca
      - aaa-monitor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  skauswatch-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16