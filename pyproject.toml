[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skauswatch"
version = "0.1.0"
description = "Security Monitoring and Alerting System"
authors = [
    {name = "Penguin Tech Inc", email = "dev@skauswatch.io"},
]
maintainers = [
    {name = "SkausWatch Team", email = "support@skauswatch.io"},
]
readme = "README.md"
license = {text = "Commercial"}
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
keywords = ["security", "monitoring", "alerting", "ssh", "pki", "certificates"]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "cryptography>=41.0.0",
    "paramiko>=3.4.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "asyncpg>=0.29.0",
    "aioredis>=2.0.1",
    "py4web>=1.20240906.1",
    "pydal>=20240401.1",
    "websocket-client>=1.6.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "httpx>=0.25.0",
    "factory-boy>=3.3.0",
    "faker>=20.1.0",
    "coverage[toml]>=7.3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "factory-boy>=3.3.0",
    "faker>=20.1.0",
    "coverage[toml]>=7.3.0",
    "fakeredis[lua]>=2.20.0",
    "pytest-playwright>=0.4.0",
    "respx>=0.21.0",
]

[project.scripts]
skauswatch = "skauswatch.cli:main"
skauswatch-manager = "skauswatch.services.manager.cli:main"
skauswatch-pki = "skauswatch.services.pki_server.cli:main"
skauswatch-ssh-ca = "skauswatch.services.ssh_ca.cli:main"
skauswatch-aaa = "skauswatch.services.aaa_monitor.cli:main"

[project.urls]
Homepage = "https://skauswatch.io"
Documentation = "https://docs.skauswatch.io"
Repository = "https://github.com/penguintechinc/skauswatch"
Issues = "https://github.com/penguintechinc/skauswatch/issues"

# Tool configurations
[tool.setuptools.packages.find]
where = ["."]
include = ["skauswatch*", "services*", "shared*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.conf", "*.cfg"]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["skauswatch", "services", "shared"]

[tool.ruff]
target-version = "py313"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-args
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # Use `raise from` to specify exception cause
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "ARG", "FBT"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
    "services/manager-new/tests",
    "services/pki-server-new/tests",
    "services/ssh-ca/tests",
    "services/aaa-monitor/tests",
    "services/worker-s3/tests",
    "services/worker-scanner/tests",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "smoke: marks tests as smoke tests (pre-commit, <2 min)",
    "api: marks tests as API endpoint tests",
    "functional: marks tests as functional/browser tests",
    "performance: marks tests as performance/load tests",
    "security: marks tests as security tests",
    "lint: marks tests as lint validation tests",
    "build: marks tests as Docker build tests",
    "stream: marks tests as Redis Stream/pipeline tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["skauswatch", "services", "shared"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__main__.py",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"