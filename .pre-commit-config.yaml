# PenguinTech standard git hooks.
#
# Install:  make install-hooks
# Run all:  pre-commit run --all-files
#
# Two stages, matching devops.md "Git Hooks (Mandatory)":
#   pre-commit — fast checks only (<30s), blocks the commit
#   pre-push   — heavier security scans, blocks the push
#
# Revs are pinned. Update deliberately via `pre-commit autoupdate` or Renovate,
# never by floating to a branch.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ── Hygiene ────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates use Go template syntax ({{ ... }}) inside YAML,
        # which isn't valid plain YAML until rendered — standard exclude,
        # not a real defect. Chart values files (alpha.yml, etc.) aren't
        # under templates/ and stay checked.
        exclude: ^k8s/helm/.*/templates/
      - id: check-json
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: detect-private-key

  # ── Secrets (mandatory, every repo) ────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── Shell (Bash must stay 3.2-compatible — see general.md) ─────────────────
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # ── Python — ruff ONLY, never alongside flake8/black/isort ─────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── Dockerfiles ────────────────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint

  # ── Security (pre-push — heavier, keeps commits fast) ──────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        # All Python in this repo lives under tests/ (legacy pytest,
        # pre-Rust-migration — see Makefile test-e2e note) — nothing to
        # exclude, it's the only Python present.
        args: [-r, -c, pyproject.toml]
        stages: [pre-push]

  - repo: local
    hooks:
      - id: dockerfile-rootless
        name: Dockerfile runs as non-root
        entry: scripts/hooks/check-dockerfile-rootless.sh
        language: script
        files: (^|/)Dockerfile[^/]*$
        stages: [pre-push]
