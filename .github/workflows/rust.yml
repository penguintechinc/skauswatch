name: Rust CI

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - 'crates/**'
      - 'services/**/Cargo.toml'
      - 'services/**/src/**'
      - 'proto/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - 'crates/**'
      - 'services/**/Cargo.toml'
      - 'services/**/src/**'
      - 'proto/**'
      - '.github/workflows/rust.yml'

env:
  CARGO_TERM_COLOR: always
  # Locked resolution only — Cargo.lock is the source of truth
  CARGO_NET_RETRY: "3"

jobs:
  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      # rustup honors rust-toolchain.toml; runner ships rustup preinstalled
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Real Postgres + Valkey for DB/handler tests (skauswatch-testkit provisions
    # an isolated schema per test against this instance — see
    # docs/v2-port/testing-pattern.md). No trait-abstracted/mocked DB layer:
    # AppState.db is a concrete sqlx::PgPool in every service, so DB-layer
    # coverage requires a real database in CI, not a double.
    services:
      postgres:
        image: postgres:17-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # skauswatch-testkit::db::test_pool defaults (see crates/skauswatch-testkit/src/db.rs)
      # already match these, but set explicitly so `skauswatch_db::DbConfig::from_env()`
      # based tests/binaries also resolve the same instance.
      DB_TYPE: postgresql
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo test
        run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-deny (pinned)
        run: cargo install cargo-deny --version 0.20.2 --locked
      # cargo-deny's `advisories` check reads the same RustSec DB as cargo-audit
      # and is a strict superset (it also enforces licenses/bans/sources) — and,
      # unlike cargo-audit, it honors the documented `[advisories] ignore` list
      # in deny.toml. Running both meant maintaining two ignore configs, so
      # cargo-deny is the single supply-chain gate.
      - name: cargo deny
        run: cargo deny check

  coverage:
    name: Coverage (>=90%)
    runs-on: ubuntu-latest
    # Same real Postgres + Valkey as the `test` job — coverage must exercise
    # the same DB-backed handler/repo tests, not a reduced subset.
    services:
      postgres:
        image: postgres:17-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_TYPE: postgresql
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools
      - name: Install cargo-llvm-cov (pinned)
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: cargo llvm-cov
        # main.rs/bin entry points are exercised by the `healthcheck` subcommand
        # / smoke path, not unit tests — excluded from the denominator so the
        # gate measures unit-testable code (handlers, DB layer, crypto,
        # services). No other file category is excluded: every handler/route/
        # db/service/crypto file must be covered.
        run: |
          cargo llvm-cov --workspace --locked --fail-under-lines 90 \
            --ignore-filename-regex '(^|/)src/main\.rs$|(^|/)src/bin/'
