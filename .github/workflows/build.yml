name: Build and Push Images

# Matrix image build for the 12 Rust services + webui. Every Dockerfile lives
# at services/<dir>/Dockerfile and is built from the REPO ROOT context
# (docker build -f services/<dir>/Dockerfile .) — see BUILD.md.
#
# Tagging (see devops.md CI/CD Tag Naming):
#   release/**  -> beta-<epoch64>   (pushed) + rolling :beta-latest
#   main        -> gamma-<epoch64>  (pushed) + rolling :gamma-latest
#   tags v*     -> v{semver}        (pushed)
#   pull_request -> build-only, never pushed
#
# This is the SINGLE build+push authority for all images (the former beta.yml /
# publish.yml duplicated it and were removed). The rolling :beta-latest tag is
# what scripts/deploy-beta.sh pulls by default. The stable :latest tag is owned
# separately by promote-latest.yml (fires on GitHub `release: released`, not on
# every tag push — so :latest tracks the latest *released* version, by design).
#
# rust.yml (fmt/clippy/test/audit+deny/coverage) gates correctness; this
# workflow only builds/publishes images and does not duplicate those checks.

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
    paths:
      - 'services/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.version'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'services/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

jobs:
  determine-tag:
    name: Determine image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      push: ${{ steps.tag.outputs.push }}
      rolling: ${{ steps.tag.outputs.rolling }}
    steps:
      - name: Determine tag and push eligibility
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "tag=pr-${SHA:0:12}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "rolling=" >> "$GITHUB_OUTPUT"
          elif [[ "${REF}" == refs/tags/v* ]]; then
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "rolling=" >> "$GITHUB_OUTPUT"
          elif [ "${REF}" = "refs/heads/main" ]; then
            echo "tag=gamma-$(date +%s)000" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "rolling=gamma-latest" >> "$GITHUB_OUTPUT"
          elif [[ "${REF}" == refs/heads/release/* ]]; then
            echo "tag=beta-$(date +%s)000" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "rolling=beta-latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=alpha-$(date +%s)000" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "rolling=" >> "$GITHUB_OUTPUT"
          fi

  build-platform:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: determine-tag
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - manager
          - pki
          - sshca
          - logs
          - codescan-backend
          - monitor
          - vault
          - s3scan
          - scanner
          - worker-codescan
          - worker-vault-sync
          - endpoint-agent
          - webui
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Determine arch suffix
        id: arch
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "suffix=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to GitHub Container Registry
        if: needs.determine-tag.outputs.push == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }} (${{ matrix.platform }})
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ needs.determine-tag.outputs.push == 'true' }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.arch.outputs.suffix }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ steps.arch.outputs.suffix }},mode=max
          build-args: |
            VERSION=${{ needs.determine-tag.outputs.tag }}
          tags: |
            ghcr.io/penguintechinc/skauswatch/${{ matrix.service }}:${{ needs.determine-tag.outputs.tag }}-${{ steps.arch.outputs.suffix }}

  merge-manifests:
    name: Merge ${{ matrix.service }} manifest
    runs-on: ubuntu-latest
    needs: [determine-tag, build-platform]
    if: needs.determine-tag.outputs.push == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - manager
          - pki
          - sshca
          - logs
          - codescan-backend
          - monitor
          - vault
          - s3scan
          - scanner
          - worker-codescan
          - worker-vault-sync
          - endpoint-agent
          - webui
    steps:
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest for ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ needs.determine-tag.outputs.tag }}
          ROLLING: ${{ needs.determine-tag.outputs.rolling }}
        run: |
          # ROLLING is a fixed literal (beta-latest / gamma-latest / empty) set
          # by determine-tag — never user input — so unquoted expansion below is
          # a deliberate "add one --tag or nothing", not an injection vector.
          rolling_tag=""
          if [ -n "${ROLLING}" ]; then
            rolling_tag="--tag ghcr.io/penguintechinc/skauswatch/${SERVICE}:${ROLLING}"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            --tag "ghcr.io/penguintechinc/skauswatch/${SERVICE}:${TAG}" \
            ${rolling_tag} \
            "ghcr.io/penguintechinc/skauswatch/${SERVICE}:${TAG}-amd64" \
            "ghcr.io/penguintechinc/skauswatch/${SERVICE}:${TAG}-arm64"
