name: Build and Push Images

# Matrix image build for the 13 Rust services + webui. Every Dockerfile lives
# at services/<dir>/Dockerfile and is built from the REPO ROOT context
# (docker build -f services/<dir>/Dockerfile .) — see BUILD.md.
#
# Tagging (see devops.md CI/CD Tag Naming):
#   release/**  -> beta-<epoch64>   (pushed) + rolling :beta-latest
#   main        -> gamma-<epoch64>  (pushed) + rolling :gamma-latest
#   tags v*     -> v{semver}        (pushed)
#   pull_request -> build-only, never pushed
#
# This is the SINGLE build+push authority for all images (the former beta.yml /
# publish.yml duplicated it and were removed). The rolling :beta-latest tag is
# what scripts/deploy-beta.sh pulls by default. The stable :latest tag is owned
# separately by promote-latest.yml (fires on GitHub `release: released`, not on
# every tag push — so :latest tracks the latest *released* version, by design).
#
# rust.yml (fmt/clippy/test/audit+deny/coverage) gates correctness; this
# workflow only builds/publishes images and does not duplicate those checks.

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
    paths:
      - 'services/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.version'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'services/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  determine-tag:
    name: Determine image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      push: ${{ steps.tag.outputs.push }}
      rolling: ${{ steps.tag.outputs.rolling }}
    steps:
      - name: Determine tag and push eligibility
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # Grouped redirects (SC2129): one append per branch, not three.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            {
              echo "tag=pr-${SHA:0:12}"
              echo "push=false"
              echo "rolling="
            } >> "$GITHUB_OUTPUT"
          elif [[ "${REF}" == refs/tags/v* ]]; then
            {
              echo "tag=${REF_NAME}"
              echo "push=true"
              echo "rolling="
            } >> "$GITHUB_OUTPUT"
          elif [ "${REF}" = "refs/heads/main" ]; then
            {
              echo "tag=gamma-$(date +%s)000"
              echo "push=true"
              echo "rolling=gamma-latest"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${REF}" == refs/heads/release/* ]]; then
            {
              echo "tag=beta-$(date +%s)000"
              echo "push=true"
              echo "rolling=beta-latest"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=alpha-$(date +%s)000"
              echo "push=false"
              echo "rolling="
            } >> "$GITHUB_OUTPUT"
          fi

  build-platform:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: determine-tag
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - manager
          - pki
          - sshca
          - logs
          - codescan-backend
          - depgate
          - monitor
          - vault
          - s3scan
          - scanner
          - worker-codescan
          - worker-vault-sync
          - endpoint-agent
          - svc-ingest
          - webui
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Determine arch suffix
        id: arch
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "suffix=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to GitHub Container Registry
        if: needs.determine-tag.outputs.push == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }} (${{ matrix.platform }})
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          # webui is a self-contained Node build (its Dockerfile COPYs
          # package.json/.npmrc/src relative to its own dir); every Rust service
          # is a Cargo workspace build that needs the repo root as context.
          context: ${{ matrix.service == 'webui' && 'services/webui' || '.' }}
          file: services/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ needs.determine-tag.outputs.push == 'true' }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.arch.outputs.suffix }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ steps.arch.outputs.suffix }},mode=max
          build-args: |
            VERSION=${{ needs.determine-tag.outputs.tag }}
          tags: |
            ghcr.io/penguintechinc/skauswatch/${{ matrix.service }}:${{ needs.determine-tag.outputs.tag }}-${{ steps.arch.outputs.suffix }}

  merge-manifests:
    name: Merge ${{ matrix.service }} manifest
    runs-on: ubuntu-latest
    needs: [determine-tag, build-platform]
    if: needs.determine-tag.outputs.push == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - manager
          - pki
          - sshca
          - logs
          - codescan-backend
          - depgate
          - monitor
          - vault
          - s3scan
          - scanner
          - worker-codescan
          - worker-vault-sync
          - endpoint-agent
          - svc-ingest
          - webui
    steps:
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest for ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ needs.determine-tag.outputs.tag }}
          ROLLING: ${{ needs.determine-tag.outputs.rolling }}
        run: |
          # ROLLING is a fixed literal (beta-latest / gamma-latest / empty) set
          # by determine-tag — never user input — so unquoted expansion below is
          # a deliberate "add one --tag or nothing", not an injection vector.
          rolling_tag=""
          if [ -n "${ROLLING}" ]; then
            rolling_tag="--tag ghcr.io/penguintechinc/skauswatch/${SERVICE}:${ROLLING}"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            --tag "ghcr.io/penguintechinc/skauswatch/${SERVICE}:${TAG}" \
            ${rolling_tag} \
            "ghcr.io/penguintechinc/skauswatch/${SERVICE}:${TAG}-amd64" \
            "ghcr.io/penguintechinc/skauswatch/${SERVICE}:${TAG}-arm64"

  sbom:
    name: SBOM ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [determine-tag, merge-manifests]
    # Self-SBOM for our own release artifacts (EU CRA) — every pushed image
    # (beta/gamma/prod), never the build-only PR path. Additive: does not
    # gate or alter the build/push steps above.
    if: needs.determine-tag.outputs.push == 'true'
    permissions:
      contents: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - manager
          - pki
          - sshca
          - logs
          - codescan-backend
          - depgate
          - monitor
          - vault
          - s3scan
          - scanner
          - worker-codescan
          - worker-vault-sync
          - endpoint-agent
          - svc-ingest
          - webui
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM (syft) for ${{ matrix.service }}
        # Same tool/format the CodeScan customer feature uses (syft, -o
        # cyclonedx-json — see services/worker-codescan/src/scanner_tool.rs)
        # applied to our own just-pushed multi-arch image. upload-artifact
        # always publishes a workflow artifact; upload-release-assets only
        # applies for a real v* tag build, where version-release.yml has
        # already created the GitHub release (as a pre-release) that owns
        # this tag — branch pushes (main/release/**) have no release to
        # attach to.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ghcr.io/penguintechinc/skauswatch/${{ matrix.service }}:${{ needs.determine-tag.outputs.tag }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}-${{ needs.determine-tag.outputs.tag }}.cyclonedx.json
          artifact-name: sbom-${{ matrix.service }}-${{ needs.determine-tag.outputs.tag }}.cyclonedx.json
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: ${{ startsWith(github.ref, 'refs/tags/v') }}
