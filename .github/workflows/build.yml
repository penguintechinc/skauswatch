name: Build, Test, and Security Scan

on:
  push:
    branches:
      - main
      - develop
      - v1.x
    paths:
      - 'services/**'
      - 'shared/**'
      - 'deployment/**'
      - 'tests/**'
      - '.version'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
      - develop
      - v1.x
    paths:
      - 'services/**'
      - 'shared/**'
      - 'deployment/**'
      - 'tests/**'
      - '.version'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: read
  security-events: write

# ============================================================
# Group 1: Lint (parallel, fast — no dependencies)
# ============================================================

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install linting tools
        run: pip install black isort flake8 mypy

      - name: Run black check
        run: black --check services/ shared/

      - name: Run isort check
        run: isort --check-only services/ shared/

      - name: Run flake8 (full ruleset)
        run: |
          flake8 services/ shared/ \
            --count --show-source --statistics \
            --max-line-length=120 \
            --extend-ignore=E203,W503

      - name: Run mypy type checking
        run: mypy services/ shared/ --ignore-missing-imports
        continue-on-error: true

  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/edr-agent/go.sum

      - name: Run gofmt check
        run: |
          cd services/edr-agent
          UNFMT=$(gofmt -l .)
          if [ -n "$UNFMT" ]; then
            echo "Files not formatted:"
            echo "$UNFMT"
            exit 1
          fi

      - name: Run go vet
        run: |
          cd services/edr-agent
          go vet ./...

  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure npm for GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@penguintechinc:registry=https://npm.pkg.github.com" >> services/webui/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> services/webui/.npmrc

      - name: Install dependencies
        run: |
          cd services/webui
          npm ci

      - name: Run ESLint
        run: |
          cd services/webui
          npm run lint

      - name: Run TypeScript check
        run: |
          cd services/webui
          npm run typecheck

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Group 2: Security (parallel, after lint)
  # ============================================================

  security-bandit:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan (BLOCKING)
        run: |
          bandit -r services/ shared/ \
            -ll --severity-level high \
            -f json -o bandit-report.json

      - name: Display bandit results
        if: always()
        run: |
          python3 << 'EOF'
          import json
          try:
              with open('bandit-report.json', 'r') as f:
                  data = json.load(f)
                  print("\nBandit Security Report Summary")
                  print("==============================")
                  if data.get('results'):
                      print(f"Issues Found: {len(data['results'])}")
                      for issue in data['results']:
                          sev = issue.get('severity', 'unknown')
                          text = issue.get('issue_text', '')
                          fname = issue.get('filename', '')
                          line = issue.get('line_number', 0)
                          print(f"\n- {text}")
                          print(f"  Severity: {sev}")
                          print(f"  File: {fname}:{line}")
                  else:
                      print("No high-severity issues found.")
          except Exception:
              print("Could not parse bandit report")
          EOF

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  security-gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/edr-agent/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: |
          cd services/edr-agent
          gosec ./...

  security-npm:
    name: Security Scan (npm audit)
    runs-on: ubuntu-latest
    needs: [lint-typescript]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure npm for GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@penguintechinc:registry=https://npm.pkg.github.com" >> services/webui/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> services/webui/.npmrc

      - name: Install dependencies
        run: |
          cd services/webui
          npm ci

      - name: Run npm audit
        run: |
          cd services/webui
          npm audit --audit-level=high

  # ============================================================
  # Group 3: Docker Build (matrix, after security)
  # ============================================================

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [security-bandit, security-gosec, security-npm]
    strategy:
      fail-fast: false
      matrix:
        service:
          - manager-new
          - pki-server-new
          - ssh-ca
          - aaa-monitor
          - worker-s3
          - worker-scanner
          - webui
          - edr-agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat .version | xargs)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "EPOCH64=$(date +%s)000" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        env:
          SERVICE: ${{ matrix.service }}
          IMG_VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_TIME: ${{ steps.version.outputs.EPOCH64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          tags: |
            ghcr.io/penguintechinc/skauswatch-${{ matrix.service }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/penguintechinc/skauswatch-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_TIME=${{ steps.version.outputs.EPOCH64 }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Group 4: Container Scanning (after build, main branch only)
  # ============================================================

  trivy-scan:
    name: Container Scan (Trivy) - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - manager-new
          - pki-server-new
          - webui
          - edr-agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image for scanning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build -t "scan-${{ matrix.service }}:latest" \
            --build-arg "GITHUB_TOKEN=${GH_TOKEN}" \
            "./services/${{ matrix.service }}"

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-${{ matrix.service }}:latest
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ============================================================
  # Group 5: Tests (parallel, after lint — no build dependency)
  # ============================================================

  test-unit-python:
    name: Test Python (Unit + API + Smoke)
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx fakeredis
          pip install -r services/manager-new/requirements.txt 2>/dev/null || true
          pip install -r services/worker-scanner/requirements.txt 2>/dev/null || true

      - name: Run unit tests
        run: |
          pytest tests/ -v \
            --cov=services --cov=shared \
            --cov-report=xml \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --ignore=tests/performance \
            -m "not slow and not integration and not e2e"

      - name: Run per-service unit tests
        run: |
          for service in manager-new pki-server-new ssh-ca aaa-monitor worker-s3 worker-scanner; do
            if [ -d "services/${service}/tests" ]; then
              echo "=== Testing ${service} ==="
              pytest "services/${service}/tests/" -v --tb=short || true
            fi
          done

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-unit-go:
    name: Test Go
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/edr-agent/go.sum

      - name: Run Go tests
        run: |
          cd services/edr-agent
          go test ./... -v -race -coverprofile=coverage.out

      - name: Upload Go coverage
        uses: codecov/codecov-action@v3
        with:
          files: services/edr-agent/coverage.out
          flags: go
          fail_ci_if_error: false

  test-unit-webui:
    name: Test WebUI (Vitest)
    runs-on: ubuntu-latest
    needs: [lint-typescript]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure npm for GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@penguintechinc:registry=https://npm.pkg.github.com" >> services/webui/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> services/webui/.npmrc

      - name: Install dependencies
        run: |
          cd services/webui
          npm ci

      - name: Run Vitest
        run: |
          cd services/webui
          npx vitest run --reporter=verbose

  test-security:
    name: Test Security Suite
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio httpx
          pip install -r services/manager-new/requirements.txt 2>/dev/null || true

      - name: Run security tests
        run: |
          pytest tests/security/ -v -m security
