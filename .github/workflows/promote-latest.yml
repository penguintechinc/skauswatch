name: Promote Release to Latest

on:
  release:
    types: [released]

permissions:
  contents: read
  packages: write

jobs:
  tag-latest:
    name: Tag latest for ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [manager-new, pki-server-new, ssh-ca, aaa-monitor, worker-s3, worker-scanner, webui, edr-agent]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at released version for ${{ matrix.service }}
        env:
          VERSION_TAG: ${{ github.event.release.tag_name }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/penguintechinc/skauswatch-${SERVICE}:latest" \
            "ghcr.io/penguintechinc/skauswatch-${SERVICE}:${VERSION_TAG}"
