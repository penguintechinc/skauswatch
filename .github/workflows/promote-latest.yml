name: Promote Release to Latest

on:
  release:
    types: [released]

permissions:
  contents: read
  packages: write

jobs:
  tag-latest:
    name: Tag latest for ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [manager, pki, sshca, monitor, s3scan, scanner, webui, endpoint-agent]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at released version for ${{ matrix.service }}
        env:
          VERSION_TAG: ${{ github.event.release.tag_name }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/penguintechinc/skauswatch-${SERVICE}:latest" \
            "ghcr.io/penguintechinc/skauswatch-${SERVICE}:${VERSION_TAG}"
