name: Publish Release Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-platform:
    name: Build & Push ${{ matrix.image_name }} for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - service: manager
            image_name: manager
          - service: pki
            image_name: pki
          - service: sshca
            image_name: sshca
          - service: monitor
            image_name: monitor
          - service: s3scan
            image_name: s3scan
          - service: scanner
            image_name: scanner
          - service: worker-codescan
            image_name: worker-codescan
          - service: webui
            image_name: webui
          - service: endpoint-agent
            image_name: endpoint-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine arch suffix
        id: arch
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "suffix=${PLATFORM#linux/}" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.image_name }} for ${{ matrix.platform }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ./services/${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.arch.outputs.suffix }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ steps.arch.outputs.suffix }},mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.run_id }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/penguintechinc/skauswatch-${{ matrix.image_name }}:${{ github.ref_name }}-${{ steps.arch.outputs.suffix }}

  merge-manifests:
    name: Merge ${{ matrix.image_name }} Manifests
    runs-on: ubuntu-latest
    needs: build-platform
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: manager
            image_name: manager
          - service: pki
            image_name: pki
          - service: sshca
            image_name: sshca
          - service: monitor
            image_name: monitor
          - service: s3scan
            image_name: s3scan
          - service: scanner
            image_name: scanner
          - service: worker-codescan
            image_name: worker-codescan
          - service: webui
            image_name: webui
          - service: endpoint-agent
            image_name: endpoint-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest for ${{ matrix.image_name }}
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/penguintechinc/skauswatch-${IMAGE_NAME}:${REF_NAME} \
            --tag ghcr.io/penguintechinc/skauswatch-${IMAGE_NAME}:latest \
            ghcr.io/penguintechinc/skauswatch-${IMAGE_NAME}:${REF_NAME}-amd64 \
            ghcr.io/penguintechinc/skauswatch-${IMAGE_NAME}:${REF_NAME}-arm64
