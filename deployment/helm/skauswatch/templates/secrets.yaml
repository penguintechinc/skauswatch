{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skauswatch.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skauswatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: {{ .Values.secrets.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
  DATABASE_URL: {{ include "skauswatch.databaseUrl" . | quote }}
  
  # Redis credentials
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | quote }}
  REDIS_URL_MANAGER: {{ printf "%s/0" (include "skauswatch.redisUrl" .) | quote }}
  REDIS_URL_PKI: {{ printf "%s/1" (include "skauswatch.redisUrl" .) | quote }}
  REDIS_URL_SSH_CA: {{ printf "%s/2" (include "skauswatch.redisUrl" .) | quote }}
  REDIS_URL_AAA: {{ printf "%s/3" (include "skauswatch.redisUrl" .) | quote }}
  
  # JWT Secret Key
  JWT_SECRET_KEY: {{ .Values.secrets.jwt.secretKey | quote }}
{{- end }}