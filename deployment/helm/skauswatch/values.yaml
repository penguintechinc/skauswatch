# Default values for SkausWatch Helm Chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: "fast-ssd"
  
# Image settings
image:
  registry: skauswatch
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Environment configuration
environment: production
logLevel: INFO

# Security settings
security:
  # Pod Security Standards
  podSecurityPolicy:
    enabled: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# Manager Service Configuration
manager:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8000
    metricsPort: 9000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# PKI Server Configuration
pkiServer:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8001
    metricsPort: 9001
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    certs:
      enabled: true
      size: 2Gi
      storageClass: ""
    ca:
      enabled: true
      size: 1Gi
      storageClass: ""
    data:
      enabled: true
      size: 1Gi
      storageClass: ""
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# SSH CA Configuration
sshCa:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8002
    metricsPort: 9002
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    keys:
      enabled: true
      size: 1Gi
      storageClass: ""
    ca:
      enabled: true
      size: 1Gi
      storageClass: ""
    data:
      enabled: true
      size: 1Gi
      storageClass: ""
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# AAA Monitor Configuration
aaaMonitor:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8003
    metricsPort: 9003
    syslogPort: 514
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    audit:
      enabled: true
      size: 10Gi
      storageClass: ""
    data:
      enabled: true
      size: 2Gi
      storageClass: ""
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    nginx.ingress.kubernetes.io/rate-limit-requests-per-minute: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: skauswatch.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
          service: manager
        - path: /pki
          pathType: Prefix
          service: pki-server
        - path: /ssh-ca
          pathType: Prefix
          service: ssh-ca
        - path: /aaa
          pathType: Prefix
          service: aaa-monitor
    - host: api.skauswatch.yourdomain.com
      paths:
        - path: /v1
          pathType: Prefix
          service: manager
        - path: /pki
          pathType: Prefix
          service: pki-server
        - path: /ssh
          pathType: Prefix
          service: ssh-ca
        - path: /aaa
          pathType: Prefix
          service: aaa-monitor
  tls:
    - secretName: skauswatch-tls
      hosts:
        - skauswatch.yourdomain.com
        - api.skauswatch.yourdomain.com

# Network Policy
networkPolicy:
  enabled: true
  allowExternal: true

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Secrets configuration
secrets:
  # Database credentials
  postgres:
    user: "skauswatch"
    password: "CHANGE_ME_STRONG_POSTGRES_PASSWORD"
    database: "skauswatch"
  
  # Redis credentials
  redis:
    password: "CHANGE_ME_STRONG_REDIS_PASSWORD"
  
  # JWT secret
  jwt:
    secretKey: "CHANGE_ME_JWT_SECRET_KEY_MINIMUM_256_BITS"
  
  # External secrets (set to false to use external secret management)
  create: true

# Certificate settings
certificates:
  ca:
    validityDays: 3650
  server:
    validityDays: 365
  ssh:
    validityHours: 24
    hostValidityDays: 365

# Monitoring settings
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

# Dependencies configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "CHANGE_ME_POSTGRES_ROOT_PASSWORD"
    username: "skauswatch"
    password: "CHANGE_ME_STRONG_POSTGRES_PASSWORD"
    database: "skauswatch"
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

redis:
  enabled: true
  auth:
    enabled: true
    password: "CHANGE_ME_STRONG_REDIS_PASSWORD"
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

prometheus:
  enabled: true
  server:
    retention: 15d
    persistentVolume:
      enabled: true
      size: 10Gi
  serverFiles:
    prometheus.yml:
      scrape_configs:
        - job_name: 'skauswatch-manager'
          static_configs:
            - targets: ['manager:9000']
        - job_name: 'skauswatch-pki-server'
          static_configs:
            - targets: ['pki-server:9001']
        - job_name: 'skauswatch-ssh-ca'
          static_configs:
            - targets: ['ssh-ca:9002']
        - job_name: 'skauswatch-aaa-monitor'
          static_configs:
            - targets: ['aaa-monitor:9003']

grafana:
  enabled: true
  admin:
    password: "CHANGE_ME_STRONG_GRAFANA_PASSWORD"
  persistence:
    enabled: true
    size: 5Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server:80
          access: proxy
          isDefault: true

# Node affinity and tolerations
nodeSelector: {}
tolerations: []
affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1