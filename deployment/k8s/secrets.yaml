# SkausWatch Kubernetes Secrets Template
# IMPORTANT: This is a template file. Replace all placeholder values with actual secrets
# before applying to your Kubernetes cluster.

apiVersion: v1
kind: Secret
metadata:
  name: skauswatch-secrets
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: skauswatch
type: Opaque
stringData:
  # Database credentials
  # IMPORTANT: Change these to strong, random passwords
  POSTGRES_USER: "skauswatch"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_POSTGRES_PASSWORD"
  DATABASE_URL: "postgresql://skauswatch:REPLACE_WITH_STRONG_POSTGRES_PASSWORD@postgres:5432/skauswatch"
  
  # Redis credentials
  # IMPORTANT: Change this to a strong, random password
  REDIS_PASSWORD: "REPLACE_WITH_STRONG_REDIS_PASSWORD"
  REDIS_URL_MANAGER: "redis://:REPLACE_WITH_STRONG_REDIS_PASSWORD@redis:6379/0"
  REDIS_URL_PKI: "redis://:REPLACE_WITH_STRONG_REDIS_PASSWORD@redis:6379/1"
  REDIS_URL_SSH_CA: "redis://:REPLACE_WITH_STRONG_REDIS_PASSWORD@redis:6379/2"
  REDIS_URL_AAA: "redis://:REPLACE_WITH_STRONG_REDIS_PASSWORD@redis:6379/3"
  
  # JWT Secret Key for authentication
  # IMPORTANT: Generate a strong, random key (minimum 256 bits)
  # Example: openssl rand -base64 32
  JWT_SECRET_KEY: "REPLACE_WITH_JWT_SECRET_KEY_MINIMUM_256_BITS"
  
  # API Keys for external integrations (if needed)
  # EXTERNAL_API_KEY: "your_external_api_key_here"
  
  # TLS Certificates (if using custom certificates)
  # TLS_CERT: |
  #   -----BEGIN CERTIFICATE-----
  #   REPLACE_WITH_YOUR_TLS_CERTIFICATE
  #   -----END CERTIFICATE-----
  # TLS_KEY: |
  #   -----BEGIN PRIVATE KEY-----
  #   REPLACE_WITH_YOUR_TLS_PRIVATE_KEY
  #   -----END PRIVATE KEY-----

---
# Separate secret for Grafana admin credentials
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: grafana-secrets
    app.kubernetes.io/part-of: skauswatch
type: Opaque
stringData:
  # Grafana admin credentials
  # IMPORTANT: Change the default admin password
  GF_SECURITY_ADMIN_PASSWORD: "REPLACE_WITH_STRONG_GRAFANA_ADMIN_PASSWORD"

---
# Instructions for generating secure secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-generation-instructions
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: documentation
    app.kubernetes.io/part-of: skauswatch
data:
  README.md: |
    # SkausWatch Secrets Generation Instructions
    
    This document provides instructions for generating secure secrets for your SkausWatch deployment.
    
    ## Required Secrets
    
    ### 1. Database Passwords
    Generate strong passwords for PostgreSQL:
    ```bash
    # Generate a secure password for PostgreSQL
    openssl rand -base64 32
    ```
    
    ### 2. Redis Password
    Generate a strong password for Redis:
    ```bash
    # Generate a secure password for Redis
    openssl rand -base64 24
    ```
    
    ### 3. JWT Secret Key
    Generate a secure JWT secret key:
    ```bash
    # Generate a JWT secret key (minimum 256 bits)
    openssl rand -base64 32
    ```
    
    ### 4. Grafana Admin Password
    Generate a strong password for Grafana admin:
    ```bash
    # Generate a secure password for Grafana
    openssl rand -base64 16
    ```
    
    ## Applying Secrets
    
    1. Copy the secrets.yaml template
    2. Replace all placeholder values with the generated secrets
    3. Apply to your cluster:
       ```bash
       kubectl apply -f secrets.yaml
       ```
    
    ## Security Best Practices
    
    - Never commit actual secrets to version control
    - Use Kubernetes secret management tools like Sealed Secrets or External Secrets Operator
    - Rotate secrets regularly
    - Use RBAC to limit access to secrets
    - Monitor secret access and usage
    
    ## External Secret Management
    
    For production environments, consider using external secret management solutions:
    - HashiCorp Vault
    - AWS Secrets Manager
    - Azure Key Vault
    - Google Secret Manager
    - Kubernetes External Secrets Operator