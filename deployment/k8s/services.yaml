# SkausWatch Kubernetes Service Definitions
# These services provide network access to the SkausWatch components

---
apiVersion: v1
kind: Service
metadata:
  name: manager
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: manager
    app.kubernetes.io/part-of: skauswatch
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9000
    targetPort: 9000
    protocol: TCP
  selector:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: manager

