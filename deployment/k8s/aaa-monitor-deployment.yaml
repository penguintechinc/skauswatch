apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaa-monitor
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: aaa-monitor
    app.kubernetes.io/part-of: skauswatch
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skauswatch
      app.kubernetes.io/component: aaa-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skauswatch
        app.kubernetes.io/component: aaa-monitor
        app.kubernetes.io/part-of: skauswatch
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9003"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: skauswatch-aaa-monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: aaa-monitor
        image: skauswatch/aaa-monitor:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8003
          protocol: TCP
        - name: metrics
          containerPort: 9003
          protocol: TCP
        - name: syslog
          containerPort: 514
          protocol: UDP
        env:
        - name: SERVICE_NAME
          value: "aaa-monitor"
        - name: SERVICE_PORT
          value: "8003"
        - name: PROMETHEUS_METRICS_PORT
          value: "9003"
        - name: AUDIT_LOG_DIR
          value: "/app/audit"
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LOG_LEVEL
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DATABASE_PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_PORT
        - name: MAX_LOG_RETENTION_DAYS
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: MAX_LOG_RETENTION_DAYS
        - name: SYSLOG_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: SYSLOG_PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: REDIS_URL_AAA
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: audit
          mountPath: /app/audit
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: audit
        persistentVolumeClaim:
          claimName: aaa-audit
      - name: logs
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: aaa-data
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - aaa-monitor
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aaa-audit
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: aaa-monitor
    app.kubernetes.io/part-of: skauswatch
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aaa-data
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: aaa-monitor
    app.kubernetes.io/part-of: skauswatch
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skauswatch-aaa-monitor
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: aaa-monitor
    app.kubernetes.io/part-of: skauswatch
automountServiceAccountToken: false