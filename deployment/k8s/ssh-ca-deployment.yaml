apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-ca
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: ssh-ca
    app.kubernetes.io/part-of: skauswatch
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skauswatch
      app.kubernetes.io/component: ssh-ca
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skauswatch
        app.kubernetes.io/component: ssh-ca
        app.kubernetes.io/part-of: skauswatch
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: skauswatch-ssh-ca
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ssh-ca
        image: skauswatch/ssh-ca:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8002
          protocol: TCP
        - name: metrics
          containerPort: 9002
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "ssh-ca"
        - name: SERVICE_PORT
          value: "8002"
        - name: PROMETHEUS_METRICS_PORT
          value: "9002"
        - name: SSH_CA_DIR
          value: "/app/ssh-ca"
        - name: SSH_KEYS_DIR
          value: "/app/keys"
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LOG_LEVEL
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DATABASE_PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_PORT
        - name: SSH_CERT_VALIDITY_HOURS
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: SSH_CERT_VALIDITY_HOURS
        - name: SSH_HOST_CERT_VALIDITY_DAYS
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: SSH_HOST_CERT_VALIDITY_DAYS
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: REDIS_URL_SSH_CA
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        volumeMounts:
        - name: keys
          mountPath: /app/keys
        - name: ssh-ca
          mountPath: /app/ssh-ca
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: keys
        persistentVolumeClaim:
          claimName: ssh-keys
      - name: ssh-ca
        persistentVolumeClaim:
          claimName: ssh-ca-data
      - name: logs
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: ssh-ca-app-data
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - ssh-ca
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssh-keys
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: ssh-ca
    app.kubernetes.io/part-of: skauswatch
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssh-ca-data
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: ssh-ca
    app.kubernetes.io/part-of: skauswatch
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssh-ca-app-data
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: ssh-ca
    app.kubernetes.io/part-of: skauswatch
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skauswatch-ssh-ca
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: ssh-ca
    app.kubernetes.io/part-of: skauswatch
automountServiceAccountToken: false