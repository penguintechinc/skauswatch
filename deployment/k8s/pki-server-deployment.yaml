apiVersion: apps/v1
kind: Deployment
metadata:
  name: pki-server
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: pki-server
    app.kubernetes.io/part-of: skauswatch
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skauswatch
      app.kubernetes.io/component: pki-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skauswatch
        app.kubernetes.io/component: pki-server
        app.kubernetes.io/part-of: skauswatch
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: skauswatch-pki-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pki-server
        image: skauswatch/pki-server:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        - name: metrics
          containerPort: 9001
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "pki-server"
        - name: SERVICE_PORT
          value: "8001"
        - name: PROMETHEUS_METRICS_PORT
          value: "9001"
        - name: PKI_ROOT_DIR
          value: "/app/certs"
        - name: PKI_CA_DIR
          value: "/app/ca"
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LOG_LEVEL
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DATABASE_PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_PORT
        - name: CA_CERT_VALIDITY_DAYS
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: CA_CERT_VALIDITY_DAYS
        - name: SERVER_CERT_VALIDITY_DAYS
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: SERVER_CERT_VALIDITY_DAYS
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: REDIS_URL_PKI
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        volumeMounts:
        - name: certs
          mountPath: /app/certs
        - name: ca
          mountPath: /app/ca
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: certs
        persistentVolumeClaim:
          claimName: pki-certs
      - name: ca
        persistentVolumeClaim:
          claimName: pki-ca
      - name: logs
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: pki-data
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - pki-server
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pki-certs
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: pki-server
    app.kubernetes.io/part-of: skauswatch
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pki-ca
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: pki-server
    app.kubernetes.io/part-of: skauswatch
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pki-data
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: pki-server
    app.kubernetes.io/part-of: skauswatch
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skauswatch-pki-server
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/component: pki-server
    app.kubernetes.io/part-of: skauswatch
automountServiceAccountToken: false