# cargo-deny policy — supply-chain gates for the skauswatch workspace.
# Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Documented, reviewed exceptions — each is transitive with NO fixed release
# available; none is reachable in an exploitable way given how we use the dep.
# Re-review on every dependency bump; drop the entry the moment a fix ships.
ignore = [
    # rsa 0.9.x Marvin timing side-channel. Pulled transitively by jsonwebtoken,
    # ssh-key, and yara-x. No patched release exists (upstream-tracked). Marvin
    # targets RSA PKCS#1 v1.5 *decryption* timing; we only ever do RSA signature
    # *verification* (JWT is pinned to HS256; SSH CA signs with Ed25519), so the
    # private-key decryption oracle the attack needs is never exercised.
    "RUSTSEC-2023-0071",
    # bincode 2.0.1 flagged unmaintained. Transitive via yara-x only; used for
    # compiled-rule (de)serialization on trusted, in-process data. Not a CVE.
    "RUSTSEC-2025-0141",
    # paste 1.0.15 flagged unmaintained. Transitive via netstat2 (endpoint-agent
    # socket enumeration); compile-time macro only, no runtime surface. Not a CVE.
    "RUSTSEC-2024-0436",
    # rand 0.8.5 flagged unsound (RUSTSEC-2026-0097): the unsound path is only
    # reachable when a *custom logger* invokes rand::rng() during rand's own
    # initialization. Transitive via fred/jsonwebtoken/rsa — all pin rand 0.8
    # (no 0.8.x patch exists; rand 0.9 is a breaking bump those upstreams must
    # make, not us). We install no custom logger that touches rand, so the path
    # is never taken. Revisit when fred/jsonwebtoken move to rand 0.9.
    "RUSTSEC-2026-0097",
    # wasmtime type-confusion (RUSTSEC-2026-0222 / GHSA-hgjw-h833-99q9, published
    # 2026-07-31). Transitive via yara-x (scanner). The bug requires the *embedding
    # host* to build multiple wasmtime::Engine instances and cross-wire a Linker/
    # type from one Engine into a Store from another (CVSS AV:L/AC:H/PR:H/UI:R) —
    # it is NOT triggerable by guest input (a scanned file / a rule). yara-x uses a
    # single process-global Engine singleton (lib/src/wasm/mod.rs) and never does
    # this, so the path is unreachable in our usage. No patched yara-x exists — even
    # main HEAD pins an unpatched wasmtime; patched ranges are >=24.0.12<25,
    # >=36.0.13<37, >=46.0.2<47, >=47.0.3. Drop this + `cargo update -p wasmtime`
    # the moment yara-x bumps its wasmtime pin into a patched range.
    "RUSTSEC-2026-0222",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    # Our own workspace license (root Cargo.toml `license = "AGPL-3.0-only"`) —
    # every workspace member + internal crates/* inherit this via
    # `license.workspace = true`, so it must be explicitly allowed.
    "AGPL-3.0-only",
]
# Unpublished internal workspace/path crates (crates/*, services/*) shouldn't
# trip license checks even if one is ever missing a license field.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path/workspace deps (skauswatch-*, penguin-licensing via
# `{ workspace = true }`) carry no semver requirement by design — they're
# resolved by path within this workspace, not a registry. Without this,
# `wildcards = "deny"` flags every one of them as an unpinned dependency.
allow-wildcard-paths = true
# Forbidden: OpenSSL linkage (rustls only) — keeps runtime images slim and FIPS-path clean
deny = [
    { crate = "openssl-sys", reason = "rustls only — no OpenSSL FFI in this workspace" },
    { crate = "native-tls", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# penguin-libs git deps allowed until penguin-licensing publishes to crates.io
allow-git = ["https://github.com/penguintechinc/penguin-libs"]
