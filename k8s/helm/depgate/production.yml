# Production overrides — pinned by SHA256 digest, HA replicas + HPA.
replicaCount: 3

image:
  repository: ghcr.io/penguintechinc/skauswatch/depgate
  # Pin to the released digest before deploying — see pinning-dependency-digests skill.
  tag: "sha256:<digest>"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

# Real AWS S3 cache bucket in production — IRSA if the cluster is EKS,
# otherwise supply static credentials via secretData (aws-access-key-id/
# aws-secret-access-key) and leave s3-endpoint-url empty for AWS's default
# regional endpoint.
awsIdentity:
  mode: "irsa"
  irsa:
    roleArn: "arn:aws:iam::<account-id>:role/skauswatch-depgate"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

configMapData:
  log-level: "warn"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "20"
  s3-endpoint-url: ""
  s3-region: "us-east-1"
  s3-force-path-style: "false"
  cache-bucket: "depgate-cache"
  cache-prefix: "sha256/"
  quarantine-prefix: "quarantine/"
  max-artifact-bytes: "536870912"
  upstream-base-url: "https://registry-1.docker.io"
  upstream-auth-url: "https://auth.docker.io/token"
  upstream-service: "registry.docker.io"
  license-server-url: "https://license.penguintech.io"
  release-mode: "true"

# MUST be enabled: depgate hard-requires a live SVID whenever RELEASE_MODE
# is "true" — without this mount, depgate crash-loops in production. See
# k8s/helm/spire/README.md "Service-pod SVID pattern".
spire:
  enabled: true
