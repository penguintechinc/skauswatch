# PrometheusRule -- release-audit finding (gh-150, 0 PrometheusRule objects
# existed). services/depgate/src's only custom counter is
# depgate_cache_lookups_total{result} (state.rs), a cache-effectiveness
# metric, not a failure signal -- see values.yaml's prometheusRule.*
# comment. No error/failure counter exists as of this pass, so the
# baseline here is target-down only rather than a fabricated error-rate
# alert.
#
# `job` is assumed to equal the underlying Service's name (Prometheus
# Operator's default ServiceMonitor behavior when `jobLabel` isn't set) --
# see templates/servicemonitor.yaml, whose target Service is this chart's
# fullname.
#
# NOTE on the backtick-wrapped double-brace sequences below: Prometheus's
# own alert annotation templating uses the same double-brace delimiter as
# Helm/Go templates. Wrapping each one in a raw Go-template string (single
# backticks) is the standard Helm escape so `$labels` survives `helm
# template` untouched and is evaluated by Prometheus at alert-fire time.
#
# Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1)
# installed in-cluster -- disable prometheusRule.enabled if not.
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "skauswatch-depgate.fullname" . }}
  labels:
    {{- include "skauswatch-depgate.labels" . | nindent 4 }}
    {{- if .Values.monitoring.releaseLabel }}
    release: {{ .Values.monitoring.releaseLabel | quote }}
    {{- end }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: skauswatch-depgate.rules
      rules:
        - alert: DepgateTargetDown
          expr: absent(up{job="{{ include "skauswatch-depgate.fullname" . }}"}) or up{job="{{ include "skauswatch-depgate.fullname" . }}"} == 0
          for: {{ .Values.prometheusRule.targetDownFor | quote }}
          labels:
            severity: critical
          annotations:
            summary: "depgate is not being scraped by Prometheus"
            description: >-
              No successful scrape of depgate's :9090 metrics endpoint on
              pod {{`{{ $labels.pod }}`}} (namespace
              {{`{{ $labels.namespace }}`}}) for at least
              {{ .Values.prometheusRule.targetDownFor }} -- the pod is down,
              crash-looping, or the ServiceMonitor/Service selector no
              longer matches.
{{- end }}
