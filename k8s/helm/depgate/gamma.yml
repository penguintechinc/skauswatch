# Gamma overrides — dal2-gamma cluster, namespace: skauswatch.
replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/skauswatch/depgate
  tag: "gamma-0000000000"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

awsIdentity:
  mode: "static"

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

configMapData:
  log-level: "info"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "5"
  s3-endpoint-url: "http://minio:9000"
  s3-region: "us-east-1"
  s3-force-path-style: "true"
  cache-bucket: "depgate-cache"
  cache-prefix: "sha256/"
  quarantine-prefix: "quarantine/"
  max-artifact-bytes: "536870912"
  upstream-base-url: "https://registry-1.docker.io"
  upstream-auth-url: "https://auth.docker.io/token"
  upstream-service: "registry.docker.io"
  license-server-url: "https://license.penguintech.io"
  release-mode: "false"

# depgate hard-requires a live SPIFFE Workload API socket in release mode —
# enabled here even though release-mode is currently "false" so gamma stays
# SPIRE-parity with production ahead of any release-mode flip.
spire:
  enabled: true
