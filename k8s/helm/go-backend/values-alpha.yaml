# Alpha environment overrides (local MicroK8s)
replicaCount: 1

image:
  pullPolicy: Never
  tag: latest

namespace: skauswatch-alpha

env:
  - name: LOG_LEVEL
    value: "DEBUG"
  - name: GO_ENV
    value: "development"
  - name: RELEASE_MODE
    value: "false"

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
