# Beta environment overrides (dal2 cluster)
replicaCount: 2

image:
  registry: registry-dal2.penguintech.io
  pullPolicy: Always
  tag: latest

namespace: skauswatch-beta

env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: GO_ENV
    value: "production"
  - name: RELEASE_MODE
    value: "false"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: go-api.penguintech.cloud
      paths:
        - path: /api/v1
          pathType: Prefix
  tls:
    - secretName: penguintech-wildcard-tls
      hosts:
        - go-api.penguintech.cloud
