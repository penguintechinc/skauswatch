# Multi-port ClusterIP Service for the receiver Deployment only. Per the
# Spec's own port/Service table (Task 2.4 brief), the writer Deployment
# has NO Service at all -- "None (internal, reads JetStream only)" -- so
# there is deliberately no templates/service-writer.yaml in this chart.
# Prometheus still reaches the writer's :9090 metrics port directly by pod
# IP (CiliumNetworkPolicy ingress rule in ciliumnetworkpolicy-writer.yaml)
# without needing a stable Service VIP/DNS name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skauswatch-svc-ingest.receiver.fullname" . }}
  labels:
    {{- include "skauswatch-svc-ingest.receiver.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: syslog-udp
      port: {{ .Values.ports.syslogPort }}
      targetPort: syslog-udp
      protocol: UDP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.syslogUdp }}
      nodePort: {{ .Values.service.nodePorts.syslogUdp }}
      {{- end }}
    - name: syslog-tcp
      port: {{ .Values.ports.syslogPort }}
      targetPort: syslog-tcp
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.syslogTcp }}
      nodePort: {{ .Values.service.nodePorts.syslogTcp }}
      {{- end }}
    - name: syslog-tls
      port: {{ .Values.ports.syslogTlsPort }}
      targetPort: syslog-tls
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.syslogTls }}
      nodePort: {{ .Values.service.nodePorts.syslogTls }}
      {{- end }}
    - name: otlp-grpc
      port: {{ .Values.ports.otlpGrpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.otlpGrpc }}
      nodePort: {{ .Values.service.nodePorts.otlpGrpc }}
      {{- end }}
    - name: otlp-http
      port: {{ .Values.ports.otlpHttpPort }}
      targetPort: otlp-http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.otlpHttp }}
      nodePort: {{ .Values.service.nodePorts.otlpHttp }}
      {{- end }}
    - name: http
      port: {{ .Values.ports.httpPort }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.http }}
      nodePort: {{ .Values.service.nodePorts.http }}
      {{- end }}
    - name: metrics
      port: {{ .Values.ports.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "skauswatch-svc-ingest.receiver.selectorLabels" . | nindent 4 }}
