# Production overrides — pinned by SHA256 digest, HA replicas + HPA.
image:
  repository: ghcr.io/penguintechinc/skauswatch/svc-ingest
  # Pin to the released digest before deploying — see pinning-dependency-digests skill.
  tag: "sha256:<digest>"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP

receiver:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

writer:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

configMapData:
  opensearch-url: "http://opensearch:9200"
  nats-url: "nats://nats-jetstream:4222"
  nats-jetstream-subject-prefix: "svc-ingest.logs"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "20"
  license-server-url: "https://license.penguintech.io"
  release-mode: "true"
  syslog-udp-tenant-id: ""

# MUST be enabled: identity-consuming services hard-require a live SVID
# whenever RELEASE_MODE is "true". See k8s/helm/spire/README.md
# "Service-pod SVID pattern".
spire:
  enabled: true
