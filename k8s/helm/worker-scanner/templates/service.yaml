{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skauswatch-worker-scanner.fullname" . }}
  labels:
    {{- include "skauswatch-worker-scanner.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "skauswatch-worker-scanner.selectorLabels" . | nindent 4 }}
{{- end }}
