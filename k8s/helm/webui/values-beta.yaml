# Beta environment overrides (dal2 cluster)
replicaCount: 2

image:
  registry: registry-dal2.penguintech.io
  pullPolicy: Always
  tag: latest

namespace: skauswatch-beta

env:
  - name: NODE_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "INFO"
  - name: RELEASE_MODE
    value: "false"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 75m
    memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: skauswatch.penguintech.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: penguintech-wildcard-tls
      hosts:
        - skauswatch.penguintech.io
