# Beta environment overrides (dal2 cluster)
replicaCount: 1

image:
  registry: ghcr.io/penguintechinc/skauswatch
  pullPolicy: Always
  tag: latest

imagePullSecrets:
  - name: ghcr-pull-secret

namespace: skauswatch

env:
  - name: NODE_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "INFO"

ingress:
  enabled: false

httproute:
  enabled: true
  gatewayName: shared
  gatewayNamespace: gateway
  host: skauswatch.penguintech.cloud
  rules:
    - path: /
      service: skauswatch-webui
      port: 3000

autoscaling:
  enabled: false

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
