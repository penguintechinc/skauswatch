# Default (prod-safe baseline) values for skauswatch-webui.
# Per-environment overrides live in alpha.yml / beta.yml / gamma.yml / production.yml.
replicaCount: 3

image:
  repository: ghcr.io/penguintechinc/skauswatch/webui
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  # Required for Pod Security Admission "restricted" compliance (and
  # good practice under "baseline") -- see k8s/helm/README.md "Cluster
  # security baseline".
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Tetragon exec-allowlist enforcement (templates/tracingpolicy.yaml).
# Requires the Tetragon agent DaemonSet in-cluster -- set false to render
# without it (e.g. a cluster that hasn't rolled Tetragon out yet).
tetragon:
  enabled: true

service:
  enabled: true
  type: ClusterIP
  port: 3000
  targetPort: 3000

# The public entrypoint — served via HTTPRoute (Gateway API) in
# beta/gamma/prod, NodePort in alpha (see devops-kubernetes.md Alpha
# NodePort Exposure).
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: skauswatch.app
      paths:
        - path: /
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  host: skauswatch.app
  rules:
    - path: /
      service: skauswatch-webui
      port: 3000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# services/webui/src/server/index.ts: Express BFF — PORT, NODE_ENV, plus
# backend service URLs it proxies to (manager, vault, codescan-backend,
# monitor). Hostnames use the skauswatch-<service> Service names created by
# each chart (same skauswatch namespace).
env:
  - name: PORT
    value: "3000"
  - name: NODE_ENV
    valueFrom:
      configMapKeyRef:
        name: skauswatch-webui-config
        key: node-env
  - name: MANAGER_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-webui-config
        key: manager-url
  - name: VAULT_BACKEND_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-webui-config
        key: vault-backend-url
  - name: CODESCAN_BACKEND_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-webui-config
        key: codescan-backend-url
  - name: MONITOR_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-webui-config
        key: monitor-url

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

volumeMounts: []

volumes: []

configMapData:
  node-env: "production"
  manager-url: "http://skauswatch-manager:5000"
  vault-backend-url: "http://skauswatch-vault:8080"
  codescan-backend-url: "http://skauswatch-codescan-backend:5005"
  monitor-url: "http://skauswatch-monitor:8003"

# --- Ops observability (PodDisruptionBudget) ------------------------------
# Release-audit finding (gh-148, 0 PodDisruptionBudgets existed). Assumes
# policy/v1 (core API, always available) -- no CRD dependency, unlike the
# PrometheusRule/ServiceMonitor note below.

# maxUnavailable (not minAvailable) deliberately -- at replicaCount: 1
# (alpha/beta/gamma), minAvailable: 1 would block ALL voluntary
# disruptions (including node drains) since 0 replicas could ever remain
# healthy; maxUnavailable: 1 computes desiredHealthy = replicas - 1, which
# is 0 at replicas: 1, so it always permits eviction of the sole pod while
# still capping disruption to 1 pod at a time once replicaCount scales up
# (prod: 3, see replicaCount above).
pdb:
  enabled: true
  maxUnavailable: 1

# NO PrometheusRule / ServiceMonitor for this chart (release-audit gh-150
# scope) -- services/webui/src is a plain Express BFF (server/index.ts)
# with no prom-client dependency, no /metrics route, and no metrics
# containerPort in templates/deployment.yaml (grep-verified: only "http").
# A ServiceMonitor needs a named metrics port on the Service to scrape, and
# a target-down PrometheusRule needs a ServiceMonitor/PodMonitor producing
# an `up{job=...}` series in the first place -- neither precondition holds
# here, so adding either would either fail to render anything meaningful or
# alert permanently on a target that was never scraped. Revisit if webui
# ever gains a metrics endpoint (e.g. via prom-client + a /metrics route).
