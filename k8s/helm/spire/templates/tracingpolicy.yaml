# Tetragon exec-allowlist for the spire chart's workloads. ENFORCE: any
# sys_execve NOT matching one of the listed binaries is SIGKILLed. Requires
# the Tetragon agent DaemonSet running in the cluster (cluster add-on, not
# part of this chart -- see k8s/helm/README.md "Tetragon prerequisite").
{{- if and .Values.spire.enabled (.Values.spire.tetragon.enabled | default true) }}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: {{ include "skauswatch-spire.fullname" . }}-server-exec-allowlist
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "skauswatch-spire.selectorLabels" . | nindent 6 }}
      component: server
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
        - index: 1
          type: "string_arr"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEqual"
              values:
                # Official ghcr.io/spiffe/spire-server image ENTRYPOINT.
                - "/opt/spire/bin/spire-server"
          matchActions:
            - action: Sigkill
---
# spire-agent's pod also runs a busybox init container (wait-for-server)
# and, only in nested-child topology, a busybox downstream-agent sidecar
# ("/bin/sh -c ..."). Tetragon's podSelector applies to every container in
# the matched pod, so busybox's shell/wget are allowlisted alongside the
# agent binary itself -- narrower than a blanket shell allow (limited to
# this specific pod, not every skauswatch pod), but broader than the other
# services' single-binary allowlists because of these two legitimate
# supporting containers.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: {{ include "skauswatch-spire.fullname" . }}-agent-exec-allowlist
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "skauswatch-spire.selectorLabels" . | nindent 6 }}
      component: agent
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
        - index: 1
          type: "string_arr"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEqual"
              values:
                # Official ghcr.io/spiffe/spire-agent image ENTRYPOINT.
                - "/opt/spire/bin/spire-agent"
                # busybox:1.36 init container (init-server-bundle) + the
                # conditional nested-topology downstream-agent sidecar.
                - "/bin/sh"
                - "/bin/busybox"
                - "/bin/wget"
          matchActions:
            - action: Sigkill
{{- if .Values.spire.oidcProvider.enabled }}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: {{ include "skauswatch-spire.fullname" . }}-oidc-provider-exec-allowlist
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "skauswatch-spire.selectorLabels" . | nindent 6 }}
      component: oidc-provider
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
        - index: 1
          type: "string_arr"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEqual"
              values:
                # Official ghcr.io/spiffe/oidc-discovery-provider image
                # ENTRYPOINT.
                - "/opt/spire/bin/oidc-discovery-provider"
          matchActions:
            - action: Sigkill
{{- end }}
{{- end }}
