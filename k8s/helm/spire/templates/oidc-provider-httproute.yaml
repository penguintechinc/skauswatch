{{- if and .Values.spire.enabled .Values.spire.oidcProvider.enabled .Values.spire.oidcProvider.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "skauswatch-spire.fullname" . }}-oidc-provider
  labels:
    {{- include "skauswatch-spire.labels" . | nindent 4 }}
    component: oidc-provider
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.spire.oidcProvider.httproute.gatewayName }}
      namespace: {{ .Values.spire.oidcProvider.httproute.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ required "spire.oidcProvider.issuerHost is required when oidcProvider.httproute.enabled" .Values.spire.oidcProvider.issuerHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "skauswatch-spire.fullname" . }}-oidc-provider
          port: {{ .Values.spire.oidcProvider.port }}
{{- end }}
