{{- if and .Values.spire.enabled .Values.spire.autoEnroll.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "skauswatch-spire.fullname" . }}-auto-enroll
  labels:
    {{- include "skauswatch-spire.labels" . | nindent 4 }}
    component: auto-enroll
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "skauswatch-spire.fullname" . }}-auto-enroll
subjects:
- kind: ServiceAccount
  name: {{ include "skauswatch-spire.fullname" . }}-auto-enroll
  namespace: {{ .Release.Namespace }}
{{- end }}
