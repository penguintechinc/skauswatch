{{- /*
Bootstrap "downstream agent" — a normal spire-agent process that attests
to the trust domain ROOT (not this cluster's own agent fleet) purely so
this child spire-server can obtain a Workload API SVID to hand to its own
UpstreamAuthority "spire" plugin. This is the credential-supply mechanism
for nested SPIRE (child requests intermediate CA from root) — see chart
README "Nested topology".
*/}}
{{- if and .Values.spire.enabled (eq .Values.spire.topology.role "child") .Values.spire.topology.upstreamRoot.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skauswatch-spire.fullname" . }}-downstream-agent-config
  labels:
    {{- include "skauswatch-spire.labels" . | nindent 4 }}
    component: downstream-agent
  namespace: {{ .Release.Namespace }}
data:
  downstream-agent.hcl: |
    agent {
      data_dir = "/run/spire/downstream-agent"
      log_level = "INFO"
      server_address = "{{ .Values.spire.topology.upstreamRoot.serverAddress }}"
      server_port = "{{ .Values.spire.topology.upstreamRoot.serverPort }}"
      socket_path = "/tmp/spire-downstream-agent/public/api.sock"
      trust_domain = "{{ .Values.spire.trustDomain }}"
      trust_bundle_path = "/run/spire/upstream-bundle/{{ .Values.spire.topology.upstreamRoot.trustBundleConfigMap.key }}"
      insecure_bootstrap = false
    }

    plugins {
      NodeAttestor "{{ .Values.spire.topology.upstreamRoot.nodeAttestor }}" {
        plugin_data {}
      }

      KeyManager "memory" {
        plugin_data {}
      }

      WorkloadAttestor "unix" {
        plugin_data {}
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8082"
      live_path = "/live"
      ready_path = "/ready"
    }
{{- end }}
