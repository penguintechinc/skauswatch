{{- if .Values.spire.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skauswatch-spire.fullname" . }}-server
  labels:
    {{- include "skauswatch-spire.labels" . | nindent 4 }}
    component: server
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: grpc
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: health
    {{- if .Values.spire.federation.enabled }}
    - port: {{ .Values.spire.federation.bundleEndpoint.port }}
      targetPort: {{ .Values.spire.federation.bundleEndpoint.port }}
      protocol: TCP
      name: federation
    {{- end }}
  selector:
    {{- include "skauswatch-spire.selectorLabels" . | nindent 4 }}
    component: server
{{- end }}
