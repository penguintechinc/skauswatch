{{- if .Values.spire.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "skauswatch-spire.fullname" . }}-agent
  labels:
    {{- include "skauswatch-spire.labels" . | nindent 4 }}
    component: agent
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "skauswatch-spire.selectorLabels" . | nindent 6 }}
      component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "skauswatch-spire.selectorLabels" . | nindent 8 }}
        component: agent
    spec:
      {{- with .Values.spire.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "skauswatch-spire.agentServiceAccountName" . }}
      hostPID: false
      securityContext:
        {{- toYaml .Values.spire.agent.podSecurityContext | nindent 8 }}
      initContainers:
      - name: init-server-bundle
        image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - |
            until wget -qO- http://{{ include "skauswatch-spire.fullname" . }}-server:8080/ready 2>/dev/null; do
              echo "waiting for spire-server..."
              sleep 2
            done
      containers:
      - name: spire-agent
        image: "{{ .Values.spire.agent.image.repository }}:{{ .Values.spire.agent.image.tag }}"
        imagePullPolicy: {{ .Values.spire.agent.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.spire.agent.securityContext | nindent 12 }}
        args:
          - -config
          - /run/spire/config/agent.hcl
        {{- with .Values.spire.agent.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: spire-config
          mountPath: /run/spire/config
          readOnly: true
        - name: spire-agent-socket
          mountPath: {{ .Values.spire.agent.socketDir }}
        - name: spire-data
          mountPath: /run/spire/agent
        - name: spire-bundle
          mountPath: /run/spire/bundle
        {{- if .Values.spire.server.nodeAttestation.k8sPsat.enabled }}
        - name: spire-token
          mountPath: {{ dir .Values.spire.agent.serviceAccountTokenPath }}
          readOnly: true
        {{- end }}
      volumes:
      - name: spire-config
        configMap:
          name: {{ include "skauswatch-spire.fullname" . }}-agent
      - name: spire-agent-socket
        hostPath:
          path: {{ .Values.spire.agent.socketDir }}
          type: DirectoryOrCreate
      - name: spire-data
        emptyDir: {}
      - name: spire-bundle
        emptyDir: {}
      {{- if .Values.spire.server.nodeAttestation.k8sPsat.enabled }}
      - name: spire-token
        projected:
          sources:
          - serviceAccountToken:
              path: {{ base .Values.spire.agent.serviceAccountTokenPath }}
              audience: {{ .Values.spire.agent.serviceAccountTokenAudience | quote }}
              expirationSeconds: {{ .Values.spire.agent.serviceAccountTokenExpirationSeconds }}
      {{- end }}
      {{- with .Values.spire.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spire.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
