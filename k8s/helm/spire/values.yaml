spire:
  enabled: false

  trustDomain: "penguintech.io"
  environment: "alpha"

  server:
    replicaCount: 1
    image:
      # External image pinned to SHA256 digest.
      repository: ghcr.io/spiffe/spire-server@sha256:6936324dacd7dcd800dec0641db8f0e48c75204b2dfbb21201b111ef2e2490a8
      tag: "1.9.4"  # Reference only; digest in repository takes precedence
      pullPolicy: IfNotPresent

    ports:
      grpc: 8081
      federation: 8443
      healthCheck: 8080

    dataStore:
      # sqlite: zero-dependency bootstrap; switch to postgresql once NEST/PG is available.
      # postgresql: preferred for production; works with NEST (marchproxy) or any PG host.
      type: sqlite
      sqlite:
        path: "/run/spire/data/datastore.sqlite"
      postgresql:
        host: "marchproxy.nest.svc"
        port: 5432
        dbName: spire
        # TLS to the database with server-certificate verification.
        # verify-full requires the server cert to chain to a trusted CA and
        # match the host. For a private CA, set sslRootCert to a CA bundle
        # path mounted into the server pod. Downgrade (require/prefer) only
        # for TLS-terminating in-cluster proxies — never in production.
        sslMode: "verify-full"
        # Optional path to a CA bundle inside the pod (e.g. /run/spire/tls/ca.crt)
        sslRootCert: ""
        secretName: spire-db-credentials
        userKey: username
        passwordKey: password

    nodeAttestation:
      k8sSat:
        enabled: true
        cluster: "skauswatch"
        serviceAccountAllowList:
          - "skauswatch:spire-agent"
      joinToken:
        enabled: true

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

    serviceAccount:
      create: true
      name: ""
      annotations: {}

    nodeSelector: {}
    tolerations: []
    affinity: {}

  agent:
    image:
      repository: ghcr.io/spiffe/spire-agent@sha256:66d73a745b3875f7e68f0dd48de9924231aab9a79a632f98f5c9479f95688110
      tag: "1.9.4"  # Reference only; digest in repository takes precedence
      pullPolicy: IfNotPresent

    socketPath: /run/spire/sockets/agent.sock
    socketDir: /run/spire/sockets

    workloadAttestors:
      k8s:
        enabled: true
        skipKubeletVerification: true
      unix:
        enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0

    securityContext:
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

    serviceAccount:
      create: true
      name: ""
      annotations: {}

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

    nodeSelector: {}

  federation:
    enabled: false
    bundleEndpoint:
      port: 8443
    peers: []
    # peers:
    #   - trustDomain: "other.penguintech.io"
    #     bundleEndpointURL: "https://spire-server.other-cluster:8443"
    #     bundleEndpointProfile: "https_spiffe"
    #     endpointSPIFFEID: "spiffe://other.penguintech.io/prod/spire-server"

  oidcProvider:
    enabled: false
    image:
      repository: ghcr.io/spiffe/oidc-discovery-provider@sha256:1da5c3f80c6772d731a00fe33035baa77ce515991d28e23576f4f86d8d8a4759
      tag: "1.9.4"  # Reference only; digest in repository takes precedence
      pullPolicy: IfNotPresent
    port: 8008
    domains: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  autoEnroll:
    enabled: true
    # Known SkausWatch + PenguinCloud services registered on post-install.
    # Best-effort — entries skipped silently if namespace/SA absent.
    services:
      - name: monitor
        namespace: skauswatch
        serviceAccount: monitor
      - name: endpoint-agent
        namespace: skauswatch
        serviceAccount: endpoint-agent
      - name: manager
        namespace: skauswatch
        serviceAccount: manager
      - name: pki
        namespace: skauswatch
        serviceAccount: pki
      - name: sshca
        namespace: skauswatch
        serviceAccount: sshca
      - name: webui
        namespace: skauswatch
        serviceAccount: webui
      - name: worker-codescan
        namespace: skauswatch
        serviceAccount: worker-codescan
      - name: s3scan
        namespace: skauswatch
        serviceAccount: s3scan
      - name: scanner
        namespace: skauswatch
        serviceAccount: scanner
      - name: flask-backend
        namespace: skauswatch
        serviceAccount: flask-backend
      - name: logs
        namespace: skauswatch
        serviceAccount: logs
    # Cross-suite PenguinCloud services — enrolled only if namespace exists
    suiteServices:
      - name: nest-api
        namespace: nest
        serviceAccount: nest-api
      - name: nest-gateway
        namespace: nest
        serviceAccount: nest-gateway
      - name: marchproxy
        namespace: nest
        serviceAccount: marchproxy

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
