spire:
  enabled: true
  environment: "gamma"

  topology:
    role: child
    upstreamRoot:
      # Live-ops flips this to true once root is live and a join token
      # has been minted for dal2-gamma (see chart README "Live-Ops").
      # Until then this server runs self-signed, same as standalone.
      enabled: false
      serverAddress: ""
      serverPort: 8081
      downstreamSpiffeID: "spiffe://penguintech.io/spire/server/dal2-gamma"
      nodeAttestor: join_token

  server:
    replicaCount: 1
    image:
      repository: ghcr.io/spiffe/spire-server@sha256:6936324dacd7dcd800dec0641db8f0e48c75204b2dfbb21201b111ef2e2490a8
      tag: "1.9.4"  # Reference only
      pullPolicy: Always
    dataStore:
      type: sqlite
    nodeAttestation:
      k8sPsat:
        enabled: true
        cluster: "dal2-gamma"
        serviceAccountAllowList:
          - "skauswatch:spire-agent"

  agent:
    image:
      repository: ghcr.io/spiffe/spire-agent@sha256:66d73a745b3875f7e68f0dd48de9924231aab9a79a632f98f5c9479f95688110
      tag: "1.9.4"  # Reference only
      pullPolicy: Always

  imagePullSecrets:
    - name: ghcr-pull-secret

  federation:
    enabled: true
    peers: []

  # OIDC discovery runs on ROOT only in a nested topology — see
  # root.example.yml. Do not enable here.
  oidcProvider:
    enabled: false

  csiDriver:
    enabled: false

  autoEnroll:
    enabled: true
