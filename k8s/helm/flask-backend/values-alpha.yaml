# Alpha environment overrides (local MicroK8s)
replicaCount: 1

image:
  pullPolicy: Never
  tag: latest

namespace: skauswatch-alpha

env:
  - name: LOG_LEVEL
    value: "DEBUG"
  - name: FLASK_ENV
    value: "development"
  - name: RELEASE_MODE
    value: "false"

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: flask-api.localhost.local
      paths:
        - path: /api/v1
          pathType: Prefix
  tls:
    - secretName: localhost-tls
      hosts:
        - flask-api.localhost.local
