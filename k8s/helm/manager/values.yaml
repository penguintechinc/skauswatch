# Default (prod-safe baseline) values for skauswatch-manager.
# Per-environment overrides live in alpha.yml / beta.yml / gamma.yml / production.yml.
replicaCount: 3

image:
  repository: ghcr.io/penguintechinc/skauswatch/manager
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Name of a pre-provisioned Secret (or ExternalSecret target) to use
# instead of the chart-managed one below. When set, templates/secret.yaml
# is not rendered and Deployment/DaemonSet env vars read from this Secret.
existingSecret: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# AWS identity mechanism backing services/manager's aws-sdk-s3 credential
# chain (state.rs). Neither mode uses static AWS keys — see
# docs/v2-port/aws-identity-runbook.md.
#   - "spire" (default): SPIRE-issued JWT-SVID federated into AWS via OIDC
#     (sts:AssumeRoleWithWebIdentity) — renders no ServiceAccount
#     annotation. Requires SPIFFE_ENDPOINT_SOCKET wired into this pod,
#     which is a separate, not-yet-done pass
#     (k8s/helm/spire/README.md "deliberately deferred" #5). Matches
#     skauswatch's on-prem dal2 clusters (alpha/beta/gamma).
#   - "irsa": EKS Pod Identity / IRSA — annotates the ServiceAccount with
#     eks.amazonaws.com/role-arn; the aws-sdk default credential provider
#     chain picks it up automatically, no code change needed. Set
#     awsIdentity.irsa.roleArn and override awsIdentity.mode: "irsa" in
#     the target environment's values file only if that environment's
#     cluster is EKS.
#   - "static": legacy S3-compatible-only path — no AWS role assumption.
awsIdentity:
  mode: "spire"
  irsa:
    roleArn: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001  # FIRST-RUN FIX (k8s-ops): matches Dockerfile useradd --uid 10001 "appuser"; was 1000 (mismatch broke pki's ssh-keygen subprocess: "No user exists for uid 1000")
  fsGroup: 10001
  # Required for Pod Security Admission "restricted" compliance (and
  # good practice under "baseline") -- see k8s/helm/README.md "Cluster
  # security baseline".
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Tetragon exec-allowlist enforcement (templates/tracingpolicy.yaml).
# Requires the Tetragon agent DaemonSet in-cluster -- set false to render
# without it (e.g. a cluster that hasn't rolled Tetragon out yet).
tetragon:
  enabled: true

# REST (API_PORT), gRPC control plane (GRPC_PORT), Prometheus metrics.
httpPort: 5000
grpcPort: 50051
metricsPort: 9090

service:
  type: ClusterIP
  port: 5000
  grpcPort: 50051
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: skauswatch.app
      paths:
        - path: /api
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  host: skauswatch.app
  rules:
    - path: /api
      service: skauswatch-manager
      port: 5000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: API_PORT
    value: "5000"
  - name: GRPC_PORT
    value: "50051"
  - name: GRPC_ENABLED
    value: "true"
  - name: RUST_LOG
    valueFrom:
      configMapKeyRef:
        name: skauswatch-manager-config
        key: log-level
  - name: DB_TYPE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-manager-config
        key: db-type
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: skauswatch-manager-config
        key: db-host
  - name: DB_PORT
    valueFrom:
      configMapKeyRef:
        name: skauswatch-manager-config
        key: db-port
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: skauswatch-manager-config
        key: db-name
  - name: DB_POOL_SIZE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-manager-config
        key: db-pool-size
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-manager.secretName" . }}'
        key: db-user
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-manager.secretName" . }}'
        key: db-pass
  # ES256 asymmetric keypair -- manager is the sole issuer of skauswatch
  # access tokens, so it is the only chart that wires jwt-signing-key
  # (private). Every other JWT-verifying service (monitor, vault, pki,
  # sshca, logs, codescan-backend, depgate) only wires jwt-verify-key.
  - name: JWT_SIGNING_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-manager.secretName" . }}'
        key: jwt-signing-key
  - name: JWT_VERIFY_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-manager.secretName" . }}'
        key: jwt-verify-key
  # FIRST-RUN FIX (k8s-ops, local alpha bring-up): services/manager/src/state.rs
  # requires VAULT_MEK* for envelope encryption (S3 bucket credential storage,
  # crates/skauswatch-vault/src/crypto.rs) and hard-fails startup without it
  # (confirmed: manager crashed with "envelope encryption init failed:
  # VAULT_MEK_V1 (or VAULT_MEK) environment variable not set"). This chart
  # never wired VAULT_MEK — mirrors k8s/helm/vault/values.yaml's pattern.
  # NOT committed; flagged to the user for a real chart fix.
  - name: VAULT_MEK_CURRENT_VERSION
    value: "1"
  - name: VAULT_MEK_V1
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-manager.secretName" . }}'
        key: vault-mek-v1
  - name: LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-manager.secretName" . }}'
        key: license-key
  - name: LICENSE_SERVER_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-manager-config
        key: license-server-url
  - name: RELEASE_MODE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-manager-config
        key: release-mode

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

volumeMounts: []

volumes: []

# --- SPIFFE Workload API socket (SPIRE) --------------------------------
# Wires SPIFFE_ENDPOINT_SOCKET + the agent Workload API socket into this
# pod so skauswatch-identity::IdentityProvider can fetch an SVID at
# runtime (see k8s/helm/spire/README.md "Service-pod SVID pattern").
# NECESSARY BUT NOT SUFFICIENT: the socket is only populated once a
# spire-agent DaemonSet is actually running on the node — enabling this
# toggle without a live agent still leaves the mount empty/absent (agent
# rollout is cutover ops, not this chart). MUST be enabled wherever
# RELEASE_MODE=true: identity-consuming services hard-fail without a live
# SVID in release mode — beta/gamma/production all set spire.enabled:
# true; alpha stays off (no release-mode, no SPIRE agent in local
# MicroK8s by default).
spire:
  enabled: false
  socketDir: /run/spire/sockets
  # CSI driver variant — DISABLED BY DEFAULT, matches k8s/helm/spire's own
  # csiDriver.enabled default. The SPIFFE CSI Driver DaemonSet runs
  # privileged: true (ROOT EXCEPTION per devops-containers.md) — do not
  # set true in any env file without explicit user approval first.
  csiDriver:
    enabled: false

configMapData:
  log-level: "info"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "20"
  license-server-url: "https://license.penguintech.io"
  release-mode: "true"

# MUST be set via --set/values or existingSecret; services fail closed
# on a blank/known-default secret (never ship a real credential here).
#
# jwt-signing-key/jwt-verify-key: ES256 (EC P-256) asymmetric keypair.
# Generate with:
#   openssl ecparam -genkey -name prime256v1 -noout | \
#     openssl pkcs8 -topk8 -nocrypt -out jwt-signing-key.pem
#   openssl ec -in jwt-signing-key.pem -pubout -out jwt-verify-key.pem
secretData:
  db-user: ""
  db-pass: ""
  license-key: "PENG-XXXX-XXXX-XXXX-XXXX-ABCD"
  # PEM EC P-256 private key (PKCS#8) -- manager only, the sole JWT issuer.
  jwt-signing-key: ""
  # PEM EC P-256 public key (SPKI) -- manager also verifies its own tokens.
  jwt-verify-key: ""
  # FIRST-RUN FIX (k8s-ops): see VAULT_MEK_V1 env comment above. 32-byte
  # key, base64-encoded (`openssl rand -base64 32`). MUST match vault's/
  # worker-vault-sync's vault-mek-v1 if manager and vault ever share
  # envelope-encrypted data; today they are independent (manager encrypts
  # its own S3 bucket creds separately from vault's secret store).
  vault-mek-v1: ""
