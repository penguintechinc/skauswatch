# Alpha overrides — local MicroK8s (local-alpha context), namespace: skauswatch.
replicaCount: 1

image:
  repository: localhost:32000/skauswatch/manager
  tag: "alpha-latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Manager REST API is a public surface (endpoint-agent + direct API callers) —
# expose via fixed NodePort in alpha instead of Ingress/HTTPRoute.
service:
  type: NodePort
  nodePort: 30081

ingress:
  enabled: false

httproute:
  enabled: false

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

configMapData:
  log-level: "debug"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "2"
  license-server-url: "https://license.penguintech.io"
  release-mode: "false"
