# Beta overrides — dal2-beta cluster, namespace: skauswatch.
replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/skauswatch/manager
  tag: "beta-0000000000"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP

ingress:
  enabled: false

httproute:
  enabled: true
  gatewayName: shared
  gatewayNamespace: gateway
  host: skauswatch.penguintech.cloud
  rules:
    - path: /api
      service: skauswatch-manager
      port: 5000

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

configMapData:
  log-level: "info"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "5"
  license-server-url: "https://license.penguintech.io"
  release-mode: "false"

# Enabled here even though release-mode is currently "false" so beta
# stays SPIRE-parity with production ahead of any release-mode flip.
spire:
  enabled: true
