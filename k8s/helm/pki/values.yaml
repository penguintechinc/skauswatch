# Default (prod-safe baseline) values for skauswatch-pki.
# Per-environment overrides live in alpha.yml / beta.yml / gamma.yml / production.yml.
replicaCount: 3

image:
  repository: ghcr.io/penguintechinc/skauswatch/pki
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# REST (API_PORT), gRPC (GRPC_PORT), Prometheus metrics.
httpPort: 8001
grpcPort: 50052
metricsPort: 9090

# Internal service only — consumed by manager/sshca, never exposed externally.
service:
  type: ClusterIP
  port: 8001
  grpcPort: 50052
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []

httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  host: skauswatch.app
  rules: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# The CA private key/cert are generated on first boot and persisted to
# /etc/pki (see services/pki/src/config.rs CA_KEY_PATH/CA_CERT_PATH) — this
# is the one skauswatch service that genuinely needs a writable, persistent
# volume; readOnlyRootFilesystem stays true everywhere else in the container.
persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  storageClassName: ""

env:
  - name: API_PORT
    value: "8001"
  - name: GRPC_PORT
    value: "50052"
  - name: CA_KEY_PATH
    value: "/etc/pki/ca.key"
  - name: CA_CERT_PATH
    value: "/etc/pki/ca.crt"
  - name: RUST_LOG
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: log-level
  - name: DB_TYPE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-type
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-host
  - name: DB_PORT
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-port
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-name
  - name: DB_POOL_SIZE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-pool-size
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: skauswatch-pki-secret
        key: db-user
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: skauswatch-pki-secret
        key: db-pass
  - name: LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: skauswatch-pki-secret
        key: license-key
  - name: LICENSE_SERVER_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: license-server-url
  - name: RELEASE_MODE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: release-mode

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

volumeMounts:
  - name: ca-material
    mountPath: /etc/pki

volumes:
  - name: ca-material
    persistentVolumeClaim:
      claimName: skauswatch-pki-ca

configMapData:
  log-level: "info"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "20"
  license-server-url: "https://license.penguintech.io"
  release-mode: "true"

secretData:
  db-user: "changeme-in-production"
  db-pass: "changeme-in-production"
  license-key: "PENG-XXXX-XXXX-XXXX-XXXX-ABCD"
