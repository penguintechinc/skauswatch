# Default (prod-safe baseline) values for skauswatch-pki.
# Per-environment overrides live in alpha.yml / beta.yml / gamma.yml / production.yml.
replicaCount: 3

image:
  repository: ghcr.io/penguintechinc/skauswatch/pki
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Name of a pre-provisioned Secret (or ExternalSecret target) to use
# instead of the chart-managed one below. When set, templates/secret.yaml
# is not rendered and Deployment/DaemonSet env vars read from this Secret.
existingSecret: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  # Required for Pod Security Admission "restricted" compliance (and
  # good practice under "baseline") -- see k8s/helm/README.md "Cluster
  # security baseline".
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Tetragon exec-allowlist enforcement (templates/tracingpolicy.yaml).
# Requires the Tetragon agent DaemonSet in-cluster -- set false to render
# without it (e.g. a cluster that hasn't rolled Tetragon out yet).
tetragon:
  enabled: true

# REST (API_PORT), gRPC (GRPC_PORT), Prometheus metrics.
httpPort: 8001
grpcPort: 50052
metricsPort: 9090

# Internal service only — consumed by manager/sshca, never exposed externally.
service:
  type: ClusterIP
  port: 8001
  grpcPort: 50052
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []

httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  host: skauswatch.app
  rules: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# The CA private key/cert are generated on first boot and persisted to
# /etc/pki (see services/pki/src/config.rs CA_KEY_PATH/CA_CERT_PATH) — this
# is the one skauswatch service that genuinely needs a writable, persistent
# volume; readOnlyRootFilesystem stays true everywhere else in the container.
#
# AT-REST ENCRYPTION (see k8s/helm/README.md "At-rest encryption
# baseline"): this is the only Kubernetes-native volume in the whole
# product (every other service's storage is an external Postgres/S3
# dependency this chart set doesn't own). storageClassName MUST resolve to
# an encryption-at-rest-capable StorageClass in beta/gamma/production —
# left empty (cluster default) here since the real class name is
# cluster-specific and unknown to this chart; k8s-ops sets it per
# environment values file before first deploy. Holds the CA root private
# key, so this is not optional.
persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  storageClassName: ""

env:
  - name: API_PORT
    value: "8001"
  - name: GRPC_PORT
    value: "50052"
  - name: CA_KEY_PATH
    value: "/etc/pki/ca.key"
  - name: CA_CERT_PATH
    value: "/etc/pki/ca.crt"
  - name: RUST_LOG
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: log-level
  - name: DB_TYPE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-type
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-host
  - name: DB_PORT
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-port
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-name
  - name: DB_POOL_SIZE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: db-pool-size
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-pki.secretName" . }}'
        key: db-user
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-pki.secretName" . }}'
        key: db-pass
  - name: LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-pki.secretName" . }}'
        key: license-key
  - name: LICENSE_SERVER_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: license-server-url
  - name: RELEASE_MODE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-pki-config
        key: release-mode

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

volumeMounts:
  - name: ca-material
    mountPath: /etc/pki

volumes:
  - name: ca-material
    persistentVolumeClaim:
      claimName: skauswatch-pki-ca

# --- SPIFFE Workload API socket (SPIRE) --------------------------------
# Wires SPIFFE_ENDPOINT_SOCKET + the agent Workload API socket into this
# pod so skauswatch-identity::IdentityProvider can fetch an SVID at
# runtime (see k8s/helm/spire/README.md "Service-pod SVID pattern"). pki
# hard-requires a live SVID whenever RELEASE_MODE=true (release-mode
# constructs IdentityProvider unconditionally) — without this mount pki
# crash-loops in production. NECESSARY BUT NOT SUFFICIENT: the socket is
# only populated once a spire-agent DaemonSet is actually running on the
# node — enabling this toggle without a live agent still leaves the mount
# empty/absent (agent rollout is cutover ops, not this chart).
# beta/gamma/production all set spire.enabled: true; alpha stays off
# (release-mode: "false", no SPIRE agent in local MicroK8s by default).
spire:
  enabled: false
  socketDir: /run/spire/sockets
  # CSI driver variant — DISABLED BY DEFAULT, matches k8s/helm/spire's own
  # csiDriver.enabled default. The SPIFFE CSI Driver DaemonSet runs
  # privileged: true (ROOT EXCEPTION per devops-containers.md) — do not
  # set true in any env file without explicit user approval first.
  csiDriver:
    enabled: false

configMapData:
  log-level: "info"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "20"
  license-server-url: "https://license.penguintech.io"
  release-mode: "true"

# MUST be set via --set/values or existingSecret; services fail closed
# on a blank/known-default secret (never ship a real credential here).
secretData:
  db-user: ""
  db-pass: ""
  license-key: "PENG-XXXX-XXXX-XXXX-XXXX-ABCD"
