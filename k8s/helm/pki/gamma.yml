# Gamma overrides — dal2-gamma cluster, namespace: skauswatch. Internal service only.
replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/skauswatch/pki
  tag: "gamma-0000000000"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: true
  size: 1Gi

ingress:
  enabled: false

httproute:
  enabled: false

configMapData:
  log-level: "info"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "5"
  license-server-url: "https://license.penguintech.io"
  release-mode: "false"
