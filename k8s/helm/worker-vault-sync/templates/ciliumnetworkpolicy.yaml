# Cilium default-deny + explicit allow for {{ include "skauswatch-worker-vault-sync.fullname" . }}.
# Selecting this pod with ANY CiliumNetworkPolicy makes Cilium deny every
# ingress/egress path not explicitly listed below (Cilium per-endpoint
# default-deny model) -- there is no separate blanket "default-deny" object
# needed alongside this one. See k8s/helm/README.md "Cluster security
# baseline" for the full policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "skauswatch-worker-vault-sync.fullname" . }}
  labels:
    {{- include "skauswatch-worker-vault-sync.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "skauswatch-worker-vault-sync.selectorLabels" . | nindent 6 }}
  ingress:
    # kubelet liveness/readiness probes originate from the node, not a pod
    # identity -- must be explicitly allowed or probes fail closed once this
    # pod is selected by any CiliumNetworkPolicy.
    - fromEntities:
        - host
        - remote-node
    # Prometheus scrape (same-namespace collector -- adjust label if the
    # cluster's Prometheus/Alloy runs in a dedicated monitoring namespace).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    # DNS resolution (kube-dns) -- required for any Service/FQDN egress below.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Postgres (same-namespace dependency; NOT owned by this chart -- see
    # k8s/helm/README.md "Dependency label assumption"). Labels are the
    # Bitnami postgresql chart convention per devops-kubernetes.md; verify
    # against the actual deployed Postgres Service/pod labels before relying
    # on this in a live cluster.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Valkey/Redis (same-namespace dependency; NOT owned by this chart --
    # see k8s/helm/README.md "Dependency label assumption"). Labels are the
    # valkey/valkey chart convention; verify against the actual deployed
    # Service/pod labels before relying on this in a live cluster.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Cloud vault sync targets (AWS Secrets Manager) -- operator-configured per-tenant, so this is a broad pattern rather than a pinned hostname; narrow per-deployment if the target cloud accounts are known ahead of time.
    - toFQDNs:
        - matchPattern: "*.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Azure Key Vault sync targets.
    - toFQDNs:
        - matchPattern: "*.vault.azure.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # GCP Secret Manager sync targets.
    - toFQDNs:
        - matchPattern: "*.googleapis.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
