# Alpha environment overrides (local MicroK8s)
replicaCount: 1

image:
  pullPolicy: Never
  tag: latest

namespace: skauswatch-alpha

env:
  - name: LOG_LEVEL
    value: "DEBUG"
  - name: FLASK_ENV
    value: "development"
  - name: RELEASE_MODE
    value: "false"

autoscaling:
  enabled: false

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

# Consumer only - no ingress
ingress:
  enabled: false
