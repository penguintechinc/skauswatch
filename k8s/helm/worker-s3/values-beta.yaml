# Beta environment overrides (dal2 cluster)
replicaCount: 1

image:
  registry: registry-dal2.penguintech.io
  pullPolicy: Always
  tag: latest

namespace: skauswatch

env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: FLASK_ENV
    value: "production"
  - name: RELEASE_MODE
    value: "false"

autoscaling:
  enabled: false

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Consumer only - no ingress
ingress:
  enabled: false
