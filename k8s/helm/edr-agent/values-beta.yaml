# Beta environment overrides (dal2 cluster)
image:
  registry: ghcr.io/penguintechinc/skauswatch
  pullPolicy: Always
  tag: latest

imagePullSecrets:
  - name: ghcr-pull-secret

namespace: skauswatch

env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: RELEASE_MODE
    value: "false"

resources:
  limits:
    cpu: "500m"
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi
