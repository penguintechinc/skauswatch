# Alpha environment overrides (local MicroK8s)
image:
  pullPolicy: Never
  tag: latest

namespace: skauswatch-alpha

env:
  - name: LOG_LEVEL
    value: "DEBUG"
  - name: RELEASE_MODE
    value: "false"

resources:
  limits:
    cpu: "250m"
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi
