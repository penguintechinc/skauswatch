# Alpha overrides — local MicroK8s (local-alpha context), namespace: skauswatch.
replicaCount: 1

image:
  repository: localhost:32000/skauswatch/worker-codescan
  tag: "alpha-latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

configMapData:
  log-level: "debug"
  # FIRST-RUN FIX (k8s-ops): see values.yaml DB_TYPE env comment.
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "2"
  redis-url: "redis://redis:6379/0"
  redis-key-prefix: "skauswatch"
  ai-provider: "anthropic"
  ai-model: "claude-opus-4-5"
  license-server-url: "https://license.penguintech.io"
  release-mode: "false"
