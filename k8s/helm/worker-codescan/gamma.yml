# Gamma overrides — dal2-gamma cluster, namespace: skauswatch.
replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/skauswatch/worker-codescan
  tag: "gamma-0000000000"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

configMapData:
  log-level: "info"
  redis-url: "redis://redis:6379/0"
  redis-key-prefix: "skauswatch"
  ai-provider: "anthropic"
  ai-model: "claude-opus-4-5"
  license-server-url: "https://license.penguintech.io"
  release-mode: "false"
