apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skauswatch-pki-server.fullname" . }}-secret
  labels:
    {{- include "skauswatch-pki-server.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- range $key, $value := .Values.secretData }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
