# Beta environment overrides (dal2 cluster)
replicaCount: 2

image:
  registry: registry-dal2.penguintech.io
  pullPolicy: Always
  tag: latest

namespace: skauswatch-beta

env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: FLASK_ENV
    value: "production"
  - name: RELEASE_MODE
    value: "false"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 125m
    memory: 256Mi

# Internal service only - no ingress
ingress:
  enabled: false
