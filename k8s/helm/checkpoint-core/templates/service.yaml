apiVersion: v1
kind: Service
metadata:
  name: {{ include "checkpoint-core.fullname" . }}
  labels:
    {{- include "checkpoint-core.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "checkpoint-core.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "checkpoint-core.fullname" . }}-ldap
  labels:
    {{- include "checkpoint-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: ldap
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.ldapService.type }}
  ports:
    - name: ldap
      port: {{ .Values.service.ldapPort }}
      targetPort: ldap
      protocol: TCP
      {{- if eq .Values.ldapService.type "NodePort" }}
      {{- if .Values.ldapService.nodePort }}
      nodePort: {{ .Values.ldapService.nodePort }}
      {{- end }}
      {{- end }}
  selector:
    {{- include "checkpoint-core.selectorLabels" . | nindent 4 }}
