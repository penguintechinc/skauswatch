# Default (prod-safe baseline) values for skauswatch-codescan-backend.
# Per-environment overrides live in alpha.yml / beta.yml / gamma.yml / production.yml.
replicaCount: 3

image:
  repository: ghcr.io/penguintechinc/skauswatch/codescan-backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Name of a pre-provisioned Secret (or ExternalSecret target) to use
# instead of the chart-managed one below. When set, templates/secret.yaml
# is not rendered and Deployment/DaemonSet env vars read from this Secret.
existingSecret: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  # Required for Pod Security Admission "restricted" compliance (and
  # good practice under "baseline") -- see k8s/helm/README.md "Cluster
  # security baseline".
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Tetragon exec-allowlist enforcement (templates/tracingpolicy.yaml).
# Requires the Tetragon agent DaemonSet in-cluster -- set false to render
# without it (e.g. a cluster that hasn't rolled Tetragon out yet).
tetragon:
  enabled: true

httpPort: 5005
metricsPort: 9090

service:
  type: ClusterIP
  port: 5005
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: skauswatch.app
      paths:
        - path: /api/codescan
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  host: skauswatch.app
  rules:
    - path: /api/codescan
      service: skauswatch-codescan-backend
      port: 5005

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: API_PORT
    value: "5005"
  - name: ENVIRONMENT
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: environment
  - name: RUST_LOG
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: log-level
  - name: DB_TYPE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: db-type
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: db-host
  - name: DB_PORT
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: db-port
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: db-name
  - name: DB_POOL_SIZE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: db-pool-size
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-codescan-backend.secretName" . }}'
        key: db-user
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-codescan-backend.secretName" . }}'
        key: db-pass
  - name: REDIS_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: redis-url
  - name: REDIS_KEY_PREFIX
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: redis-key-prefix
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-codescan-backend.secretName" . }}'
        key: redis-password
        optional: true
  - name: JWT_VERIFY_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-codescan-backend.secretName" . }}'
        key: jwt-verify-key
  - name: CREDENTIAL_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-codescan-backend.secretName" . }}'
        key: credential-encryption-key
  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-codescan-backend.secretName" . }}'
        key: anthropic-api-key
        optional: true
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-codescan-backend.secretName" . }}'
        key: openai-api-key
        optional: true
  - name: LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-codescan-backend.secretName" . }}'
        key: license-key
  - name: LICENSE_SERVER_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: license-server-url
  - name: RELEASE_MODE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-codescan-backend-config
        key: release-mode

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

volumeMounts: []

volumes: []

configMapData:
  environment: "production"
  log-level: "info"
  db-type: "postgresql"
  db-host: "postgres"
  db-port: "5432"
  db-name: "skauswatch"
  db-pool-size: "20"
  redis-url: "redis://redis:6379/0"
  redis-key-prefix: "skauswatch"
  license-server-url: "https://license.penguintech.io"
  release-mode: "true"

# MUST be set via --set/values or existingSecret; services fail closed
# on a blank/known-default secret (never ship a real credential here).
secretData:
  db-user: ""
  db-pass: ""
  redis-password: ""
  # PEM EC P-256 public key (SPKI) verifying ES256 tokens minted by
  # manager (the sole issuer) -- see k8s/helm/manager/values.yaml
  # secretData for keypair generation commands.
  jwt-verify-key: ""
  credential-encryption-key: ""
  anthropic-api-key: ""
  openai-api-key: ""
  license-key: "PENG-XXXX-XXXX-XXXX-XXXX-ABCD"

# --- Ops observability (PodDisruptionBudget / PrometheusRule /
# ServiceMonitor) ---------------------------------------------------------
# Release-audit finding (gh-148/gh-150): this chart shipped 0
# PodDisruptionBudgets and 0 PrometheusRule/ServiceMonitor objects. Both
# assume the Prometheus Operator CRDs (monitoring.coreos.com/v1, policy/v1
# is core) are already installed in-cluster -- disable the relevant toggle
# if not. Pattern mirrors k8s/helm/svc-ingest's values.yaml (same section).

# maxUnavailable (not minAvailable) deliberately -- at replicaCount: 1
# (alpha/beta/gamma), minAvailable: 1 would block ALL voluntary
# disruptions (including node drains) since 0 replicas could ever remain
# healthy; maxUnavailable: 1 computes desiredHealthy = replicas - 1, which
# is 0 at replicas: 1, so it always permits eviction of the sole pod while
# still capping disruption to 1 pod at a time once replicaCount scales up
# (prod: 3, see replicaCount above).
pdb:
  enabled: true
  maxUnavailable: 1

# Label most Prometheus Operator installs (kube-prometheus-stack's default
# ruleSelector/serviceMonitorSelector) require to discover a
# PrometheusRule/ServiceMonitor -- conventionally the Prometheus Operator's
# own Helm release name. Override per-cluster if that release isn't named
# "prometheus"; set to "" to omit the label entirely (e.g. an Operator
# configured with an empty/any selector).
monitoring:
  releaseLabel: "prometheus"

# services/codescan-backend/src has no custom counter!/histogram!/gauge!
# metrics as of this pass (grep-verified) -- only the bare Prometheus
# exporter mount (skauswatch_telemetry::install_metrics_exporter). No
# error/failure-rate alert is added below since there is no real metric to
# alert on yet; fabricating one against a nonexistent series would just
# permanently evaluate to "no data". Baseline for now is target-down only.
# Revisit once the service emits a request-error counter.
prometheusRule:
  enabled: true
  additionalLabels: {}
  targetDownFor: "5m"

# Scrapes the Service (templates/service.yaml) on its "metrics" port
# (:9090). See templates/servicemonitor.yaml.
serviceMonitor:
  enabled: true
  additionalLabels: {}
  interval: "30s"
  scrapeTimeout: "10s"
