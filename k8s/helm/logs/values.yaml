# Default (prod-safe baseline) values for skauswatch-logs.
# Per-environment overrides live in alpha.yml / beta.yml / gamma.yml / production.yml.
#
# DEPRECATED (svc-ingest cutover, Task 3.3): services/logs is superseded by
# svc-ingest (k8s/helm/svc-ingest) -- the manager's SIEM-ingest proxy
# (LOGS_URL) now points at the svc-ingest receiver in every environment.
# Scaled to zero rather than removed so this chart stays a one-release
# rollback path; every per-env values file below has been zeroed the same
# way. Do not delete this chart until the rollback window has passed.
replicaCount: 0

image:
  repository: ghcr.io/penguintechinc/skauswatch/logs
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Name of a pre-provisioned Secret (or ExternalSecret target) to use
# instead of the chart-managed one below. When set, templates/secret.yaml
# is not rendered and Deployment/DaemonSet env vars read from this Secret.
existingSecret: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  # Required for Pod Security Admission "restricted" compliance (and
  # good practice under "baseline") -- see k8s/helm/README.md "Cluster
  # security baseline".
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Tetragon exec-allowlist enforcement (templates/tracingpolicy.yaml).
# Requires the Tetragon agent DaemonSet in-cluster -- set false to render
# without it (e.g. a cluster that hasn't rolled Tetragon out yet).
tetragon:
  enabled: true

httpPort: 5010
metricsPort: 9090

service:
  type: ClusterIP
  port: 5010
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: skauswatch.app
      paths:
        - path: /api/logs
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  host: skauswatch.app
  rules:
    - path: /api/logs
      service: skauswatch-logs
      port: 5010

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Disabled alongside replicaCount: 0 above (svc-ingest cutover, Task 3.3)
# -- an enabled HPA would fight the zeroed replica count.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# services/logs/src/config.rs reads OPENSEARCH_URL/LOG_RETENTION_DAYS/
# HTTP_PORT — no DB/license vars are wired up in this ingest path.
# JWT_VERIFY_KEY is required though: services/logs/src/main.rs and
# src/ingest.rs load it via skauswatch_auth::load_jwt_secret and require a
# valid ES256 bearer token (signed by manager, the sole issuer) on every
# /ingest request.
env:
  - name: HTTP_PORT
    value: "5010"
  - name: OPENSEARCH_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-logs-config
        key: opensearch-url
  - name: LOG_RETENTION_DAYS
    valueFrom:
      configMapKeyRef:
        name: skauswatch-logs-config
        key: log-retention-days
  # PEM EC P-256 public key (SPKI) verifying ES256 tokens minted by
  # manager (the sole issuer) -- see k8s/helm/manager/values.yaml
  # secretData for keypair generation commands.
  - name: JWT_VERIFY_KEY
    valueFrom:
      secretKeyRef:
        name: '{{ include "skauswatch-logs.secretName" . }}'
        key: jwt-verify-key

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

volumeMounts: []

volumes: []

configMapData:
  opensearch-url: "http://opensearch:9200"
  log-retention-days: "90"

# MUST be set via --set/values or existingSecret; services fail closed
# on a blank/known-default secret (never ship a real credential here).
secretData:
  jwt-verify-key: ""
