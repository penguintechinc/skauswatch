# Beta overrides — dal2-beta cluster, namespace: skauswatch.
# DEPRECATED (svc-ingest cutover, Task 3.3): see values.yaml's comment.
replicaCount: 0

image:
  repository: ghcr.io/penguintechinc/skauswatch/logs
  tag: "beta-0000000000"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: false

httproute:
  enabled: false

configMapData:
  opensearch-url: "http://opensearch:9200"
  log-retention-days: "30"
