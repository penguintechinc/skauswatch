# Production overrides — pinned by SHA256 digest, HA replicas + HPA.
replicaCount: 3

image:
  repository: ghcr.io/penguintechinc/skauswatch/logs
  # Pin to the released digest before deploying — see pinning-dependency-digests skill.
  tag: "sha256:<digest>"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false

httproute:
  enabled: false

configMapData:
  opensearch-url: "http://opensearch:9200"
  log-retention-days: "90"
