# Production overrides — pinned by SHA256 digest, HA replicas + HPA.
# DEPRECATED (svc-ingest cutover, Task 3.3): see values.yaml's comment.
replicaCount: 0

image:
  repository: ghcr.io/penguintechinc/skauswatch/logs
  # Pin to the released digest before deploying — see pinning-dependency-digests skill.
  tag: "sha256:<digest>"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

# Disabled alongside replicaCount: 0 above (svc-ingest cutover, Task 3.3)
# -- an enabled HPA would fight the zeroed replica count.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false

httproute:
  enabled: false

configMapData:
  opensearch-url: "http://opensearch:9200"
  log-retention-days: "90"
