# Cilium default-deny + explicit allow for {{ include "skauswatch-logs.fullname" . }}.
# Selecting this pod with ANY CiliumNetworkPolicy makes Cilium deny every
# ingress/egress path not explicitly listed below (Cilium per-endpoint
# default-deny model) -- there is no separate blanket "default-deny" object
# needed alongside this one. See k8s/helm/README.md "Cluster security
# baseline" for the full policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "skauswatch-logs.fullname" . }}
  labels:
    {{- include "skauswatch-logs.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "skauswatch-logs.selectorLabels" . | nindent 6 }}
  ingress:
    # kubelet liveness/readiness probes originate from the node, not a pod
    # identity -- must be explicitly allowed or probes fail closed once this
    # pod is selected by any CiliumNetworkPolicy.
    - fromEntities:
        - host
        - remote-node
    {{- if or .Values.ingress.enabled .Values.httproute.enabled }}
    # Cross-namespace: Cilium Gateway / ingress controller in the shared
    # "gateway" namespace -- only active when this chart's own
    # ingress/httproute is enabled for the target environment.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.httproute.gatewayNamespace | default "gateway" }}
      toPorts:
        - ports:
            - port: "5010"
              protocol: TCP
    {{- end }}
    # Prometheus scrape (same-namespace collector -- adjust label if the
    # cluster's Prometheus/Alloy runs in a dedicated monitoring namespace).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    # DNS resolution (kube-dns) -- required for any Service/FQDN egress below.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # OpenSearch (same-namespace dependency; NOT owned by this chart).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: opensearch
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
