# ServiceMonitor -- release-audit finding (gh-150, 0 ServiceMonitor objects
# existed). Scrapes the Service (templates/service.yaml) on its "metrics"
# port (:9090/tcp, Prometheus text format).
#
# Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1)
# installed in-cluster -- disable serviceMonitor.enabled if not.
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "skauswatch-logs.fullname" . }}
  labels:
    {{- include "skauswatch-logs.labels" . | nindent 4 }}
    {{- if .Values.monitoring.releaseLabel }}
    release: {{ .Values.monitoring.releaseLabel | quote }}
    {{- end }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "skauswatch-logs.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
