# Alpha overrides — local MicroK8s (local-alpha context), namespace: skauswatch.
# DEPRECATED (svc-ingest cutover, Task 3.3): see values.yaml's comment.
replicaCount: 0

image:
  repository: localhost:32000/skauswatch/logs
  tag: "alpha-latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: false

httproute:
  enabled: false

configMapData:
  opensearch-url: "http://opensearch:9200"
  log-retention-days: "7"
