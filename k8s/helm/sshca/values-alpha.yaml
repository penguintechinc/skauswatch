# Alpha environment overrides (local MicroK8s)
replicaCount: 1

image:
  pullPolicy: Never
  tag: latest

namespace: skauswatch

env:
  - name: LOG_LEVEL
    value: "DEBUG"
  - name: FLASK_ENV
    value: "development"
  - name: RELEASE_MODE
    value: "false"
  # Vault shim: forward to Vault sshca (absorbed service)
  - name: VAULT_SSHCA_URL
    value: "http://vault-sshca.vault.svc.cluster.local:8082"

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# Internal service only - no ingress
ingress:
  enabled: false
