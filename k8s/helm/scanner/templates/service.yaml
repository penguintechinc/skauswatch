{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skauswatch-scanner.fullname" . }}
  labels:
    {{- include "skauswatch-scanner.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  # Worker — no client-facing API. ClusterIP only exists so Prometheus can
  # scrape /metrics; probes hit the pod IP directly and don't need this.
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
    - port: {{ .Values.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "skauswatch-scanner.selectorLabels" . | nindent 4 }}
{{- end }}
