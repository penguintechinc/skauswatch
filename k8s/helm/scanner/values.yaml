replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/skauswatch-scanner
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  enabled: true
  type: ClusterIP
  port: 5004
  targetPort: 5004

# No ingress - internal service only
ingress:
  enabled: false

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: FLASK_ENV
    value: "production"
  - name: FLASK_APP
    value: "app:create_app()"
  - name: SCANNER_PORT
    value: "5004"
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: skauswatch-scanner-secret
        key: secret-key
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: skauswatch-scanner-secret
        key: database-url
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: skauswatch-scanner-secret
        key: redis-url
  - name: CELERY_BROKER_URL
    valueFrom:
      secretKeyRef:
        name: skauswatch-scanner-secret
        key: celery-broker-url
  - name: LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: skauswatch-scanner-secret
        key: license-key
  - name: LICENSE_SERVER_URL
    valueFrom:
      configMapKeyRef:
        name: skauswatch-scanner-config
        key: license-server-url
  - name: RELEASE_MODE
    valueFrom:
      configMapKeyRef:
        name: skauswatch-scanner-config
        key: release-mode

livenessProbe:
  httpGet:
    path: /health
    port: 5004
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5004
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

volumeMounts: []

volumes: []

configMapData:
  license-server-url: "https://license.penguintech.io"
  release-mode: "false"

secretData:
  secret-key: "changeme-in-production"
  database-url: "postgresql://app_user:changeme@postgres:5432/skauswatch"
  redis-url: "redis://:changeme@redis:6379/0"
  celery-broker-url: "redis://:changeme@redis:6379/1"
  license-key: "PENG-XXXX-XXXX-XXXX-XXXX-ABCD"
