---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-codescan
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: worker-codescan
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-codescan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-codescan
        app.kubernetes.io/component: worker
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: skauswatch
      containers:
      - name: worker-codescan
        image: ghcr.io/penguintechinc/skauswatch-worker-codescan:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5005
          protocol: TCP
        env:
        - name: CODESCAN_PORT
          value: "5005"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LOG_LEVEL
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_NAME
        - name: CODESCAN_DB_USER
          valueFrom:
            secretKeyRef:
              name: skauswatch-codescan-secrets
              key: CODESCAN_DB_USER
        - name: CODESCAN_DB_PASS
          valueFrom:
            secretKeyRef:
              name: skauswatch-codescan-secrets
              key: CODESCAN_DB_PASS
        - name: CODESCAN_CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-codescan-secrets
              key: CODESCAN_CELERY_BROKER_URL
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: skauswatch-codescan-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: skauswatch-codescan-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: CODESCAN_AI_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: CODESCAN_AI_PROVIDER
              optional: true
        - name: CODESCAN_AI_MODEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: CODESCAN_AI_MODEL
              optional: true
        - name: CODESCAN_FREE_TIER_USER_CAP
          value: "3"
        - name: CODESCAN_MAX_REPOS_FREE
          value: "3"
        - name: CODESCAN_MAX_REVIEWS_PER_DAY
          value: "10"
        - name: LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: LICENSE_KEY
        - name: LICENSE_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LICENSE_SERVER_URL
        - name: RELEASE_MODE
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: RELEASE_MODE
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5005
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5005
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
