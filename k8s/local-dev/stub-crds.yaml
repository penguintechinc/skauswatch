# LOCAL-DEV ONLY — never apply in beta/gamma/prod.
#
# microk8s (and any cluster without the real Cilium CNI + Tetragon
# operators installed) rejects every chart's CiliumNetworkPolicy /
# TracingPolicyNamespaced resource with "no matches for kind" because the
# real CRDs backing those kinds don't exist yet. These stub
# CustomResourceDefinitions register the same group/version/kind with a
# permissive (`x-kubernetes-preserve-unknown-fields: true`) schema purely so
# `helm install`/`kubectl apply` of the chart-rendered resources succeeds
# locally. They accept and store the objects; nothing enforces them — no
# controller reconciles a CiliumNetworkPolicy or TracingPolicyNamespaced
# accepted by these stubs. Real network/exec enforcement only happens where
# the genuine Cilium + Tetragon operators are installed (beta/gamma/prod).
#
# See k8s/local-dev/README.md.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumnetworkpolicies.cilium.io
  labels:
    app.kubernetes.io/part-of: skauswatch-local-dev-stub
spec:
  group: cilium.io
  names:
    kind: CiliumNetworkPolicy
    listKind: CiliumNetworkPolicyList
    plural: ciliumnetworkpolicies
    singular: ciliumnetworkpolicy
    shortNames:
      - cnp
      - ciliumnp
  scope: Namespaced
  versions:
    - name: v2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tracingpoliciesnamespaced.cilium.io
  labels:
    app.kubernetes.io/part-of: skauswatch-local-dev-stub
spec:
  group: cilium.io
  names:
    kind: TracingPolicyNamespaced
    listKind: TracingPolicyNamespacedList
    plural: tracingpoliciesnamespaced
    singular: tracingpolicynamespaced
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tracingpolicies.cilium.io
  labels:
    app.kubernetes.io/part-of: skauswatch-local-dev-stub
spec:
  group: cilium.io
  names:
    kind: TracingPolicy
    listKind: TracingPolicyList
    plural: tracingpolicies
