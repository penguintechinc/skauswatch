---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-base

namespace: skauswatch

labels:
- pairs:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/managed-by: kustomize
  includeSelectors: false

resources:
- manifests/namespace.yaml
- manifests/rbac.yaml
- manifests/tls-secret.yaml
- manifests/manager/deployment.yaml
- manifests/manager/service.yaml
- manifests/pki-server/deployment.yaml
- manifests/pki-server/service.yaml
- manifests/ssh-ca/deployment.yaml
- manifests/ssh-ca/service.yaml
- manifests/aaa-monitor/deployment.yaml
- manifests/aaa-monitor/service.yaml
- manifests/worker-s3/deployment.yaml
- manifests/worker-scanner/deployment.yaml
- manifests/worker-scanner/service.yaml
- manifests/worker-darwin/deployment.yaml
- manifests/worker-darwin/service.yaml
- manifests/worker-darwin-celery/deployment.yaml
- manifests/webui/deployment.yaml
- manifests/webui/service.yaml
- manifests/edr-agent/daemonset.yaml

configMapGenerator:
- name: skauswatch-config
  literals:
  - LOG_LEVEL=INFO
  - DB_TYPE=postgres
  - DB_HOST=postgres.skauswatch.svc.cluster.local
  - DB_PORT=5432
  - DB_NAME=skauswatch
  - REDIS_HOST=redis.skauswatch.svc.cluster.local
  - REDIS_PORT=6379
  - LICENSE_SERVER_URL=https://license.penguintech.io
  - RELEASE_MODE=false
  - RESEARCH_ENABLED=true
  - WHOIS_TIMEOUT=10
  - DNS_TIMEOUT=5
  - ASN_TIMEOUT=5
  - SHODAN_ENABLED=false
  - MALTEGO_ENABLED=false
  - MANAGER_URL=http://manager.skauswatch.svc.cluster.local:8080
  - CONSUMER_NAME=worker-s3

secretGenerator:
- name: skauswatch-secrets
  literals:
  - DB_USER=skauswatch
  - DB_PASS=changeme
  - SECRET_KEY=changeme
  - SECURITY_PASSWORD_SALT=changeme
  - LICENSE_KEY=PENG-TEST-TEST-TEST-TEST-ABCDE
  - REDIS_PASSWORD=changeme
- name: skauswatch-darwin-secrets
  literals:
  - DARWIN_DB_USER=darwin
  - DARWIN_DB_PASS=changeme
  - DARWIN_CELERY_BROKER_URL=redis://:changeme@redis:6379/2
  - ANTHROPIC_API_KEY=
  - OPENAI_API_KEY=
