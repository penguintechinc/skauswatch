---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-base

namespace: skauswatch

labels:
- pairs:
    app.kubernetes.io/name: skauswatch
    app.kubernetes.io/managed-by: kustomize
  includeSelectors: false

resources:
- manifests/namespace.yaml
- manifests/rbac.yaml
- manifests/tls-secret.yaml
- manifests/postgres-deployment.yaml
- manifests/postgres-service.yaml
- manifests/postgres-secrets.yaml
- manifests/redis-deployment.yaml
- manifests/redis-service.yaml
- manifests/redis-secrets.yaml
- manifests/manager/deployment.yaml
- manifests/manager/service.yaml
- manifests/pki/deployment.yaml
- manifests/pki/service.yaml
- manifests/sshca/deployment.yaml
- manifests/sshca/service.yaml
- manifests/monitor/deployment.yaml
- manifests/monitor/service.yaml
- manifests/s3scan/deployment.yaml
- manifests/scanner/deployment.yaml
- manifests/scanner/service.yaml
- manifests/worker-codescan/deployment.yaml
- manifests/worker-codescan/service.yaml
- manifests/worker-codescan-celery/deployment.yaml
- manifests/webui/deployment.yaml
- manifests/webui/service.yaml
- manifests/endpoint-agent/daemonset.yaml

configMapGenerator:
- name: skauswatch-config
  literals:
  - LOG_LEVEL=INFO
  - DB_TYPE=postgres
  - DB_HOST=postgres.skauswatch.svc.cluster.local
  - DB_PORT=5432
  - DB_NAME=skauswatch
  - REDIS_HOST=redis.skauswatch.svc.cluster.local
  - REDIS_PORT=6379
  - LICENSE_SERVER_URL=https://license.penguintech.io
  - RELEASE_MODE=false
  - RESEARCH_ENABLED=true
  - WHOIS_TIMEOUT=10
  - DNS_TIMEOUT=5
  - ASN_TIMEOUT=5
  - SHODAN_ENABLED=false
  - MALTEGO_ENABLED=false
  - MANAGER_URL=http://manager.skauswatch.svc.cluster.local:8080
  - CONSUMER_NAME=s3scan

secretGenerator:
- name: skauswatch-secrets
  literals:
  - DB_USER=skauswatch
  - DB_PASS=changeme
  - SECRET_KEY=changeme
  - SECURITY_PASSWORD_SALT=changeme
  - LICENSE_KEY=PENG-TEST-TEST-TEST-TEST-ABCDE
  - REDIS_PASSWORD=changeme
- name: skauswatch-codescan-secrets
  literals:
  - CODESCAN_DB_USER=codescan
  - CODESCAN_DB_PASS=changeme
  - CODESCAN_CELERY_BROKER_URL=redis://:changeme@redis:6379/2
  - ANTHROPIC_API_KEY=
  - OPENAI_API_KEY=
