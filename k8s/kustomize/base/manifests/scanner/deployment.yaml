---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: scanner
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scanner
        app.kubernetes.io/component: worker
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: skauswatch
      containers:
      - name: scanner
        image: ghcr.io/penguintechinc/skauswatch-scanner:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5004
          protocol: TCP
        env:
        - name: SCANNER_PORT
          value: "5004"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LOG_LEVEL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: REDIS_URL
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: CELERY_BROKER_URL
        - name: LICENSE_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LICENSE_SERVER_URL
        - name: RELEASE_MODE
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: RELEASE_MODE
        livenessProbe:
          httpGet:
            path: /api/v1/scanner/healthz
            port: 5004
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/scanner/healthz
            port: 5004
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
