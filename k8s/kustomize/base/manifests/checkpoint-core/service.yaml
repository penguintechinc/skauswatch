---
apiVersion: v1
kind: Service
metadata:
  name: checkpoint-core
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: checkpoint-core
    app.kubernetes.io/component: auth
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: checkpoint-core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: checkpoint-core-ldap
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: checkpoint-core
    app.kubernetes.io/component: ldap
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: checkpoint-core
  ports:
    - name: ldap
      port: 389
      targetPort: 389
      protocol: TCP
