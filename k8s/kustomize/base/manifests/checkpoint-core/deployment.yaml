---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkpoint-core
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: checkpoint-core
    app.kubernetes.io/component: auth
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: checkpoint-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkpoint-core
        app.kubernetes.io/component: auth
        app.kubernetes.io/managed-by: kustomize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: skauswatch
      containers:
      - name: checkpoint-core
        image: registry-dal2.penguintech.io/skauswatch/checkpoint-core:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        - name: ldap
          containerPort: 389
          protocol: TCP
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LOG_LEVEL
        - name: RELEASE_MODE
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: RELEASE_MODE
        - name: LICENSE_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LICENSE_SERVER_URL
        - name: DB_TYPE
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_TYPE
        - name: CHECKPOINT_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_HOST
        - name: CHECKPOINT_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_PORT
        - name: CHECKPOINT_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_NAME
        - name: CHECKPOINT_DB_PASS
          valueFrom:
            secretKeyRef:
              name: checkpoint-core-secrets
              key: DB_PASS
        - name: CHECKPOINT_SIGNING_MEK
          valueFrom:
            secretKeyRef:
              name: checkpoint-core-secrets
              key: CHECKPOINT_SIGNING_MEK
        - name: CHECKPOINT_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: checkpoint-core-secrets
              key: CHECKPOINT_LICENSE_KEY
        - name: CHECKPOINT_PORT
          value: "8080"
        - name: CHECKPOINT_GRPC_PORT
          value: "50051"
        - name: CHECKPOINT_LDAP_PORT
          value: "389"
        - name: CHECKPOINT_LDAP_ENABLED
          value: "true"
        - name: CHECKPOINT_CORE_GRPC_HOST
          value: "skauswatch-manager"
        - name: CHECKPOINT_CORE_GRPC_PORT
          value: "50051"
        - name: CHECKPOINT_REQUIRE_PKCE
          value: "true"
        - name: CHECKPOINT_TOKEN_TTL
          value: "3600"
        - name: CHECKPOINT_REFRESH_TOKEN_TTL
          value: "86400"
        - name: CHECKPOINT_AUTH_RATE_LIMIT_PER_MIN
          value: "10"
        - name: CHECKPOINT_DB_USER
          value: "checkpoint-rw"
        - name: CHECKPOINT_DB_TYPE
          value: "postgresql"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
