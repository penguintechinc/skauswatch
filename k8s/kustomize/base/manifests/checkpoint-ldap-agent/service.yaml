---
apiVersion: v1
kind: Service
metadata:
  name: checkpoint-ldap-agent
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: checkpoint-ldap-agent
    app.kubernetes.io/component: ldap-agent
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: checkpoint-ldap-agent
  ports:
    - name: ldap
      port: 389
      targetPort: 389
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
