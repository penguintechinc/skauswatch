---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkpoint-ldap-agent
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: checkpoint-ldap-agent
    app.kubernetes.io/component: ldap-agent
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: checkpoint-ldap-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkpoint-ldap-agent
        app.kubernetes.io/component: ldap-agent
        app.kubernetes.io/managed-by: kustomize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: skauswatch
      containers:
      - name: checkpoint-ldap-agent
        image: registry-dal2.penguintech.io/skauswatch/checkpoint-ldap-agent:latest
        imagePullPolicy: Always
        ports:
        - name: ldap
          containerPort: 389
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: AGENT_ID
          value: "default-agent"
        - name: CHECKPOINT_GRPC_HOST
          value: "checkpoint-core"
        - name: CHECKPOINT_GRPC_PORT
          value: "50051"
        - name: SKAUSWATCH_CORE_URL
          value: "http://skauswatch-manager:8080"
        - name: LDAP_PORT
          value: "389"
        - name: LDAP_BASE_DN
          value: "dc=skauswatch,dc=app"
        - name: AGENT_SITE_NAME
          value: "default"
        - name: METRICS_PORT
          value: "9090"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LOG_LEVEL
        - name: AGENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: checkpoint-ldap-agent-secrets
              key: AGENT_TOKEN
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: checkpoint-ldap-agent-secrets
              key: LDAP_BIND_PASSWORD
        livenessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
