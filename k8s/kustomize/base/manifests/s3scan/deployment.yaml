---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3scan
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: s3scan
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: s3scan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3scan
        app.kubernetes.io/component: worker
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: skauswatch
      containers:
      - name: s3scan
        image: registry-dal2.penguintech.io/skauswatch/s3scan:latest
        imagePullPolicy: Always
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LOG_LEVEL
        - name: DB_TYPE
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_TYPE
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DB_PASS
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://default:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
        - name: LICENSE_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LICENSE_SERVER_URL
        - name: RELEASE_MODE
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: RELEASE_MODE
        - name: CONSUMER_NAME
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: CONSUMER_NAME
        volumeMounts:
        - name: clamav-db
          mountPath: /var/lib/clamav
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: clamav-db
        emptyDir: {}
