---
# Darwin DB init Job — creates the 'darwin' PostgreSQL user and grants
# permissions on all darwin_* tables.
#
# Run AFTER: alembic upgrade head (which creates the tables)
# Run with:  kubectl apply --context local-alpha -f k8s/manifests/worker-darwin/db-init-job.yaml
#
# To re-run: delete the completed job first
#   kubectl delete job darwin-db-init -n skauswatch --context local-alpha
apiVersion: batch/v1
kind: Job
metadata:
  name: darwin-db-init
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: darwin-db-init
    app.kubernetes.io/component: migration
    app.kubernetes.io/managed-by: kustomize
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darwin-db-init
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: psql
        image: postgres:16-bookworm
        command:
          - /bin/sh
          - -c
          - |
            psql \
              "postgresql://${PG_USER}:${PG_PASS}@postgres:5432/${PG_DB}" \
              -v ON_ERROR_STOP=1 <<'EOSQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'darwin') THEN
                EXECUTE format('CREATE USER darwin WITH PASSWORD %L', '$(DARWIN_DB_PASS)');
                RAISE NOTICE 'User darwin created.';
              ELSE
                RAISE NOTICE 'User darwin already exists.';
              END IF;
            END
            $$;

            GRANT SELECT, INSERT, UPDATE, DELETE ON
              darwin_tenants,
              darwin_users,
              darwin_repo_configs,
              darwin_git_credentials,
              darwin_reviews,
              darwin_review_comments,
              darwin_review_detections,
              darwin_issue_plans,
              darwin_provider_usage,
              darwin_license_policies,
              darwin_license_detections,
              darwin_license_violations
            TO darwin;

            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO darwin;

            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO darwin;
            EOSQL
        env:
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DB_USER
        - name: PG_PASS
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DB_PASS
        - name: PG_DB
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_NAME
        - name: DARWIN_DB_PASS
          valueFrom:
            secretKeyRef:
              name: skauswatch-darwin-secrets
              key: DARWIN_DB_PASS
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
