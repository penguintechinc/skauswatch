---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pki-server
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: pki-server
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pki-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pki-server
        app.kubernetes.io/component: api
        app.kubernetes.io/managed-by: kustomize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: skauswatch
      containers:
      - name: pki-server
        image: registry-dal2.penguintech.io/skauswatch/pki-server:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5001
          protocol: TCP
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LOG_LEVEL
        - name: DB_TYPE
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_TYPE
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DB_PASS
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: SECRET_KEY
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: REDIS_PASSWORD
        - name: LICENSE_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: LICENSE_SERVER_URL
        - name: RELEASE_MODE
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: RELEASE_MODE
        - name: API_PORT
          value: "5001"
        - name: ICEBOX_PKI_URL
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: ICEBOX_PKI_URL
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
