---
# CodeScan DB init Job — creates the 'codescan' PostgreSQL user and grants
# permissions on all codescan_* tables.
#
# Run AFTER: alembic upgrade head (which creates the tables)
# Run with:  kubectl apply --context local-alpha -f k8s/manifests/worker-codescan/db-init-job.yaml
#
# To re-run: delete the completed job first
#   kubectl delete job codescan-db-init -n skauswatch --context local-alpha
apiVersion: batch/v1
kind: Job
metadata:
  name: codescan-db-init
  namespace: skauswatch
  labels:
    app.kubernetes.io/name: codescan-db-init
    app.kubernetes.io/component: migration
    app.kubernetes.io/managed-by: kustomize
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codescan-db-init
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: psql
        image: postgres:16-bookworm
        command:
          - /bin/sh
          - -c
          - |
            psql \
              "postgresql://${PG_USER}:${PG_PASS}@postgres:5432/${PG_DB}" \
              -v ON_ERROR_STOP=1 <<'EOSQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'codescan') THEN
                EXECUTE format('CREATE USER codescan WITH PASSWORD %L', '$(CODESCAN_DB_PASS)');
                RAISE NOTICE 'User codescan created.';
              ELSE
                RAISE NOTICE 'User codescan already exists.';
              END IF;
            END
            $$;

            GRANT SELECT, INSERT, UPDATE, DELETE ON
              codescan_tenants,
              codescan_users,
              codescan_repo_configs,
              codescan_git_credentials,
              codescan_reviews,
              codescan_review_comments,
              codescan_review_detections,
              codescan_issue_plans,
              codescan_provider_usage,
              codescan_license_policies,
              codescan_license_detections,
              codescan_license_violations
            TO codescan;

            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO codescan;

            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO codescan;
            EOSQL
        env:
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DB_USER
        - name: PG_PASS
          valueFrom:
            secretKeyRef:
              name: skauswatch-secrets
              key: DB_PASS
        - name: PG_DB
          valueFrom:
            configMapKeyRef:
              name: skauswatch-config
              key: DB_NAME
        - name: CODESCAN_DB_PASS
          valueFrom:
            secretKeyRef:
              name: skauswatch-codescan-secrets
              key: CODESCAN_DB_PASS
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
