---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-dev

namespace: skauswatch-dev

namePrefix: dev-

commonLabels:
  environment: development

bases:
- ../../base

replicas:
- name: manager
  count: 1
- name: pki-server
  count: 1
- name: ssh-ca
  count: 1
- name: aaa-monitor
  count: 1
- name: worker-s3
  count: 1
- name: worker-scanner
  count: 1
- name: webui
  count: 1
- name: edr-agent
  count: 1

configMapGenerator:
- name: skauswatch-config
  behavior: merge
  literals:
  - LOG_LEVEL=DEBUG
  - RELEASE_MODE=false

secretGenerator:
- name: skauswatch-secrets
  behavior: merge
  literals:
  - DB_USER=devuser
  - DB_PASS=devpass
  - SECRET_KEY=devsecretkey
  - SECURITY_PASSWORD_SALT=devsalt
  - LICENSE_KEY=PENG-DEV-XXXX-XXXX-XXXX-ABCD
  - REDIS_PASSWORD=devredis
