---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-prod

namespace: skauswatch-prod

namePrefix: prod-

commonLabels:
  environment: production

bases:
- ../../base

replicas:
- name: manager
  count: 3
- name: pki-server
  count: 3
- name: ssh-ca
  count: 2
- name: aaa-monitor
  count: 2
- name: worker-s3
  count: 3
- name: worker-scanner
  count: 3
- name: webui
  count: 2
- name: edr-agent
  count: 2

configMapGenerator:
- name: skauswatch-config
  behavior: merge
  literals:
  - LOG_LEVEL=WARN
  - RELEASE_MODE=true

secretGenerator:
- name: skauswatch-secrets
  behavior: merge
  literals:
  - DB_USER=produser
  - DB_PASS=prodpass
  - SECRET_KEY=prodsecretkey
  - SECURITY_PASSWORD_SALT=prodsalt
  - LICENSE_KEY=PENG-PROD-XXXX-XXXX-XXXX-ABCD
  - REDIS_PASSWORD=prodredis
