---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-beta

namespace: skauswatch-beta

namePrefix: beta-

commonLabels:
  environment: beta
  app.kubernetes.io/version: beta

bases:
- ../../base

replicas:
- name: manager
  count: 2
- name: pki-server
  count: 2
- name: ssh-ca
  count: 2
- name: aaa-monitor
  count: 2
- name: worker-s3
  count: 2
- name: worker-scanner
  count: 2
- name: webui
  count: 2
- name: edr-agent
  count: 2

configMapGenerator:
- name: skauswatch-config
  behavior: merge
  literals:
  - LOG_LEVEL=INFO
  - RELEASE_MODE=false

secretGenerator:
- name: skauswatch-secrets
  behavior: merge
  literals:
  - DB_USER=betauser
  - DB_PASS=betapass
  - SECRET_KEY=betasecretkey
  - SECURITY_PASSWORD_SALT=betasalt
  - LICENSE_KEY=PENG-BETA-XXXX-XXXX-XXXX-ABCD
  - REDIS_PASSWORD=betaredis
