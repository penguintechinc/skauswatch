---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-beta

namespace: skauswatch

labels:
- pairs:
    environment: beta
    app.kubernetes.io/version: beta
  includeSelectors: false

resources:
- ../../base

replicas:
- name: manager
  count: 2
- name: pki
  count: 2
- name: sshca
  count: 2
- name: monitor
  count: 2
- name: s3scan
  count: 2
- name: scanner
  count: 2
- name: worker-codescan
  count: 1
- name: worker-codescan-celery
  count: 1
- name: webui
  count: 2

configMapGenerator:
- name: skauswatch-config
  behavior: merge
  literals:
  - LOG_LEVEL=INFO
  - RELEASE_MODE=false
  # Vault shim env vars — pki and sshca now proxy to Vault services
  - VAULT_PKI_URL=http://vault-pki.vault.svc.cluster.local:8081
  - VAULT_SSHCA_URL=http://vault-sshca.vault.svc.cluster.local:8082

secretGenerator:
- name: skauswatch-secrets
  behavior: merge
  literals:
  - DB_USER=betauser
  - DB_PASS=betapass
  - SECRET_KEY=betasecretkey
  - SECURITY_PASSWORD_SALT=betasalt
  - LICENSE_KEY=PENG-BETA-XXXX-XXXX-XXXX-ABCD
  - REDIS_PASSWORD=betaredis
- name: skauswatch-codescan-secrets
  behavior: merge
  literals:
  - CODESCAN_DB_USER=codescan
  - CODESCAN_DB_PASS=betacodescanpass
  - CODESCAN_CELERY_BROKER_URL=redis://:betaredis@redis:6379/2
  - ANTHROPIC_API_KEY=
  - OPENAI_API_KEY=
