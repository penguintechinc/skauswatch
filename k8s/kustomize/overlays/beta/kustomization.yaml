---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-beta

namespace: skauswatch

namePrefix: beta-

labels:
- pairs:
    environment: beta
    app.kubernetes.io/version: beta
  includeSelectors: false

resources:
- ../../base

images:
- name: registry-dal2.penguintech.io/skauswatch/manager
  newName: registry-dal2.penguintech.io/skauswatch/manager
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/pki-server
  newName: registry-dal2.penguintech.io/skauswatch/pki-server
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/ssh-ca
  newName: registry-dal2.penguintech.io/skauswatch/ssh-ca
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/aaa-monitor
  newName: registry-dal2.penguintech.io/skauswatch/aaa-monitor
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/worker-s3
  newName: registry-dal2.penguintech.io/skauswatch/worker-s3
  newTag: latest
- name: ghcr.io/penguintechinc/skauswatch-worker-scanner
  newName: registry-dal2.penguintech.io/skauswatch/worker-scanner
  newTag: latest
- name: ghcr.io/penguintechinc/skauswatch-worker-darwin
  newName: registry-dal2.penguintech.io/skauswatch/worker-darwin
  newTag: latest
- name: ghcr.io/penguintechinc/skauswatch-webui
  newName: registry-dal2.penguintech.io/skauswatch/webui
  newTag: latest
- name: ghcr.io/penguintechinc/skauswatch-edr-agent
  newName: registry-dal2.penguintech.io/skauswatch/edr-agent
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/checkpoint-core
  newName: registry-dal2.penguintech.io/skauswatch/checkpoint-core
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/checkpoint-ldap-agent
  newName: registry-dal2.penguintech.io/skauswatch/checkpoint-ldap-agent
  newTag: latest

replicas:
- name: manager
  count: 2
- name: pki-server
  count: 2
- name: ssh-ca
  count: 2
- name: aaa-monitor
  count: 2
- name: worker-s3
  count: 2
- name: worker-scanner
  count: 2
- name: worker-darwin
  count: 1
- name: worker-darwin-celery
  count: 1
- name: webui
  count: 2
- name: checkpoint-core
  count: 2
- name: checkpoint-ldap-agent
  count: 2

configMapGenerator:
- name: skauswatch-config
  behavior: merge
  literals:
  - LOG_LEVEL=INFO
  - RELEASE_MODE=false
  # IceBox shim env vars — pki-server and ssh-ca now proxy to IceBox services
  - ICEBOX_PKI_URL=http://icebox-pki-server.icebox.svc.cluster.local:8081
  - ICEBOX_SSH_CA_URL=http://icebox-ssh-ca.icebox.svc.cluster.local:8082
  - CHECKPOINT_ISSUER_URL=https://checkpoint.skauswatch.penguintech.cloud
  - CHECKPOINT_SAML_ENTITY_ID=https://checkpoint.skauswatch.penguintech.cloud/saml
  - CHECKPOINT_LDAP_BASE_DN=dc=skauswatch,dc=app

secretGenerator:
- name: skauswatch-secrets
  behavior: merge
  literals:
  - DB_USER=betauser
  - DB_PASS=betapass
  - SECRET_KEY=betasecretkey
  - SECURITY_PASSWORD_SALT=betasalt
  - LICENSE_KEY=PENG-BETA-XXXX-XXXX-XXXX-ABCD
  - REDIS_PASSWORD=betaredis
- name: skauswatch-darwin-secrets
  behavior: merge
  literals:
  - DARWIN_DB_USER=darwin
  - DARWIN_DB_PASS=betadarwinpass
  - DARWIN_CELERY_BROKER_URL=redis://:betaredis@redis:6379/2
  - ANTHROPIC_API_KEY=
  - OPENAI_API_KEY=
