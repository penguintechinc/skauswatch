---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-staging

namespace: skauswatch-staging

namePrefix: staging-

commonLabels:
  environment: staging

bases:
- ../../base

replicas:
- name: manager
  count: 2
- name: pki
  count: 2
- name: sshca
  count: 2
- name: monitor
  count: 1
- name: s3scan
  count: 1
- name: scanner
  count: 1
- name: webui
  count: 1
- name: endpoint-agent
  count: 1

configMapGenerator:
- name: skauswatch-config
  behavior: merge
  literals:
  - LOG_LEVEL=INFO
  - RELEASE_MODE=false

secretGenerator:
- name: skauswatch-secrets
  behavior: merge
  literals:
  - DB_USER=staginguser
  - DB_PASS=stagingpass
  - SECRET_KEY=stagingsecretkey
  - SECURITY_PASSWORD_SALT=stagingsalt
  - LICENSE_KEY=PENG-STAG-XXXX-XXXX-XXXX-ABCD
  - REDIS_PASSWORD=staginredis
