---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-alpha

namespace: skauswatch

namePrefix: alpha-

labels:
- pairs:
    environment: alpha
    app.kubernetes.io/version: alpha
  includeSelectors: false

resources:
- ../../base

patches:
- path: patches/postgres-resources.yaml
  target:
    kind: StatefulSet
    name: postgres
- path: patches/redis-resources.yaml
  target:
    kind: Deployment
    name: redis

images:
- name: registry-dal2.penguintech.io/skauswatch/manager
  newName: localhost:32000/skauswatch-manager
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/pki
  newName: localhost:32000/skauswatch-pki
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/sshca
  newName: localhost:32000/skauswatch-sshca
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/monitor
  newName: localhost:32000/skauswatch-monitor
  newTag: latest
- name: registry-dal2.penguintech.io/skauswatch/s3scan
  newName: localhost:32000/skauswatch-s3scan
  newTag: latest
- name: ghcr.io/penguintechinc/skauswatch-scanner
  newName: localhost:32000/skauswatch-scanner
  newTag: latest
- name: ghcr.io/penguintechinc/skauswatch-worker-codescan
  newName: localhost:32000/skauswatch-worker-codescan
  newTag: latest
- name: ghcr.io/penguintechinc/skauswatch-webui
  newName: localhost:32000/skauswatch-webui
  newTag: latest
- name: ghcr.io/penguintechinc/skauswatch-endpoint-agent
  newName: localhost:32000/skauswatch-endpoint-agent
  newTag: latest


replicas:
- name: manager
  count: 1
- name: pki
  count: 1
- name: sshca
  count: 1
- name: monitor
  count: 1
- name: s3scan
  count: 1
- name: scanner
  count: 1
- name: worker-codescan
  count: 1
- name: worker-codescan-celery
  count: 1
- name: webui
  count: 1

configMapGenerator:
- name: skauswatch-config
  behavior: merge
  literals:
  - LOG_LEVEL=DEBUG
  - RELEASE_MODE=false
  - API_URL=http://localhost:8080
  # alpha- prefix from namePrefix requires explicit DB/Redis host overrides
  - DB_HOST=alpha-postgres.skauswatch.svc.cluster.local
  - REDIS_HOST=alpha-redis.skauswatch.svc.cluster.local
  - MANAGER_URL=http://alpha-manager.skauswatch.svc.cluster.local:5000
  # Vault shim env vars — pki and sshca now proxy to Vault services
  - VAULT_PKI_URL=http://vault-pki.vault.svc.cluster.local:8081
  - VAULT_SSHCA_URL=http://vault-sshca.vault.svc.cluster.local:8082

secretGenerator:
- name: skauswatch-secrets
  behavior: merge
  literals:
  - DB_USER=alphauser
  - DB_PASS=alphapass
  - SECRET_KEY=alphasecretkey
  - SECURITY_PASSWORD_SALT=alphasalt
  - LICENSE_KEY=PENG-ALPHA-XXXX-XXXX-XXXX-ABCD
  - REDIS_PASSWORD=alpharedis
  - ENDPOINT_API_KEY=alpha-endpoint-dev-key-2024
  - DATABASE_URL=postgresql://alphauser:alphapass@alpha-postgres.skauswatch.svc.cluster.local:5432/skauswatch
  - REDIS_URL=redis://default:alpharedis@alpha-redis.skauswatch.svc.cluster.local:6379/0
  - CELERY_BROKER_URL=redis://default:alpharedis@alpha-redis.skauswatch.svc.cluster.local:6379/1
- name: skauswatch-codescan-secrets
  behavior: merge
  literals:
  - CODESCAN_DB_USER=codescan
  - CODESCAN_DB_PASS=alphacodescanpass
  - CODESCAN_CELERY_BROKER_URL=redis://:alpharedis@redis:6379/2
  - ANTHROPIC_API_KEY=
  - OPENAI_API_KEY=
