---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skauswatch-alpha

namespace: skauswatch

namePrefix: alpha-

commonLabels:
  environment: alpha
  app.kubernetes.io/version: alpha

bases:
- ../../base

replicas:
- name: manager
  count: 1
- name: pki-server
  count: 1
- name: ssh-ca
  count: 1
- name: aaa-monitor
  count: 1
- name: worker-s3
  count: 1
- name: worker-scanner
  count: 1
- name: worker-darwin
  count: 1
- name: worker-darwin-celery
  count: 1
- name: webui
  count: 1
- name: edr-agent
  count: 1

configMapGenerator:
- name: skauswatch-config
  behavior: merge
  literals:
  - LOG_LEVEL=DEBUG
  - RELEASE_MODE=false
  # IceBox shim env vars — pki-server and ssh-ca now proxy to IceBox services
  - ICEBOX_PKI_URL=http://icebox-pki-server.icebox.svc.cluster.local:8081
  - ICEBOX_SSH_CA_URL=http://icebox-ssh-ca.icebox.svc.cluster.local:8082

secretGenerator:
- name: skauswatch-secrets
  behavior: merge
  literals:
  - DB_USER=alphauser
  - DB_PASS=alphapass
  - SECRET_KEY=alphasecretkey
  - SECURITY_PASSWORD_SALT=alphasalt
  - LICENSE_KEY=PENG-ALPHA-XXXX-XXXX-XXXX-ABCD
  - REDIS_PASSWORD=alpharedis
- name: skauswatch-darwin-secrets
  behavior: merge
  literals:
  - DARWIN_DB_USER=darwin
  - DARWIN_DB_PASS=alphadarwinpass
  - DARWIN_CELERY_BROKER_URL=redis://:alpharedis@redis:6379/2
  - ANTHROPIC_API_KEY=
  - OPENAI_API_KEY=
