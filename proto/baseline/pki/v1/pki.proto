// Canonical source for the skauswatch PKI gRPC contract.
// WIRE-COMPAT POLICY: package name `skauswatch.pki` MUST NOT change.
// Guarded by `buf breaking` in CI. New fields only; never renumber.
syntax = "proto3";

package skauswatch.pki;

option go_package = "github.com/penguintechinc/skauswatch/proto/pki/v1;pkiv1";

// =============================================================================
// PKI Service Definition
// =============================================================================
service PKIService {
    // X.509 Certificate Operations
    rpc IssueX509Certificate(X509CertRequest) returns (X509CertResponse);
    rpc GetX509Certificate(CertQuery) returns (X509CertResponse);
    rpc RevokeX509Certificate(RevokeRequest) returns (RevokeResponse);
    rpc GetX509Status(CertQuery) returns (StatusResponse);
    rpc ListX509Certificates(ListCertRequest) returns (X509CertListResponse);

    // SSH Certificate Operations
    rpc IssueSSHCertificate(SSHCertRequest) returns (SSHCertResponse);
    rpc GetSSHCertificate(CertQuery) returns (SSHCertResponse);
    rpc RevokeSSHCertificate(RevokeRequest) returns (RevokeResponse);
    rpc GetSSHStatus(CertQuery) returns (StatusResponse);
    rpc ListSSHCertificates(ListCertRequest) returns (SSHCertListResponse);

    // CRL/KRL Operations
    rpc GetCRL(Empty) returns (CRLResponse);
    rpc GetKRL(Empty) returns (KRLResponse);

    // CA Information
    rpc GetX509CAInfo(Empty) returns (X509CAInfoResponse);
    rpc GetSSHCAInfo(Empty) returns (SSHCAInfoResponse);

    // Health and Statistics
    rpc HealthCheck(Empty) returns (HealthResponse);
    rpc GetStatistics(Empty) returns (StatisticsResponse);
}

// =============================================================================
// Common Messages
// =============================================================================
message Empty {
    // API version for runtime routing ("v1"); empty treated as v1.
    string api_version = 1;
}

message HealthResponse {
    bool healthy = 1;
    string version = 2;
    string timestamp = 3;
    map<string, bool> components = 4;
}

message CertQuery {
    oneof identifier {
        string id = 1;
        string serial_number = 2;
    }
    string api_version = 3;
}

message RevokeRequest {
    oneof identifier {
        string id = 1;
        string serial_number = 2;
    }
    RevocationReason reason = 3;
    string invalidity_date = 4;  // ISO 8601 format
    string api_version = 5;
}

message RevokeResponse {
    bool success = 1;
    string message = 2;
    string serial_number = 3;
    string revoked_at = 4;
}

message StatusResponse {
    string id = 1;
    string serial_number = 2;
    CertificateStatus status = 3;
    bool is_expired = 4;
    string not_before = 5;
    string not_after = 6;
    string revoked_at = 7;
    string revocation_reason = 8;
}

message ListCertRequest {
    CertificateStatus status = 1;
    string subject = 2;
    string principal = 3;
    int32 page = 4;
    int32 page_size = 5;
    string api_version = 6;
}

// =============================================================================
// Enums
// =============================================================================
enum KeyAlgorithm {
    KEY_ALG_UNSPECIFIED = 0;
    KEY_ALG_RSA = 1;
    KEY_ALG_ECDSA = 2;
    KEY_ALG_ED25519 = 3;
}

enum CertificateStatus {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_REVOKED = 2;
    STATUS_EXPIRED = 3;
    STATUS_PENDING = 4;
}

enum RevocationReason {
    REVOCATION_UNSPECIFIED = 0;
    REVOCATION_KEY_COMPROMISE = 1;
    REVOCATION_CA_COMPROMISE = 2;
    REVOCATION_AFFILIATION_CHANGED = 3;
    REVOCATION_SUPERSEDED = 4;
    REVOCATION_CESSATION_OF_OPERATION = 5;
    REVOCATION_CERTIFICATE_HOLD = 6;
    REVOCATION_PRIVILEGE_WITHDRAWN = 7;
}

enum KeyUsage {
    KU_UNSPECIFIED = 0;
    KU_DIGITAL_SIGNATURE = 1;
    KU_KEY_ENCIPHERMENT = 2;
    KU_DATA_ENCIPHERMENT = 3;
    KU_KEY_AGREEMENT = 4;
    KU_KEY_CERT_SIGN = 5;
    KU_CRL_SIGN = 6;
    KU_ENCIPHER_ONLY = 7;
    KU_DECIPHER_ONLY = 8;
}

enum ExtendedKeyUsage {
    EKU_UNSPECIFIED = 0;
    EKU_SERVER_AUTH = 1;
    EKU_CLIENT_AUTH = 2;
    EKU_CODE_SIGNING = 3;
    EKU_EMAIL_PROTECTION = 4;
    EKU_TIME_STAMPING = 5;
    EKU_OCSP_SIGNING = 6;
}

enum SSHCertificateType {
    SSH_CERT_UNSPECIFIED = 0;
    SSH_CERT_USER = 1;
    SSH_CERT_HOST = 2;
}

// =============================================================================
// X.509 Certificate Messages
// =============================================================================
message X509CertRequest {
    string subject = 1;
    KeyAlgorithm key_algorithm = 2;
    int32 key_size = 3;
    int32 validity_days = 4;
    repeated string san_dns = 5;
    repeated string san_ip = 6;
    repeated string san_email = 7;
    repeated KeyUsage key_usage = 8;
    repeated ExtendedKeyUsage extended_key_usage = 9;
    bool is_ca = 10;
    int32 path_length = 11;
    string csr_pem = 12;
    bool generate_key = 13;
    string requester_id = 14;
    string approval_request_id = 15;
    string api_version = 16;
}

message X509CertResponse {
    string id = 1;
    string serial_number = 2;
    string subject = 3;
    string issuer = 4;
    string not_before = 5;
    string not_after = 6;
    KeyAlgorithm key_algorithm = 7;
    int32 key_size = 8;
    string fingerprint_sha256 = 9;
    string certificate_pem = 10;
    string private_key_pem = 11;
    string chain_pem = 12;
    repeated string san_dns = 13;
    repeated string san_ip = 14;
    CertificateStatus status = 15;
    string created_at = 16;
}

message X509CertListResponse {
    repeated X509CertInfo certificates = 1;
    int32 total = 2;
    int32 page = 3;
    int32 page_size = 4;
    int32 pages = 5;
}

message X509CertInfo {
    string id = 1;
    string serial_number = 2;
    string subject = 3;
    string issuer = 4;
    string not_before = 5;
    string not_after = 6;
    string fingerprint_sha256 = 7;
    CertificateStatus status = 8;
    string revoked_at = 9;
    string created_at = 10;
}

// =============================================================================
// SSH Certificate Messages
// =============================================================================
message SSHCertRequest {
    string public_key = 1;
    SSHCertificateType certificate_type = 2;
    string key_id = 3;
    repeated string principals = 4;
    int32 validity_seconds = 5;
    map<string, string> extensions = 6;
    map<string, string> critical_options = 7;
    repeated string source_addresses = 8;
    string force_command = 9;
    string hostname = 10;
    string requester_id = 11;
    string approval_request_id = 12;
    string api_version = 13;
}

message SSHCertResponse {
    string id = 1;
    string serial_number = 2;
    string key_id = 3;
    SSHCertificateType certificate_type = 4;
    repeated string principals = 5;
    string valid_after = 6;
    string valid_before = 7;
    string key_type = 8;
    string certificate = 9;
    string ca_public_key = 10;
    map<string, string> extensions = 11;
    map<string, string> critical_options = 12;
    CertificateStatus status = 13;
    string created_at = 14;
}

message SSHCertListResponse {
    repeated SSHCertInfo certificates = 1;
    int32 total = 2;
    int32 page = 3;
    int32 page_size = 4;
    int32 pages = 5;
}

message SSHCertInfo {
    string id = 1;
    string serial_number = 2;
    string key_id = 3;
    SSHCertificateType certificate_type = 4;
    repeated string principals = 5;
    string valid_after = 6;
    string valid_before = 7;
    string key_type = 8;
    string hostname = 9;
    CertificateStatus status = 10;
    string revoked_at = 11;
    string created_at = 12;
}

// =============================================================================
// CRL/KRL Messages
// =============================================================================
message CRLResponse {
    int32 crl_number = 1;
    string this_update = 2;
    string next_update = 3;
    repeated RevokedCertEntry revoked_certificates = 4;
    string crl_pem = 5;
}

message KRLResponse {
    int32 version = 1;
    string generated_at = 2;
    repeated RevokedCertEntry revoked_keys = 3;
    bytes krl_binary = 4;
}

message RevokedCertEntry {
    string serial_number = 1;
    string revoked_at = 2;
    string reason = 3;
}

// =============================================================================
// CA Info Messages
// =============================================================================
message X509CAInfoResponse {
    string subject = 1;
    string issuer = 2;
    string not_before = 3;
    string not_after = 4;
    string fingerprint_sha256 = 5;
    int64 serial_counter = 6;
    int32 crl_number = 7;
    string ca_certificate_pem = 8;
    string ocsp_responder_url = 9;
    repeated string crl_distribution_points = 10;
}

message SSHCAInfoResponse {
    string ca_public_key = 1;
    string key_type = 2;
    string fingerprint = 3;
    int64 serial_counter = 4;
    int32 krl_version = 5;
}

// =============================================================================
// Statistics Messages
// =============================================================================
message StatisticsResponse {
    X509Statistics x509 = 1;
    SSHStatistics ssh = 2;
    string timestamp = 3;
}

message X509Statistics {
    int32 total = 1;
    int32 active = 2;
    int32 revoked = 3;
    int32 expired = 4;
    int32 expiring_soon = 5;
}

message SSHStatistics {
    int32 total = 1;
    int32 active = 2;
    int32 revoked = 3;
}
