version: '3.8'

services:
  # PostgreSQL Database with security enhancements
  postgres:
    image: postgres:16-alpine
    container_name: skauswatch-postgres
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skauswatch}
      POSTGRES_USER: ${POSTGRES_USER:-skauswatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skauswatch_dev_password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skauswatch}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - skauswatch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Redis for caching and message queue with security enhancements
  redis:
    image: redis:7-alpine
    container_name: skauswatch-redis
    user: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./deployment/redis/redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - skauswatch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true

  # Manager Service - Main orchestration service
  manager:
    build:
      context: .
      dockerfile: services/manager/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-0.1.0}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD)}
    container_name: skauswatch-manager
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-skauswatch_dev_password}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_NAME=manager
      - SERVICE_PORT=8000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROMETHEUS_METRICS_PORT=9000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_jwt_secret_key_change_in_production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    ports:
      - "${MANAGER_PORT:-8000}:8000"
      - "${MANAGER_METRICS_PORT:-9000}:9000"
    volumes:
      - ./services/manager:/app/services/manager${VOLUME_MOUNT_OPTIONS:-:rw}
      - ./shared:/app/shared:ro
      - manager_logs:/app/logs
      - manager_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skauswatch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # PKI Server Service - Public Key Infrastructure management
  pki-server:
    build:
      context: .
      dockerfile: services/pki-server/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-0.1.0}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD)}
    container_name: skauswatch-pki-server
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-skauswatch_dev_password}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/1
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_NAME=pki-server
      - SERVICE_PORT=8001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROMETHEUS_METRICS_PORT=9001
      - PKI_ROOT_DIR=/app/certs
      - PKI_CA_DIR=/app/ca
      - CA_CERT_VALIDITY_DAYS=${CA_CERT_VALIDITY_DAYS:-3650}
      - SERVER_CERT_VALIDITY_DAYS=${SERVER_CERT_VALIDITY_DAYS:-365}
    ports:
      - "${PKI_SERVER_PORT:-8001}:8001"
      - "${PKI_SERVER_METRICS_PORT:-9001}:9001"
    volumes:
      - ./services/pki-server:/app/services/pki-server${VOLUME_MOUNT_OPTIONS:-:rw}
      - ./shared:/app/shared:ro
      - pki_certs:/app/certs
      - pki_ca:/app/ca
      - pki_logs:/app/logs
      - pki_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skauswatch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # SSH CA Service - SSH Certificate Authority management
  ssh-ca:
    build:
      context: .
      dockerfile: services/ssh-ca/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-0.1.0}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD)}
    container_name: skauswatch-ssh-ca
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-skauswatch_dev_password}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/2
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_NAME=ssh-ca
      - SERVICE_PORT=8002
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROMETHEUS_METRICS_PORT=9002
      - SSH_CA_DIR=/app/ssh-ca
      - SSH_KEYS_DIR=/app/keys
      - SSH_CERT_VALIDITY_HOURS=${SSH_CERT_VALIDITY_HOURS:-24}
      - SSH_HOST_CERT_VALIDITY_DAYS=${SSH_HOST_CERT_VALIDITY_DAYS:-365}
    ports:
      - "${SSH_CA_PORT:-8002}:8002"
      - "${SSH_CA_METRICS_PORT:-9002}:9002"
    volumes:
      - ./services/ssh-ca:/app/services/ssh-ca${VOLUME_MOUNT_OPTIONS:-:rw}
      - ./shared:/app/shared:ro
      - ssh_keys:/app/keys
      - ssh_ca:/app/ssh-ca
      - ssh_ca_logs:/app/logs
      - ssh_ca_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skauswatch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # AAA Monitor Service - Authentication, Authorization, and Accounting monitoring
  aaa-monitor:
    build:
      context: .
      dockerfile: services/aaa-monitor/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-0.1.0}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD)}
    container_name: skauswatch-aaa-monitor
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-skauswatch_dev_password}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/3
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_NAME=aaa-monitor
      - SERVICE_PORT=8003
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROMETHEUS_METRICS_PORT=9003
      - AUDIT_LOG_DIR=/app/audit
      - SYSLOG_PORT=${SYSLOG_PORT:-514}
      - MAX_LOG_RETENTION_DAYS=${MAX_LOG_RETENTION_DAYS:-90}
    ports:
      - "${AAA_MONITOR_PORT:-8003}:8003"
      - "${AAA_MONITOR_METRICS_PORT:-9003}:9003"
      - "${SYSLOG_PORT:-514}:514/udp"
    volumes:
      - ./services/aaa-monitor:/app/services/aaa-monitor${VOLUME_MOUNT_OPTIONS:-:rw}
      - ./shared:/app/shared:ro
      - aaa_audit:/app/audit
      - aaa_logs:/app/logs
      - aaa_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skauswatch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: skauswatch-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - skauswatch-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.2.2
    container_name: skauswatch-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - skauswatch-network
    depends_on:
      - prometheus

  # Celery Worker for background tasks
  celery-worker:
    build:
      context: .
      dockerfile: services/manager/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-0.1.0}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD)}
    container_name: skauswatch-celery-worker
    command: celery -A skauswatch.services.manager.celery worker --loglevel=${LOG_LEVEL,,} --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-skauswatch_dev_password}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_NAME=celery-worker
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-4}
    volumes:
      - ./services/manager:/app/services/manager${VOLUME_MOUNT_OPTIONS:-:rw}
      - ./shared:/app/shared:ro
      - celery_logs:/app/logs
      - celery_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skauswatch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true

  # Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: .
      dockerfile: services/manager/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-0.1.0}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD)}
    container_name: skauswatch-celery-beat
    command: celery -A skauswatch.services.manager.celery beat --loglevel=${LOG_LEVEL,,} --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-skauswatch}:${POSTGRES_PASSWORD:-skauswatch_dev_password}@postgres:5432/${POSTGRES_DB:-skauswatch}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_NAME=celery-beat
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./services/manager:/app/services/manager${VOLUME_MOUNT_OPTIONS:-:rw}
      - ./shared:/app/shared:ro
      - celery_beat_logs:/app/logs
      - celery_beat_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skauswatch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  # Service-specific volumes
  manager_logs:
    driver: local
  manager_data:
    driver: local
  pki_certs:
    driver: local
  pki_ca:
    driver: local
  pki_logs:
    driver: local
  pki_data:
    driver: local
  ssh_keys:
    driver: local
  ssh_ca:
    driver: local
  ssh_ca_logs:
    driver: local
  ssh_ca_data:
    driver: local
  aaa_audit:
    driver: local
  aaa_logs:
    driver: local
  aaa_data:
    driver: local
  celery_logs:
    driver: local
  celery_data:
    driver: local
  celery_beat_logs:
    driver: local
  celery_beat_data:
    driver: local

networks:
  skauswatch-network:
    driver: bridge