services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: skauswatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: skauswatch-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Manager Service (Quart API + gRPC)
  manager:
    build:
      context: ./services/manager-new
      dockerfile: Dockerfile
    container_name: skauswatch-manager
    environment:
      - QUART_ENV=${QUART_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-jwt-secret}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-app_db}
      - DB_USER=${POSTGRES_USER:-app_user}
      - DB_PASS=${POSTGRES_PASSWORD:-password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      - REDIS_KEY_PREFIX=skauswatch
      - GRPC_ENABLED=true
      - GRPC_PORT=50051
      # S3 Scan Config
      - S3_SCAN_ENABLED=${S3_SCAN_ENABLED:-true}
      - S3_SCAN_MAX_FILE_SIZE_MB=${S3_SCAN_MAX_FILE_SIZE_MB:-100}
      - S3_CRED_ENCRYPTION_KEY=${S3_CRED_ENCRYPTION_KEY:-change-me-encryption-key-32b}
      # Internal Minio for adhoc uploads
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      # TI Integration
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
    ports:
      - "${MANAGER_PORT:-5004}:5000"
      - "${MANAGER_GRPC_PORT:-50054}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # Minio Object Storage (S3-compatible, for adhoc uploads)
  minio:
    image: minio/minio:latest
    container_name: skauswatch-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9020}:9000"
      - "${MINIO_CONSOLE_PORT:-9021}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ClamAV Virus Definition Updater (shared volume)
  clamav-freshclam:
    image: clamav/clamav:stable
    container_name: skauswatch-freshclam
    entrypoint: /usr/bin/freshclam
    command: ["--daemon", "--foreground", "--checks=1"]
    volumes:
      - clamav_db:/var/lib/clamav
    restart: unless-stopped
    networks:
      - app-network

  # Worker-S3 Service (Malware Scanning Workers)
  worker-s3:
    build:
      context: ./services/worker-s3
      dockerfile: Dockerfile
    # Note: No container_name when using replicas
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    environment:
      # Redis connection
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      - REDIS_KEY_PREFIX=skauswatch
      - CONSUMER_GROUP=s3scan-workers
      - CONSUMER_NAME=worker-${HOSTNAME:-1}
      # Database (for result writes)
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-app_db}
      - DB_USER=${POSTGRES_USER:-app_user}
      - DB_PASS=${POSTGRES_PASSWORD:-password}
      # Worker tuning
      - THREAD_POOL_SIZE=${WORKER_THREAD_POOL_SIZE:-4}
      - MAX_CONCURRENT_TASKS=${WORKER_MAX_CONCURRENT_TASKS:-10}
      - MAX_FILE_SIZE_MB=${S3_SCAN_MAX_FILE_SIZE_MB:-100}
      - SCAN_TIMEOUT_SEC=${WORKER_SCAN_TIMEOUT_SEC:-120}
      # ClamAV
      - CLAMD_SOCKET=/var/run/clamav/clamd.sock
      # YARA (optional)
      - YARA_ENABLED=${YARA_ENABLED:-false}
      - YARA_RULES_PATH=/yara_rules
      # TI enrichment
      - TI_ENABLED=${TI_ENABLED:-true}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      # gRPC to manager
      - MANAGER_GRPC_ADDR=manager:50051
    volumes:
      - clamav_db:/var/lib/clamav:ro
      - ./config/yara_rules:/yara_rules:ro
      - /tmp/s3-scan-workspace:/workspace
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clamav-freshclam:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import redis; r=redis.from_url('redis://:${REDIS_PASSWORD:-password}@redis:6379/0'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # PKI Server
  pki-server:
    build:
      context: ./services/pki-server-new
      dockerfile: Dockerfile
    container_name: skauswatch-pki-server
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-jwt-secret}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-app_db}
      - DB_USER=${POSTGRES_USER:-app_user}
      - DB_PASS=${POSTGRES_PASSWORD:-password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/0
    ports:
      - "${PKI_SERVER_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # SSH CA Service
  ssh-ca:
    build:
      context: ./services/ssh-ca
      dockerfile: Dockerfile
    container_name: skauswatch-ssh-ca
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-jwt-secret}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-app_db}
      - DB_USER=${POSTGRES_USER:-app_user}
      - DB_PASS=${POSTGRES_PASSWORD:-password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/0
    ports:
      - "${SSH_CA_PORT:-5002}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # AAA Monitor Service
  aaa-monitor:
    build:
      context: ./services/aaa-monitor
      dockerfile: Dockerfile
    container_name: skauswatch-aaa-monitor
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-jwt-secret}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-app_db}
      - DB_USER=${POSTGRES_USER:-app_user}
      - DB_PASS=${POSTGRES_PASSWORD:-password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/0
    ports:
      - "${AAA_MONITOR_PORT:-5003}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: skauswatch-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - app-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: skauswatch-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - app-network
    restart: unless-stopped

  # Worker-Scanner Service (Vulnerability Scanner)
  worker-scanner:
    build:
      context: ./services/worker-scanner
      dockerfile: Dockerfile
    container_name: skauswatch-worker-scanner
    environment:
      - WORKER_SCANNER_PORT=5004
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-app_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/1
    ports:
      - "${WORKER_SCANNER_PORT:-5004}:5004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # WebUI Service (React Frontend)
  webui:
    build:
      context: ./services/webui
      dockerfile: Dockerfile
    container_name: skauswatch-webui
    environment:
      - PORT=3000
      - API_URL=http://manager:5000
    ports:
      - "${WEBUI_PORT:-3000}:3000"
    depends_on:
      manager:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # EDR Agent Service (Go EDR Agent)
  edr-agent:
    build:
      context: ./services/edr-agent
      dockerfile: Dockerfile
    container_name: skauswatch-edr-agent
    environment:
      - MANAGER_URL=http://manager:5000
    depends_on:
      manager:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  minio_data:
    driver: local
  clamav_db:
    driver: local

networks:
  app-network:
    driver: bridge
