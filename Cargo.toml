[workspace]
resolver = "3"
members = ["crates/*", "services/manager", "services/worker-s3", "services/log-receiver"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/penguintechinc/skauswatch"
authors = ["Penguin Tech Inc <support@penguintech.io>"]

[workspace.dependencies]
# Shared libraries (penguin-libs) — pinned git rev until 0.1.0 hits crates.io
penguin-licensing = { git = "https://github.com/penguintechinc/penguin-libs", rev = "d9b88bfe2959ea04845b12666c7c193b1028507f", package = "penguin-licensing" }

# Internal crates
skauswatch-common = { path = "crates/skauswatch-common" }
skauswatch-telemetry = { path = "crates/skauswatch-telemetry" }
skauswatch-db = { path = "crates/skauswatch-db" }
skauswatch-auth = { path = "crates/skauswatch-auth" }
skauswatch-streams = { path = "crates/skauswatch-streams" }
skauswatch-proto = { path = "crates/skauswatch-proto" }
skauswatch-ai = { path = "crates/skauswatch-ai" }
skauswatch-s3 = { path = "crates/skauswatch-s3" }

# Async runtime
tokio = { version = "=1.52.3", features = ["full"] }
tokio-stream = "=0.1.18"
futures = "=0.3.32"
async-trait = "=0.1.89"

# HTTP / REST
axum = { version = "=0.8.9", features = ["multipart"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.0", features = ["trace", "compression-gzip"] }
http = "=1.4.2"
utoipa = { version = "=5.5.0", features = ["axum_extras", "chrono", "uuid"] }

# gRPC
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic-prost-build = "=0.14.6"
protox = "=0.9.1"

# Database
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "chrono", "uuid", "json", "macros", "migrate"] }

# Cache / streams (Valkey/Redis)
fred = "=10.1.0"

# Object storage
aws-config = "=1.9.0"
aws-sdk-s3 = "=1.138.0"

# Content scanning (worker-s3): magic-byte file typing + SHA1 (md-5/sha2 above)
infer = "=0.22.0"
sha1 = "=0.10.7"

# AuthN/Z
bcrypt = "=0.19.2"
email_address = "=0.2.9"
hmac = "=0.12.1"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["rust_crypto"] }
openidconnect = "=4.0.1"

# HTTP client
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "gzip"] }

# Serialization
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

# Observability
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
metrics = "=0.24.6"
metrics-exporter-prometheus = "=0.18.3"

# Utilities
thiserror = "=2.0.18"
anyhow = "=1.0.103"
figment = { version = "=0.10.19", features = ["env"] }
arc-swap = "=1.9.2"
sha2 = "=0.10.9"
md-5 = "=0.11.0"
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.23.5", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
bytes = "=1.12.1"
base64 = "=0.22.1"
clap = { version = "=4.6.1", features = ["derive", "env"] }
tokio-cron-scheduler = "=0.15.1"

# Test-only
wiremock = "=0.6.5"
mockall = "=0.15.0"
axum-test = "=21.0.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
