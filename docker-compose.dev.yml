version: '3.8'

# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # PostgreSQL - expose port for local dev tools
  postgres:
    ports:
      - "5432:5432"

  # Redis - expose port for local dev tools
  redis:
    ports:
      - "6379:6379"

  # Manager - development mode with hot reload
  manager:
    environment:
      - QUART_ENV=development
      - QUART_DEBUG=true
    volumes:
      - ./services/manager:/app

  # PKI Server - development mode with hot reload
  pki:
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
    volumes:
      - ./services/pki:/app

  # SSH CA - development mode with hot reload
  sshca:
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
    volumes:
      - ./services/sshca:/app

  # Monitor - development mode with hot reload
  monitor:
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
    volumes:
      - ./services/monitor:/app

  # Worker S3 - development mode with hot reload
  s3scan:
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
    volumes:
      - ./services/s3scan:/app

  # Worker Scanner - development mode with hot reload
  scanner:
    environment:
      - FLASK_DEBUG=1
      - CELERY_ALWAYS_EAGER=true
    volumes:
      - ./services/scanner:/app

  # WebUI - development mode with hot reload
  webui:
    environment:
      - NODE_ENV=development
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./services/webui:/app
      - ./services/webui/node_modules:/app/node_modules

  # ENDPOINT Agent - development mode with debug logging
  endpoint-agent:
    environment:
      - LOG_LEVEL=debug
    volumes:
      - ./services/endpoint-agent:/app
