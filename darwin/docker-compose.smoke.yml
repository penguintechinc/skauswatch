version: '3.8'

# Smoke test override - uses simplified Dockerfile for quick validation
# Disables monitoring services to avoid port conflicts during testing
services:
  flask-backend:
    build:
      context: .
      dockerfile: services/flask-backend/Dockerfile.smoke
    container_name: darwin-flask-smoke
    volumes: !reset []  # Override volume mount to use containerized code

  webui:
    container_name: darwin-webui
    volumes: !reset []  # Override volume mount to use containerized code

  # Disable monitoring services for smoke tests
  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    deploy:
      replicas: 0
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:12.4.2@sha256:83749231c3835e390a3144e5e940203e42b9589761f20ef3169c716e734ad505
    deploy:
      replicas: 0
    profiles:
      - monitoring
